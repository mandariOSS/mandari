# Rolle „data“: PostgreSQL, Redis, Elasticsearch (Issue #55).
#
# Zusammen mit der Basisdatei verwenden, am einfachsten dauerhaft in der .env:
#   COMPOSE_FILE=docker-compose.yml:deploy/roles/data.yml
#   DATA_BIND=10.0.0.10        # Adresse im privaten Netz, an die die Dienste gebunden werden
#
# Die Datendienste werden NUR an DATA_BIND veröffentlicht – niemals an eine öffentliche
# Adresse. Der Weg zu den web-/worker-Servern gehört in ein privates Netz (VLAN, WireGuard).
# Alle anderen Dienste sind hier abgeschaltet (Profil „aus“ wird nie aktiviert).
#
# Optional: PgBouncer als Verbindungs-Pooler, aktivieren mit COMPOSE_PROFILES=pgbouncer
# (Dienst aus der Basisdatei, hier zusätzlich an DATA_BIND veröffentlicht). Nur die Anwendung
# auf den web-Servern geht darüber (DATA_PG_PORT=6432 und MANDARI_DB_PGBOUNCER=true, siehe
# web.yml); Website, Worker, Ingestor und Migrationen verbinden sich direkt (Port 5432).

services:
  postgres:
    ports:
      - "${DATA_BIND:?DATA_BIND (private Adresse) fehlt}:5432:5432"

  redis:
    ports:
      - "${DATA_BIND:?DATA_BIND (private Adresse) fehlt}:6379:6379"

  elasticsearch:
    ports:
      - "${DATA_BIND:?DATA_BIND (private Adresse) fehlt}:9200:9200"

  # Image, Transaktionsmodus, Pool je Datenbank und Healthcheck aus der Basisdatei (Profil pgbouncer)
  pgbouncer:
    environment:
      # Wie bisher alle Datenbanken über den Pooler
      DB_NAME: "*"
      # Mehrere web-Server: Summe ihrer Pools (MANDARI_DB_POOL_MAX je Prozess mal Prozesse) mit Reserve
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
    ports:
      - "${DATA_BIND:?DATA_BIND (private Adresse) fehlt}:6432:5432"

  caddy:
    profiles: ["aus"]
  mandari:
    profiles: ["aus"]
  minutes-orchestrator:
    profiles: ["aus"]
  website:
    profiles: ["aus"]
  ingestor:
    profiles: ["aus"]
  worker:
    profiles: ["aus"]
  worker-heavy:
    profiles: ["aus"]
  worker-live:
    profiles: ["aus"]
