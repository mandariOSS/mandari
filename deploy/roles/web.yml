# Rolle „web“: Caddy, Anwendung, Website (Issue #55).
#
# In der .env:
#   COMPOSE_FILE=docker-compose.yml:deploy/roles/web.yml
#   DATA_HOST=10.0.0.10        # Server mit der Rolle „data“ (privates Netz)
#   DATA_PG_PORT=5432          # 6432, wenn dort PgBouncer aktiv ist, dann zusammen mit:
#   MANDARI_DB_PGBOUNCER=true  # Anwendung für den Transaktionsmodus einstellen (Issue #1060)
#
# Über PgBouncer geht nur die Anwendung (mandari). Ihre Migrationen (migrate, safemigrate) und
# die Website verbinden sich direkt mit PostgreSQL (Port 5432 auf DATA_HOST).
#
# Die Datendienste laufen nicht hier; die Anwendung verbindet sich über DATA_HOST.
# Mehrere web-Server brauchen gemeinsame Ablagen für Medien und Dokument-Cache
# (mandari_media, mandari_files), z. B. per NFS – siehe docs/MEHR_SERVER_BETRIEB.md.
# Wiederkehrende Verwaltungsbefehle laufen als Zeitpläne im Worker (DEPLOYMENT.md, „Geplante
# Aufgaben“), nicht per Cron auf den web-Servern; die Singleton-Sperre in Redis ist das Sicherheitsnetz.

services:
  postgres:
    profiles: ["aus"]
  redis:
    profiles: ["aus"]
  elasticsearch:
    profiles: ["aus"]
  minutes-orchestrator:
    profiles: ["aus"]
  ingestor:
    profiles: ["aus"]
  worker:
    profiles: ["aus"]
  worker-heavy:
    profiles: ["aus"]
  worker-live:
    profiles: ["aus"]
  # PgBouncer läuft auf dem Datenserver
  pgbouncer:
    profiles: !override ["aus"]

  mandari:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mandari}:${POSTGRES_PASSWORD}@${DATA_HOST:?DATA_HOST (Server der Rolle data) fehlt}:${DATA_PG_PORT:-5432}/${POSTGRES_DB:-mandari}
      # Mit DATA_PG_PORT=6432 (PgBouncer) auf true: keine serverseitigen Cursor, keine vorbereiteten Anweisungen
      DB_PGBOUNCER: ${MANDARI_DB_PGBOUNCER:-false}
      # migrate und safemigrate mit DB_PGBOUNCER direkt an PostgreSQL, am Pooler vorbei
      DB_DIRECT_URL: postgresql://${POSTGRES_USER:-mandari}:${POSTGRES_PASSWORD}@${DATA_HOST:?DATA_HOST (Server der Rolle data) fehlt}:5432/${POSTGRES_DB:-mandari}
      REDIS_URL: redis://:${REDIS_PASSWORD}@${DATA_HOST:?DATA_HOST (Server der Rolle data) fehlt}:6379
      ELASTICSEARCH_URL: http://${DATA_HOST:?DATA_HOST (Server der Rolle data) fehlt}:9200
    depends_on: !reset []

  website:
    environment:
      # Direkt (Port 5432): Die Website ist für den Transaktionsmodus von PgBouncer nicht eingestellt
      WEBSITE_DATABASE_URL: postgresql://${POSTGRES_USER:-mandari}:${POSTGRES_PASSWORD}@${DATA_HOST:?DATA_HOST (Server der Rolle data) fehlt}:5432/${WEBSITE_DB:-mandari_website}
    depends_on: !reset []
