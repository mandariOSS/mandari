# =============================================================================
# mandari – Standardwerte
# =============================================================================
# Vollständige Beschreibung: deploy/kubernetes/README.md
# Beispiele: values-minimal.yaml (ein Knoten), values-production.yaml (mehrere Knoten)
# =============================================================================

# -----------------------------------------------------------------------------
# Pflichtangabe: unter welcher Adresse ist die Installation erreichbar?
# -----------------------------------------------------------------------------
domain: mandari.example.com

image:
  registry: ghcr.io
  repository: mandarioss
  # Ein Tag für alle drei Anwendungs-Images (mandari, website, ingestor).
  # "latest" = jeweils neuester Stand; für Produktion eine feste Version setzen.
  tag: latest
  pullPolicy: IfNotPresent
  # Für private Registries: Name eines vorhandenen imagePullSecret
  pullSecrets: []

# -----------------------------------------------------------------------------
# Zugangsdaten
# -----------------------------------------------------------------------------
# Werden beim ersten Installieren zufällig erzeugt und bei Upgrades beibehalten.
# WICHTIG: encryptionKey verschlüsselt Fachdaten. Geht er verloren, sind die
# verschlüsselten Inhalte unwiederbringlich unlesbar – nach der Installation sichern:
#   kubectl -n <namespace> get secret <release>-secrets -o yaml > mandari-secrets.yaml
secrets:
  # Vorhandenes Secret verwenden statt eines erzeugten (Schlüssel siehe README)
  existingSecret: ""
  secretKey: ""
  # Base64 von genau 32 Byte: openssl rand -base64 32 (kein beliebiges Passwort; das Chart prüft das)
  encryptionKey: ""
  # Nur während eines Schlüsselwechsels: der bisherige encryptionKey (wird nur zum Lesen
  # verwendet). Ablauf in docs/KRYPTOKONZEPT.md, danach wieder leeren.
  encryptionKeyPrevious: ""
  websiteSecretKey: ""

# Admin-Konto, das der Migrations-Job anlegt (leer = kein Konto anlegen)
adminUser:
  email: ""
  password: ""

# -----------------------------------------------------------------------------
# Ereignistechnik: Schalter je Erzeuger und „Worker lebt“ (DEPLOYMENT.md, „Worker“;
# docs/OPARL_API.md, „Betrieb“). Reihenfolge beim Einschalten: Worker → Erzeuger → Feed.
# -----------------------------------------------------------------------------
events:
  # Erzeuger: Ingestor und Anwendung (Rücknahmen aus Session) melden Änderungen am RIS-Bestand
  # als Ereignisse (INGESTOR_EVENTS_ENABLED). Erst einschalten, wenn der Worker läuft.
  producers: false
  # Änderungsfeed und Snapshot je Kommune (OPARL_CHANGES_ENABLED); erst nach den Erzeugern
  changesFeed: false
  # Journal nach der Frist aufräumen (EVENTS_JOURNAL_PURGE_ENABLED, täglich im Worker); vorher
  # `manage.py events_purge --dry-run` prüfen. Frist in Tagen, nie kürzer als die Gültigkeit der Feed-Cursor.
  journalPurge: false
  journalRetentionDays: 90
  # „Worker lebt“ an die Statusseite (WORKER_PUSH_URL, externer Endpunkt von Gatus); das Token
  # WORKER_PUSH_TOKEN über app.extraEnvFromSecret
  workerPushUrl: ""

# -----------------------------------------------------------------------------
# Anwendung (Django)
# -----------------------------------------------------------------------------
app:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  # Zusätzliche Umgebungsvariablen, z. B. SMTP oder MISTRAL_API_KEY
  extraEnv: {}
  # Beispiel:
  #   EMAIL_HOST: smtp.example.org
  #   EMAIL_PORT: "587"
  extraEnvFromSecret: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Marketing-Website (Wagtail) – optional
website:
  enabled: false
  replicas: 1
  # Eigener Hostname; leer = derselbe Host unter /website
  host: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# OParl-Synchronisation (Hintergrunddienst, kein Port)
ingestor:
  enabled: true
  # Intervall der inkrementellen Synchronisation in Minuten
  syncInterval: 15
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Worker für Ereignisse, Aufträge und Zeitpläne (manage.py events_worker), gleiches Image
# und dieselbe Umgebung wie die Anwendung (inkl. app.extraEnv). Mehrere Repliken sind möglich.
worker:
  enabled: true
  replicas: 1
  # /metrics (Prometheus) und /health (Probes) des Workers
  metricsPort: 9091
  # Speichergrenze des Runners in MB; unter dem Speicherlimit halten (TASKS_MAX_MEMORY_MB)
  maxMemoryMb: 400
  # Warteschlangen dieses Workers, solange worker.heavy.enabled: alle außer ocr und ai. Ohne
  # eigenen Worker für die Texterkennung bedient er alle.
  queues: "default,mail,index,adapter"
  # Zusätzliche Argumente, z. B. ["--stale-after", "600"]
  extraArgs: []
  # Nur für die Worker, z. B. EVENTS_DB_DIRECT_URL hinter PgBouncer
  extraEnv: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # Verwaltungsbefehle der Zeitpläne laufen als eigene Prozesse im Worker (früher Host-Cron)
      memory: 1Gi
  # nodeSelector, tolerations und affinity gelten für beide Worker
  nodeSelector: {}
  tolerations: []
  # Die Worker binden media und files ein wie die Anwendung. Mit persistence.accessMode
  # ReadWriteOnce auf mehreren Knoten an die Anwendung binden, z. B.
  #   podAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       - labelSelector:
  #           matchLabels: {app.kubernetes.io/component: app}
  #         topologyKey: kubernetes.io/hostname
  # oder ReadWriteMany verwenden (deploy/kubernetes/README.md, „Skalieren“).
  affinity: {}
  # Texterkennung und KI (Warteschlangen ocr, ai) in einem eigenen Worker: Jeder Neustart eines
  # Runners wartet auf seinen längsten laufenden Auftrag (ocr bis 30 min); getrennt warten Mails
  # und Suche nicht darauf, und der Speicherbedarf bekommt ein eigenes Limit.
  heavy:
    enabled: true
    replicas: 1
    queues: "ocr,ai"
    maxMemoryMb: 800
    extraArgs: []
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

# -----------------------------------------------------------------------------
# Datenhaltung
# -----------------------------------------------------------------------------
# Mitgelieferte Dienste sind für kleine Installationen gedacht. Für Produktion
# empfehlen wir verwaltete Dienste: enabled=false und external* setzen.
postgres:
  enabled: true
  image: postgres:16-alpine
  database: mandari
  username: mandari
  password: ""          # leer = wird erzeugt
  storage:
    size: 20Gi
    className: ""       # leer = Standardklasse des Clusters
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

externalDatabase:
  # Vollständige URL, z. B. postgresql://benutzer:passwort@host:5432/mandari
  url: ""
  # Getrennte Datenbank der Website (nur nötig, wenn website.enabled=true)
  websiteUrl: ""

redis:
  enabled: true
  image: redis:7-alpine
  password: ""          # leer = wird erzeugt
  maxmemory: 256mb
  storage:
    size: 2Gi
    className: ""

externalRedis:
  url: ""               # z. B. redis://:passwort@host:6379

elasticsearch:
  # Volltextsuche. Aus: die Suche fällt auf die Datenbank zurück (langsamer,
  # aber funktionsfähig) – sinnvoll für kleine Installationen.
  enabled: true
  image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
  javaOpts: "-Xms512m -Xmx1g"
  storage:
    size: 10Gi
    className: ""
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 2Gi

externalElasticsearch:
  url: ""

# Medien (Logos, Uploads) und heruntergeladene RIS-Dokumente
persistence:
  # ReadWriteMany erlaubt mehrere Anwendungs-Repliken. Kann die Speicherklasse das
  # nicht, muss app.replicas auf 1 bleiben.
  accessMode: ReadWriteOnce
  media:
    size: 10Gi
    className: ""
  files:
    size: 50Gi
    className: ""

# -----------------------------------------------------------------------------
# Erreichbarkeit
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  # TLS über cert-manager. Ohne cert-manager: tls.enabled=false und eigenes
  # Zertifikat als Secret hinterlegen (tls.secretName).
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
    secretName: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"

service:
  type: ClusterIP
  port: 80

# -----------------------------------------------------------------------------
# Betrieb
# -----------------------------------------------------------------------------
# Migrationen und Rolleneinrichtung laufen als Job vor jedem Upgrade
migrationJob:
  enabled: true
  backoffLimit: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

logging:
  # json (empfohlen im Betrieb) oder text
  format: json
  level: INFO

tracing:
  # OpenTelemetry: leer = aus
  otlpEndpoint: ""

timezone: Europe/Berlin

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Netzwerkrichtlinie: schränkt ein, wer die Datenbank erreichen darf
networkPolicy:
  enabled: false

commonLabels: {}
commonAnnotations: {}
