{{- if .Values.elasticsearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mandari.fullname" . }}-elasticsearch
  labels:
    {{- include "mandari.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: http
      name: http
  selector:
    {{- include "mandari.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mandari.fullname" . }}-elasticsearch
  labels:
    {{- include "mandari.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
spec:
  serviceName: {{ include "mandari.fullname" . }}-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      {{- include "mandari.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: elasticsearch
  template:
    metadata:
      labels:
        {{- include "mandari.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: elasticsearch
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: {{ .Values.elasticsearch.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Ein-Knoten-Betrieb ohne Authentifizierung; nur clusterintern erreichbar.
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: {{ .Values.elasticsearch.javaOpts | quote }}
            - name: bootstrap.memory_lock
              value: "false"
          ports:
            - name: http
              containerPort: 9200
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.elasticsearch.storage.className }}
        storageClassName: {{ .Values.elasticsearch.storage.className | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.elasticsearch.storage.size }}
{{- end }}
