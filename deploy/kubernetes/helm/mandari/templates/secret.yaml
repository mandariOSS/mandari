{{- if not .Values.secrets.existingSecret }}
{{- $pgPassword := include "mandari.secretValue" (dict "ctx" $ "key" "postgres-password" "value" .Values.postgres.password "length" 32) -}}
{{- $redisPassword := include "mandari.secretValue" (dict "ctx" $ "key" "redis-password" "value" .Values.redis.password "length" 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mandari.fullname" . }}-secrets
  labels:
    {{- include "mandari.labels" . | nindent 4 }}
  annotations:
    # Bleibt beim Deinstallieren erhalten, damit verschlüsselte Daten in behaltenen
    # Volumes lesbar bleiben. Bewusst entfernen: kubectl delete secret <name>
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  secret-key: {{ include "mandari.secretValue" (dict "ctx" $ "key" "secret-key" "value" .Values.secrets.secretKey "length" 50) }}
  encryption-key: {{ include "mandari.secretValue" (dict "ctx" $ "key" "encryption-key" "value" .Values.secrets.encryptionKey "length" 32) }}
  website-secret-key: {{ include "mandari.secretValue" (dict "ctx" $ "key" "website-secret-key" "value" .Values.secrets.websiteSecretKey "length" 50) }}
  postgres-password: {{ $pgPassword }}
  redis-password: {{ $redisPassword }}
  {{- if .Values.postgres.enabled }}
  database-url: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.username (b64dec $pgPassword) (include "mandari.postgresHost" .) .Values.postgres.database | b64enc }}
  website-database-url: {{ printf "postgresql://%s:%s@%s:5432/%s_website" .Values.postgres.username (b64dec $pgPassword) (include "mandari.postgresHost" .) .Values.postgres.database | b64enc }}
  {{- else }}
  {{- if not .Values.externalDatabase.url }}
  {{- fail "postgres.enabled=false: bitte externalDatabase.url setzen" }}
  {{- end }}
  database-url: {{ .Values.externalDatabase.url | b64enc }}
  website-database-url: {{ default .Values.externalDatabase.url .Values.externalDatabase.websiteUrl | b64enc }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  redis-url: {{ printf "redis://:%s@%s:6379/0" (b64dec $redisPassword) (include "mandari.redisHost" .) | b64enc }}
  {{- else }}
  {{- if not .Values.externalRedis.url }}
  {{- fail "redis.enabled=false: bitte externalRedis.url setzen" }}
  {{- end }}
  redis-url: {{ .Values.externalRedis.url | b64enc }}
  {{- end }}
  {{- if .Values.adminUser.email }}
  admin-email: {{ .Values.adminUser.email | b64enc }}
  admin-password: {{ required "adminUser.email gesetzt: bitte auch adminUser.password angeben" .Values.adminUser.password | b64enc }}
  {{- end }}
{{- end }}
