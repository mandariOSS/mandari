{{- /*
Medien und RIS-Dokumente überleben Neuinstallationen bewusst (resource-policy: keep).
Bewusst löschen: kubectl delete pvc <name>
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mandari.fullname" . }}-media
  labels:
    {{- include "mandari.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.media.className }}
  storageClassName: {{ .Values.persistence.media.className | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.media.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mandari.fullname" . }}-files
  labels:
    {{- include "mandari.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.files.className }}
  storageClassName: {{ .Values.persistence.files.className | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.files.size }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mandari.serviceAccountName" . }}
  labels:
    {{- include "mandari.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
