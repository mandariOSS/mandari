{{- /*
Migrationen in zwei Schritten wie update.sh (Phase 2 safemigrate, Phase 4 migrate):

  Installation  Job <name>-migrate (gewöhnliche Ressource, kein Hook): migrate, Rollen, Suchindex,
                Admin-Konto, Website-Migrationen. Kein post-install-Hook: Mit "helm install --wait"
                liefe der erst, wenn alle Pods bereit sind – die warten aber auf das Schema.
  Upgrade       pre-upgrade-Hook <name>-migrate-pre: safemigrate (nur Migrationen, die vor dem
                Ausrollen laufen dürfen) und Website-Migrationen; Secret und Datenbank gibt es dann schon.
                post-upgrade-Hook <name>-migrate-post: migrate (auch Safe.after_deploy), Rollen,
                Suchindex, Admin-Konto – nach dem Ausrollen.

Anwendung, Worker und Ingestor warten per initContainer (mandari.waitForSchema), bis alle
Migrationen eingespielt sind, die vor dem Ausrollen laufen dürfen.

Parameter von "mandari.migrateJob": root, suffix (Namensteil), hook (leer = kein Hook),
schritt ("vorher" = safemigrate, "voll" = migrate und Einrichtung), website (bool).
*/ -}}
{{- define "mandari.migrateJob" -}}
{{- $root := .root -}}
{{- $v := $root.Values -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mandari.fullname" $root }}-{{ .suffix }}
  labels:
    {{- include "mandari.labels" $root | nindent 4 }}
    app.kubernetes.io/component: migrate
  {{- if .hook }}
  annotations:
    helm.sh/hook: {{ .hook }}
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: {{ $v.migrationJob.backoffLimit }}
  {{- if not .hook }}
  ttlSecondsAfterFinished: {{ $v.migrationJob.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "mandari.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "mandari.serviceAccountName" $root }}
      {{- with $v.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-database
          image: {{ $v.postgres.image | quote }}
          securityContext:
            {{- toYaml $v.securityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              echo "Warte auf die Datenbank..."
              for i in $(seq 1 100); do
                if pg_isready -d "$DATABASE_URL" >/dev/null 2>&1; then
                  echo "Datenbank erreichbar."
                  exit 0
                fi
                sleep 3
              done
              echo "Datenbank nach 300 Sekunden nicht erreichbar." >&2
              exit 1
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mandari.secretName" $root }}
                  key: database-url
      containers:
        - name: migrate
          image: {{ include "mandari.appImage" $root | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          securityContext:
            {{- toYaml $v.securityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -e
              {{- if eq .schritt "vorher" }}
              echo "== Migrationen vor dem Ausrollen (safemigrate)"
              python manage.py safemigrate --noinput
              {{- else }}
              echo "== Datenbank-Migrationen"
              python manage.py migrate --noinput
              echo "== Rollen und Berechtigungen"
              python manage.py setup_roles
              python manage.py fix_permissions || true
              {{- if $v.elasticsearch.enabled }}
              echo "== Suchindex"
              python manage.py setup_elasticsearch || echo "Suchindex übersprungen (Elasticsearch noch nicht bereit)"
              {{- end }}
              {{- if $v.adminUser.email }}
              echo "== Admin-Konto"
              python manage.py shell -c "
              import os
              from django.contrib.auth import get_user_model
              User = get_user_model()
              email = os.environ['ADMIN_EMAIL']
              if not User.objects.filter(email=email).exists():
                  User.objects.create_superuser(email=email, password=os.environ['ADMIN_PASSWORD'])
                  print('Admin-Konto angelegt:', email)
              else:
                  print('Admin-Konto existiert bereits:', email)
              "
              {{- end }}
              {{- end }}
              echo "== Fertig"
          env:
            {{- include "mandari.appEnv" $root | nindent 12 }}
            {{- if and (ne .schritt "vorher") $v.adminUser.email }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mandari.secretName" $root }}
                  key: admin-email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mandari.secretName" $root }}
                  key: admin-password
            {{- end }}
          {{- if $v.app.extraEnvFromSecret }}
          envFrom:
            - secretRef:
                name: {{ $v.app.extraEnvFromSecret }}
          {{- end }}
          resources:
            {{- toYaml $v.migrationJob.resources | nindent 12 }}
        {{- if .website }}
        # Website (Wagtail): eigene Datenbank, eigenes Image. Ihr Startskript migriert ebenfalls,
        # die Pods warten aber auf diesen Schritt, damit mehrere Repliken nicht gleichzeitig migrieren.
        - name: website-migrate
          image: {{ include "mandari.websiteImage" $root | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          securityContext:
            {{- toYaml $v.securityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "== Website-Migrationen"
              python manage.py migrate --noinput
              python manage.py createcachetable
              echo "== Fertig"
          env:
            {{- include "mandari.websiteEnv" $root | nindent 12 }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        {{- end }}
{{- end -}}

{{- if .Values.migrationJob.enabled }}
{{- if .Release.IsInstall }}
{{ include "mandari.migrateJob" (dict "root" . "suffix" "migrate" "hook" "" "schritt" "voll" "website" .Values.website.enabled) }}
{{- else }}
{{ include "mandari.migrateJob" (dict "root" . "suffix" "migrate-pre" "hook" "pre-upgrade" "schritt" "vorher" "website" .Values.website.enabled) }}
---
{{ include "mandari.migrateJob" (dict "root" . "suffix" "migrate-post" "hook" "post-upgrade" "schritt" "voll" "website" false) }}
{{- end }}
{{- end }}
