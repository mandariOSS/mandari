{{- /*
Worker für Ereignisse, Aufträge und Zeitpläne (manage.py events_worker, Issue #509):
gleiches Image und dieselbe Umgebung wie die Anwendung. Mehrere Repliken teilen sich die
Arbeit (Leader-Leases in events_lease, Aufträge per SKIP LOCKED). Der Migrations-Job läuft
vor jedem Upgrade (pre-upgrade); Worker und Anwendung rollen danach gemeinsam aus.

Bis zu drei Deployments wie in docker-compose.yml: <name>-worker (alle Rollen; ohne die
Warteschlangen der beiden anderen), <name>-worker-heavy (nur Aufträge aus ocr und ai) und
<name>-worker-live (nur Aufträge aus live). Jeder Neustart eines Runners wartet auf seinen
längsten laufenden Auftrag (ocr bis 30 min); getrennt warten Mails, Suche und Live-Lesungen
nicht auf die Texterkennung. Alle warten per initContainer auf das Datenbankschema.

Parameter von "mandari.workerDeployment": root (Kontext des Charts), name (Namensteil und
Komponente), replicas, maxMemoryMb, resources, args (zusätzliche Argumente).
*/ -}}
{{- define "mandari.workerDeployment" -}}
{{- $root := .root -}}
{{- $w := $root.Values.worker -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mandari.fullname" $root }}-{{ .name }}
  labels:
    {{- include "mandari.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      {{- include "mandari.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      labels:
        {{- include "mandari.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ .name }}
      annotations:
        checksum/secret: {{ include (print $root.Template.BasePath "/secret.yaml") $root | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $w.metricsPort | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "mandari.serviceAccountName" $root }}
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- with (include "mandari.waitForSchema" $root | trim) }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      # Laufende Aufträge dürfen beim Beenden 20 s zu Ende laufen (--shutdown-timeout), dann SIGKILL
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: {{ include "mandari.appImage" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command:
            - python
            - manage.py
            - events_worker
            - --heartbeat-file
            - /tmp/mandari-worker.heartbeat
            - --metrics-port
            - {{ $w.metricsPort | quote }}
            {{- range .args }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            {{- toYaml $root.Values.securityContext | nindent 12 }}
          env:
            {{- include "mandari.appEnv" $root | nindent 12 }}
            {{- if $root.Values.tracing.otlpEndpoint }}
            - name: OTEL_SERVICE_NAME
              value: mandari-{{ .name }}
            {{- end }}
            # Der Runner startet oberhalb dieser Grenze neu, bevor das Speicherlimit greift
            - name: TASKS_MAX_MEMORY_MB
              value: {{ .maxMemoryMb | quote }}
            # Zeitplan check_service_levels läuft im Worker: Metriken der Anwendung über ihren Service
            # (überschreibbar mit app.extraEnv bzw. worker.extraEnv)
            - name: METRICS_URL
              value: {{ printf "http://%s:%v/metrics/" (include "mandari.fullname" $root) $root.Values.service.port | quote }}
            {{- range $key, $value := $w.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if $root.Values.app.extraEnvFromSecret }}
          envFrom:
            - secretRef:
                name: {{ $root.Values.app.extraEnvFromSecret }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ $w.metricsPort }}
              protocol: TCP
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: files
              mountPath: /app/files
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 5
            failureThreshold: 60
          # /health antwortet 503, sobald eine Rolle länger als --stale-after (300 s) hängt
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .resources | nindent 12 }}
      # Die Volumes media und files teilt der Worker mit Anwendung und Ingestor. Mit
      # persistence.accessMode ReadWriteOnce müssen alle diese Pods auf demselben Knoten laufen
      # (worker.affinity, z. B. podAffinity zur Anwendung); mehrere Knoten oder Repliken auf
      # verschiedenen Knoten brauchen ReadWriteMany.
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "mandari.fullname" $root }}-media
        - name: files
          persistentVolumeClaim:
            claimName: {{ include "mandari.fullname" $root }}-files
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}

{{- if .Values.worker.enabled }}
{{- $heavy := .Values.worker.heavy }}
{{- $live := .Values.worker.live }}
{{- /* Hauptworker: ohne eigene Worker für ocr/ai und live bedient er alle Warteschlangen */ -}}
{{- $args := list }}
{{- if and (or $heavy.enabled $live.enabled) .Values.worker.queues }}
{{- $queues := list .Values.worker.queues }}
{{- if not $heavy.enabled }}{{- $queues = append $queues $heavy.queues }}{{- end }}
{{- if not $live.enabled }}{{- $queues = append $queues "live" }}{{- end }}
{{- $args = list "--queues" (join "," $queues) }}
{{- end }}
{{- $args = concat $args .Values.worker.extraArgs }}
{{ include "mandari.workerDeployment" (dict "root" . "name" "worker" "replicas" .Values.worker.replicas "maxMemoryMb" .Values.worker.maxMemoryMb "resources" .Values.worker.resources "args" $args) }}
{{- if $heavy.enabled }}
---
{{ include "mandari.workerDeployment" (dict "root" . "name" "worker-heavy" "replicas" $heavy.replicas "maxMemoryMb" $heavy.maxMemoryMb "resources" $heavy.resources "args" (concat (list "--roles" "tasks" "--queues" $heavy.queues) $heavy.extraArgs)) }}
{{- end }}
{{- if $live.enabled }}
---
{{ include "mandari.workerDeployment" (dict "root" . "name" "worker-live" "replicas" $live.replicas "maxMemoryMb" $live.maxMemoryMb "resources" $live.resources "args" (concat (list "--roles" "tasks" "--queues" "live" "--concurrency" $live.concurrency) $live.extraArgs)) }}
{{- end }}
{{- end }}
