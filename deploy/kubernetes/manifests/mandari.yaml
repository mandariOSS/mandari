apiVersion: apps/v1
kind: Deployment
metadata:
  name: mandari
  labels:
    helm.sh/chart: mandari-1.1.0
    app.kubernetes.io/name: mandari
    app.kubernetes.io/instance: mandari
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mandari
      app.kubernetes.io/instance: mandari
      app.kubernetes.io/component: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mandari
        app.kubernetes.io/instance: mandari
        app.kubernetes.io/component: app
      annotations:
        # Neustart, wenn sich Zugangsdaten ändern
        checksum/secret: 95dd273c675d0ea8295013ede845a481a6ea3e7a104261d4525174853183a211
    spec:
      serviceAccountName: mandari
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: wait-for-schema
          image: "ghcr.io/mandarioss/mandari:latest"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          command: ["python", "manage.py", "shell", "-c"]
          args:
            - |
              import sys, time
              from django.db import connections
              from django.db.migrations.executor import MigrationExecutor
              from django_safemigrate.management.commands.safemigrate import Command
        
              frist = 1800
              beginn = time.monotonic()
              letzte_meldung = None
              while True:
                  try:
                      executor = MigrationExecutor(connections["default"])
                      plan = executor.migration_plan(executor.loader.graph.leaf_nodes())
                      pruefer = Command()
                      erklaert = {migration: pruefer.safe(migration) for migration, _ in plan}
                      bereit, verschoben, blockiert = pruefer.categorize(
                          pruefer.resolve(erklaert, pruefer.detected(erklaert))
                      )
                      if not bereit and not blockiert:
                          hinweis = f" ({len(verschoben)} Migrationen folgen nach dem Ausrollen)" if verschoben else ""
                          print("Datenbankschema bereit" + hinweis + ".", flush=True)
                          sys.exit(0)
                      meldung = f"{len(bereit) + len(blockiert)} Migrationen stehen noch aus"
                  except Exception as fehler:  # Datenbank noch nicht erreichbar, Tabellen fehlen
                      meldung = f"Datenbank noch nicht bereit ({type(fehler).__name__})"
                  connections.close_all()
                  if meldung != letzte_meldung:
                      print(f"Warte auf den Migrations-Job: {meldung}", flush=True)
                      letzte_meldung = meldung
                  if time.monotonic() - beginn > frist:
                      print(f"Schema nach {frist} s nicht bereit. Migrations-Job prüfen: kubectl logs job/<release>-migrate", flush=True)
                      sys.exit(1)
                  time.sleep(5)
          env:
            - name: DEBUG
              value: "false"
            - name: ALLOWED_HOSTS
              value: "mandari.example.com,localhost,127.0.0.1"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://mandari.example.com"
            - name: SITE_URL
              value: "https://mandari.example.com"
            - name: TZ
              value: "Europe/Berlin"
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "INFO"
            # Schalter der Ereignistechnik je Erzeuger (Ingestor, Anwendung, Worker lesen denselben Wert)
            - name: INGESTOR_EVENTS_ENABLED
              value: "false"
            - name: OPARL_CHANGES_ENABLED
              value: "false"
            # Aufbewahrung des Journals (manage.py events_purge, Zeitplan im Worker nur wenn eingeschaltet)
            - name: EVENTS_JOURNAL_PURGE_ENABLED
              value: "false"
            - name: EVENTS_JOURNAL_RETENTION_DAYS
              value: "90"
            # DSGVO: nach einem redact personenbezogene Nutzlasten im Journal leeren (Auftrag im Worker)
            - name: EVENTS_REDACT_NEUTRALIZE
              value: "false"
            # Mailversand: Absender und Domain für Message-ID und EHLO (leer = Domain des Absenders, sonst die von domain)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mandari-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mandari-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mandari-secrets
                  key: secret-key
            - name: ENCRYPTION_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: mandari-secrets
                  key: encryption-key
            # Nur während eines Schlüsselwechsels gesetzt (docs/KRYPTOKONZEPT.md)
            - name: ENCRYPTION_MASTER_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: mandari-secrets
                  key: encryption-key-previous
                  optional: true
            - name: ELASTICSEARCH_URL
              value: "http://mandari-elasticsearch:9200"
            - name: ELASTICSEARCH_AUTO_INDEX
              value: "True"
            - name: OPARL_FILES_ROOT
              value: /app/files
            # Dokumentablage und Texterkennung (docs/FILE_CACHE.md), für Anwendung, Worker und Ingestor gleich
            - name: FILE_STORE_LAYOUT
              value: "sha256"
            - name: INGESTOR_STORES_FILES
              value: "true"
            - name: FILE_CACHE_MIN_FREE_GB
              value: "15"
            - name: TEXT_EXTRACTION_RUNNER
              value: "ingestor"
            # Live-Übertragungen (docs/LIVE_UEBERTRAGUNG.md); aus = keine Anfragen an Streaming-Anbieter
            - name: LIVE_UEBERTRAGUNG_AKTIV
              value: "false"
            # Adressraum je Tesseract-Unterprozess (Import, Aufträge in ocr)
            - name: OCR_MEMORY_LIMIT_MB
              value: "512"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      containers:
        - name: mandari
          image: "ghcr.io/mandarioss/mandari:latest"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          env:
            - name: DEBUG
              value: "false"
            - name: ALLOWED_HOSTS
              value: "mandari.example.com,localhost,127.0.0.1"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://mandari.example.com"
            - name: SITE_URL
              value: "https://mandari.example.com"
            - name: TZ
              value: "Europe/Berlin"
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "INFO"
            # Schalter der Ereignistechnik je Erzeuger (Ingestor, Anwendung, Worker lesen denselben Wert)
            - name: INGESTOR_EVENTS_ENABLED
              value: "false"
            - name: OPARL_CHANGES_ENABLED
              value: "false"
            # Aufbewahrung des Journals (manage.py events_purge, Zeitplan im Worker nur wenn eingeschaltet)
            - name: EVENTS_JOURNAL_PURGE_ENABLED
              value: "false"
            - name: EVENTS_JOURNAL_RETENTION_DAYS
              value: "90"
            # DSGVO: nach einem redact personenbezogene Nutzlasten im Journal leeren (Auftrag im Worker)
            - name: EVENTS_REDACT_NEUTRALIZE
              value: "false"
            # Mailversand: Absender und Domain für Message-ID und EHLO (leer = Domain des Absenders, sonst die von domain)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mandari-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mandari-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mandari-secrets
                  key: secret-key
            - name: ENCRYPTION_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: mandari-secrets
                  key: encryption-key
            # Nur während eines Schlüsselwechsels gesetzt (docs/KRYPTOKONZEPT.md)
            - name: ENCRYPTION_MASTER_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: mandari-secrets
                  key: encryption-key-previous
                  optional: true
            - name: ELASTICSEARCH_URL
              value: "http://mandari-elasticsearch:9200"
            - name: ELASTICSEARCH_AUTO_INDEX
              value: "True"
            - name: OPARL_FILES_ROOT
              value: /app/files
            # Dokumentablage und Texterkennung (docs/FILE_CACHE.md), für Anwendung, Worker und Ingestor gleich
            - name: FILE_STORE_LAYOUT
              value: "sha256"
            - name: INGESTOR_STORES_FILES
              value: "true"
            - name: FILE_CACHE_MIN_FREE_GB
              value: "15"
            - name: TEXT_EXTRACTION_RUNNER
              value: "ingestor"
            # Live-Übertragungen (docs/LIVE_UEBERTRAGUNG.md); aus = keine Anfragen an Streaming-Anbieter
            - name: LIVE_UEBERTRAGUNG_AKTIV
              value: "false"
            # Adressraum je Tesseract-Unterprozess (Import, Aufträge in ocr)
            - name: OCR_MEMORY_LIMIT_MB
              value: "512"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: files
              mountPath: /app/files
          startupProbe:
            # Erster Start kann dauern (Datenbankverbindung, Caches)
            httpGet:
              path: /health/live/
              port: http
              # Der Kubelet fragt sonst mit der Pod-IP als Host an, die nicht in ALLOWED_HOSTS steht
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 60
          # Readiness prüft Datenbank, Redis, Elasticsearch und Speicher (Issue #231);
          # ein Ausfall nimmt den Pod aus dem Service, startet ihn aber nicht neu.
          readinessProbe:
            httpGet:
              path: /health/ready/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live/
              port: http
              # Der Kubelet fragt sonst mit der Pod-IP als Host an, die nicht in ALLOWED_HOSTS steht
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: mandari-media
        - name: files
          persistentVolumeClaim:
            claimName: mandari-files
