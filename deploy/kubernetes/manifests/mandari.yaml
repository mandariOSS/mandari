apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mandari-elasticsearch
  labels:
    helm.sh/chart: mandari-1.1.0
    app.kubernetes.io/name: mandari
    app.kubernetes.io/instance: mandari
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: elasticsearch
spec:
  serviceName: mandari-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mandari
      app.kubernetes.io/instance: mandari
      app.kubernetes.io/component: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mandari
        app.kubernetes.io/instance: mandari
        app.kubernetes.io/component: elasticsearch
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: "docker.elastic.co/elasticsearch/elasticsearch:8.17.0"
          imagePullPolicy: IfNotPresent
          env:
            # Ein-Knoten-Betrieb ohne Authentifizierung; nur clusterintern erreichbar.
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx1g"
            - name: bootstrap.memory_lock
              value: "false"
          ports:
            - name: http
              containerPort: 9200
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 1536Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
