# Beispiel: Prometheus-Alarmregeln für die Ereignistechnik (Issue #510, docs/MONITORING.md)
#
# Einbinden in prometheus.yml:
#   rule_files:
#     - /etc/prometheus/mandari-alerts.yml
# Empfänger und Wiederholung regelt der Alertmanager. Die Werte der Ereignistechnik misst jeder
# Webprozess beim Abruf aus der Datenbank; bei mehreren Instanzen deshalb max statt sum.

groups:
  - name: mandari-ereignistechnik
    rules:
      - alert: MandariAbonnementImRueckstand
        expr: |
          max by (subscription) (mandari_events_lag_seconds) > 300
            unless on (subscription) max by (subscription) (mandari_events_subscription_paused) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Abonnement {{ $labels.subscription }} liegt mehr als 5 Minuten zurück"
          description: >-
            Die Zustellung läuft nicht oder kommt nicht nach. Admin-Seite „Ereignistechnik → Abonnements“
            und das Protokoll von events_dispatch prüfen.

      - alert: MandariToteEreignisse
        expr: max by (subscription) (mandari_events_parked{state="tot"}) > 0
        labels:
          severity: critical
        annotations:
          summary: "Tote Ereignisse im Abonnement {{ $labels.subscription }}"
          description: >-
            Ein Ereignis wurde nach allen Versuchen aufgegeben; Folgeereignisse desselben Objekts warten.
            Admin-Seite „Ereignistechnik → Geparkte Ereignisse“: Ursache beheben, dann erneut versuchen
            oder verwerfen.

      - alert: MandariVieleBlockierteEreignisse
        expr: max by (subscription) (mandari_events_parked{state="blockiert"}) > 1000
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Viele blockierte Ereignisse im Abonnement {{ $labels.subscription }}"
          description: >-
            Hinter einem geparkten Ereignis stauen sich Folgeereignisse desselben Objekts. Das erste
            Ereignis der Kette erneut versuchen oder verwerfen.

      - alert: MandariSequenziererAufgehalten
        expr: max(mandari_events_sequencer_blocked_seconds) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Eine offene Transaktion hält den Sequenzierer seit mehr als 5 Minuten auf"
          description: >-
            Die älteste offene Transaktion im Datenbank-Cluster (pg_stat_activity, auch andere Datenbanken)
            beenden oder abwarten; bis dahin bekommt kein neues Ereignis eine Folgenummer.

      - alert: MandariSequenziererImRueckstand
        expr: max(mandari_events_sequencer_lag_seconds) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ereignisse warten seit mehr als 5 Minuten auf eine Folgenummer"
          description: Kein Sequenzierer läuft oder er hängt; ohne Folgenummer stellt niemand zu.

      - alert: MandariToteAuftraege
        expr: max by (queue) (mandari_tasks_dead) > 0
        labels:
          severity: warning
        annotations:
          summary: "Endgültig gescheiterte Aufträge in der Warteschlange {{ $labels.queue }}"
          description: Ursache im Protokoll des Runners (events_tasks); der Wert erlischt nach 24 Stunden.

      - alert: MandariAuftragsrueckstand
        # ocr gesondert (MandariTexterkennungSteht): Parallelität 1, dort wartet jeder Auftrag hinter den vorigen
        expr: max by (queue) (mandari_tasks_oldest_queued_seconds{queue!="ocr"}) > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Aufträge in {{ $labels.queue }} warten seit mehr als 15 Minuten"
          description: Kein Runner bedient die Warteschlange oder sie kommt nicht nach.

      - alert: MandariWeckrufGestoert
        expr: max(mandari_events_listener_up) == 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Weckruf per LISTEN kommt nicht an"
          description: >-
            Nur Hinweis: Die Abfrage trägt weiter, die Zustellung ist langsamer. Hinter PgBouncer
            EVENTS_DB_DIRECT_URL prüfen.

  # Dokumentkette: Abruf, Ablage und Texterkennung der RIS-Dateien (Issue #919, docs/MONITORING.md,
  # „Dokumentkette“). Die Zustandszahlen misst jeder Prozess aus der Datenbank (max), die Fehler zählt
  # der Prozess, der abruft (sum).
  - name: mandari-dokumentkette
    rules:
      - alert: MandariAbrufFehlerJeQuelle
        # Vergleich mit derselben Zeit am Vortag; fehlt dort die Quelle, gilt 0
        expr: |
          sum by (source) (increase(mandari_files_fetch_errors_total[6h])) > 20
            and
          sum by (source) (increase(mandari_files_fetch_errors_total[6h]))
            > 3 * (
              sum by (source) (increase(mandari_files_fetch_errors_total[6h] offset 1d))
                or
              sum by (source) (increase(mandari_files_fetch_errors_total[6h])) * 0
            )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Abrufe der Quelle {{ $labels.source }} scheitern deutlich häufiger als am Vortag"
          description: >-
            Die Quelle ist gestört oder bremst uns (429, Sperre). Fehlercodes in
            mandari_files_fetch_errors_total ansehen, Betriebsmonitor (Gesundheit, Schonung) prüfen. Beim
            Umschalten der Dokumentkette ist das ein Abbruchkriterium (DEPLOYMENT.md).

      - alert: MandariTexterkennungSteht
        # Aufträge file.extract_text warten, aber keiner läuft (fehlt die Reihe ocr, gilt 0)
        expr: |
          max(mandari_tasks_oldest_queued_seconds{queue="ocr"}) > 900
            and on()
          (max(mandari_tasks_running{queue="ocr"}) or vector(0)) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Die Texterkennung steht: Aufträge in ocr warten, keiner läuft"
          description: >-
            worker-heavy prüfen (healthy, bedient er ocr, Speicherabbrüche). Lange Wartezeiten bei laufender
            Erkennung sind bei vielen Scans normal (Parallelität 1, TEXT_EXTRACTION_QUEUE_DEPTH).

      - alert: MandariTexterkennungRueckstauWaechst
        expr: |
          max(mandari_files_stored_without_text) > 100
            and
          max(mandari_files_stored_without_text) > max(mandari_files_stored_without_text offset 6h)
        for: 3h
        labels:
          severity: warning
        annotations:
          summary: "Abgelegte Dokumente warten zunehmend auf ihren Text"
          description: >-
            Nach dokumentkette nacharbeiten oder einer neuen Erkennungsversion erwartet. Sonst worker-heavy
            (healthy, Speicher), mandari_tasks_running{queue="ocr"} und die Prüfungen texterkennung und
            dokumenttext ansehen.

      - alert: MandariAbrufWiederholungenStauen
        expr: |
          max(mandari_files_fetch_retry_due) > 50
            and
          max(mandari_files_fetch_retry_due) > max(mandari_files_fetch_retry_due offset 6h)
        for: 3h
        labels:
          severity: warning
        annotations:
          summary: "Fällige Wiederholungen des Abrufs stauen sich"
          description: >-
            Abrufe werden nicht abgearbeitet: Worker, Drossel je Host (request_interval) oder Quellen-Schonung
            prüfen.
