# journald-Einstellungen für mandari-Hosts (Issue #263, BSI OPS.1.1.5.A6/A8).
# Ziel: /etc/systemd/journald.conf.d/mandari.conf, danach: systemctl restart systemd-journald
#
# Aufbewahrung ist zeitbasiert (90 Tage); SystemMaxUse ist nur die Obergrenze,
# damit ein Fehlerfall mit Log-Flut die Platte nicht füllt. Wird sie erreicht,
# kürzt journald die ältesten Einträge – deploy/logging/journal-alert.sh meldet das.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=8G
SystemKeepFree=5G
MaxRetentionSec=90day
MaxFileSec=1week
