# =============================================================================
# Mandari - Community Edition (Single Server)
# =============================================================================
# Documentation: https://github.com/mandariOSS/mandari
#
# Quick Start (choose one):
#
#   Option 1 - Full Clone:
#     git clone https://github.com/mandariOSS/mandari.git && cd mandari
#     ./install.sh
#
#   Option 2 - Download Only:
#     mkdir mandari && cd mandari
#     curl -LO https://raw.githubusercontent.com/mandariOSS/mandari/main/docker-compose.yml
#     curl -LO https://raw.githubusercontent.com/mandariOSS/mandari/main/Caddyfile
#     curl -Lo .env https://raw.githubusercontent.com/mandariOSS/mandari/main/.env.example
#     # Edit .env with your settings, then:
#     docker compose up -d
#
# Docker Images: ghcr.io/mandarioss/mandari (GitHub Container Registry)
# =============================================================================

# Projektname bestimmt Container- und Volume-Namen. Für eine zweite Installation auf
# demselben Host: COMPOSE_PROJECT_NAME=mandari-zweit docker compose up -d
name: ${COMPOSE_PROJECT_NAME:-mandari}

# =============================================================================
# Logging defaults (all services)
# =============================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

# =============================================================================
# Umgebung der Anwendung: für die Anwendung (mandari) und den Worker gleich, damit
# Aufträge im Worker dieselbe Konfiguration sehen wie die Webprozesse
# =============================================================================
x-app-environment: &app-environment
  # Database
  DATABASE_URL: postgresql://${POSTGRES_USER:-mandari}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mandari}
  # Cache (password-protected)
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  # Search
  ELASTICSEARCH_URL: http://elasticsearch:9200
  # Security
  SECRET_KEY: ${SECRET_KEY:?Django secret key required}
  ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Encryption key required}
  # Nur während eines Schlüsselwechsels (docs/KRYPTOKONZEPT.md)
  ENCRYPTION_MASTER_KEY_PREVIOUS: ${ENCRYPTION_MASTER_KEY_PREVIOUS:-}
  # Application
  DEBUG: "false"
  ALLOWED_HOSTS: ${DOMAIN:-localhost}
  CSRF_TRUSTED_ORIGINS: https://${DOMAIN:-localhost}
  SITE_URL: https://${DOMAIN:-localhost}
  # Dokument-Cache (siehe docs/FILE_CACHE.md)
  OPARL_FILES_ROOT: /app/files
  # Lokale Kopien liefert Caddy aus (Range, ETag); Caddy liest dafür das Volume mandari_files
  # (siehe Dienst caddy und docs/FILE_CACHE.md, „Auslieferung über den Webserver“). Standard aus.
  FILE_ACCEL_REDIRECT: ${FILE_ACCEL_REDIRECT:-false}
  # Ablage nach SHA-256 mit Referenzzählung (docs/FILE_CACHE.md, „Ablage nach SHA-256“); der Ingestor legt
  # Dateien, die er für den Text lädt, selbst ab (Volume mandari_files im Dienst ingestor)
  FILE_STORE_LAYOUT: ${FILE_STORE_LAYOUT:-sha256}
  INGESTOR_STORES_FILES: ${INGESTOR_STORES_FILES:-true}
  # S3-kompatibler Objektspeicher (docs/FILE_CACHE.md, „Objektspeicher“), Standard aus. Zugangsdaten nie im Repo:
  # aus der .env oder einer eigenen Umgebungsdatei, die Compose zusätzlich liest (--env-file, siehe FILE_CACHE.md)
  OBJ_ENABLED: ${OBJ_ENABLED:-false}
  OBJ_ENDPOINT: ${OBJ_ENDPOINT:-}
  OBJ_BUCKET: ${OBJ_BUCKET:-}
  OBJ_KEY: ${OBJ_KEY:-}
  OBJ_SECRET: ${OBJ_SECRET:-}
  OBJ_REGION: ${OBJ_REGION:-}
  OBJ_CACHE_MAX_GB: ${OBJ_CACHE_MAX_GB:-60}
  OBJ_CHECKSUMS: ${OBJ_CHECKSUMS:-when_required}
  # Nur mit Ratsinformationssystem im internen Netz (siehe .env.example)
  INSIGHT_FETCH_ALLOW_PRIVATE_NETWORKS: ${INSIGHT_FETCH_ALLOW_PRIVATE_NETWORKS:-false}
  # Abos zu Themen und Orten im Bürgerportal (siehe .env.example), Standard aus
  INSIGHT_SUBSCRIPTIONS_ENABLED: ${INSIGHT_SUBSCRIPTIONS_ENABLED:-false}
  # Ratsfragen im Bürgerportal (siehe .env.example), Standard aus (pausiert)
  INSIGHT_QUESTIONS_ENABLED: ${INSIGHT_QUESTIONS_ENABLED:-false}
  # Aufträge, Ereignisse und Worker (siehe .env.example und DEPLOYMENT.md, „Worker“)
  TASKS_BACKEND: ${TASKS_BACKEND:-immediate}
  TASKS_MAX_TASKS_PER_PROCESS: ${TASKS_MAX_TASKS_PER_PROCESS:-1000}
  TASKS_MAX_MEMORY_MB: ${TASKS_MAX_MEMORY_MB:-400}
  EVENTS_DB_DIRECT_URL: ${EVENTS_DB_DIRECT_URL:-}
  EVENTS_WORKER_REQUIRED: ${EVENTS_WORKER_REQUIRED:-}
  INGESTOR_EVENTS_ENABLED: ${INGESTOR_EVENTS_ENABLED:-false}
  # Zeitpläne im Worker statt Host-Cron (DEPLOYMENT.md, „Geplante Aufgaben“): einzelne abschalten
  EVENTS_SCHEDULES_DISABLED: ${EVENTS_SCHEDULES_DISABLED:-}
  # Mailarten, die als Auftrag (Warteschlange mail) statt in der Anfrage rausgehen, siehe .env.example
  MAIL_QUEUE: ${MAIL_QUEUE:-}
  MAIL_QUEUE_MAX_BYTES: ${MAIL_QUEUE_MAX_BYTES:-20971520}
  # Wer den Text der RIS-Dateien erkennt: ingestor (Standard) oder worker (Aufträge in ocr), siehe .env.example
  TEXT_EXTRACTION_RUNNER: ${TEXT_EXTRACTION_RUNNER:-ingestor}
  # Adressraum je Tesseract-Unterprozess der Anwendung (Import, Aufträge in ocr): im worker-heavy belegt der
  # Runner selbst bis 800 MB, der Container hat 1 GB
  OCR_MEMORY_LIMIT_MB: ${OCR_MEMORY_LIMIT_MB:-512}
  # Für die Zeitpläne der Betriebsprüfungen, die jetzt im Worker laufen: Empfänger der Alarme,
  # Statusseite für den Verfügbarkeitsbericht, Metriken der Anwendung über ihren Dienstnamen
  INSIGHT_ALERT_EMAILS: ${INSIGHT_ALERT_EMAILS:-}
  GATUS_URL: ${GATUS_URL:-}
  METRICS_URL: ${METRICS_URL:-http://mandari:8000/metrics/}
  # Ereignisse aus mandari Session an die Datendrehscheibe (aus, schatten, aktiv; siehe .env.example), Standard aus
  SESSION_EVENTS: ${SESSION_EVENTS:-aus}
  # Suchindex als Abonnement (aus, schatten, aktiv; siehe .env.example), Standard aus
  SEARCH_INDEX_SUBSCRIPTION: ${SEARCH_INDEX_SUBSCRIPTION:-aus}
  SEARCH_INDEX_SHADOW_BODIES: ${SEARCH_INDEX_SHADOW_BODIES:-}
  SEARCH_INDEX_SHADOW_MAX_DOCS: ${SEARCH_INDEX_SHADOW_MAX_DOCS:-100000}
  # Abfrage der Volltextsuche (v2 Standard, v1 = bisherige Abfrage als Rückfall; siehe .env.example)
  SEARCH_RANKING: ${SEARCH_RANKING:-v2}
  SEARCH_RECENCY_WEIGHT: ${SEARCH_RECENCY_WEIGHT:-1.0}
  SEARCH_MIN_RELEVANCE: ${SEARCH_MIN_RELEVANCE:-0.05}
  # Ortsband der Insight-Suche (an/aus, Mindestanteil verorteter Vorgänge, Umkreis in Metern)
  INSIGHT_SEARCH_PLACES: ${INSIGHT_SEARCH_PLACES:-true}
  INSIGHT_SEARCH_PLACES_MIN_SHARE: ${INSIGHT_SEARCH_PLACES_MIN_SHARE:-0.5}
  INSIGHT_SEARCH_PLACES_RADIUS: ${INSIGHT_SEARCH_PLACES_RADIUS:-500}
  # Änderungsfeed und Snapshot je Kommune (siehe .env.example und docs/OPARL_API.md, „Betrieb“), Standard aus
  OPARL_CHANGES_ENABLED: ${OPARL_CHANGES_ENABLED:-false}
  OPARL_CHANGES_RETENTION_DAYS: ${OPARL_CHANGES_RETENTION_DAYS:-90}
  OPARL_SNAPSHOT_PARALLEL: ${OPARL_SNAPSHOT_PARALLEL:-2}
  # AI (optional)
  NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
  # „Worker lebt“ an die Statusseite (docs/MONITORING.md, „Worker“); leer = keine Meldung
  WORKER_PUSH_URL: ${WORKER_PUSH_URL:-}
  WORKER_PUSH_TOKEN: ${WORKER_PUSH_TOKEN:-}
  # Timezone
  TZ: ${TZ:-Europe/Berlin}

services:
  # ===========================================================================
  # Reverse Proxy with automatic SSL (Let's Encrypt)
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mandari}-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      EMAIL: ${ACME_EMAIL:-admin@example.com}
      # Ablage der Dokumente, nur lesend (Auslieferung per X-Accel-Redirect, FILE_ACCEL_REDIRECT)
      OPARL_FILES_MOUNT: /srv/mandari-files
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - mandari_files:/srv/mandari-files:ro
    depends_on:
      - mandari
      - website
    networks:
      - mandari
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pidof caddy > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mandari}-postgres
    restart: unless-stopped
    # Grundeinstellungen statt Auslieferungswerte (Issue #258).
    # PostgreSQL liefert shared_buffers=128MB und random_page_cost=4 aus — das
    # beschreibt eine drehende Festplatte und einen kleinen Datenbestand. Beides
    # trifft hier nicht zu. Die Werte sind vom zugeteilten Arbeitsspeicher
    # abgeleitet (POSTGRES_MEM_LIMIT) und einzeln uebersteuerbar; Herleitung und
    # Anpassung stehen in DEPLOYMENT.md. Eine Aenderung wirkt erst nach einem
    # Neustart des Datenbankdienstes.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}
      # Obergrenze fuer temporaere Dateien je Sitzung: Eine entgleiste Abfrage bricht ab,
      # statt die Platte zu fuellen (Vorfall 24.09.2026, Issue #54).
      - -c
      - temp_file_limit=${POSTGRES_TEMP_FILE_LIMIT:-5GB}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mandari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-mandari}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-website-db.sh:/docker-entrypoint-initdb.d/init-website-db.sh:ro
    networks:
      - mandari
    # shared_buffers ist auf ein Viertel hiervon ausgelegt. Wer diesen Wert
    # aendert, zieht POSTGRES_SHARED_BUFFERS mit (siehe DEPLOYMENT.md).
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mandari} -d ${POSTGRES_DB:-mandari}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis Cache (password-protected)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mandari}-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Redis password required}
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - mandari
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Elasticsearch (Full-text search)
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: ${COMPOSE_PROJECT_NAME:-mandari}-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
      cluster.name: mandari
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - mandari
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Mandari (Django Backend)
  # ===========================================================================
  mandari:
    image: ghcr.io/mandarioss/mandari:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mandari}
    restart: unless-stopped
    labels:
      # deploy/scripts/restart-unhealthy.sh startet den Dienst neu, wenn die Liveness rot ist (#344)
      mandari.autoheal: "true"
    environment: *app-environment
    volumes:
      - mandari_media:/app/media
      - mandari_files:/app/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - mandari
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      # Liveness (Issue #344): wird bei festgefahrenem Datenbank-Pool rot. Compose startet
      # einen ungesunden Container nicht selbst neu – siehe DEPLOYMENT.md, „Automatischer Neustart“.
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/live/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # Worker: Ereignisse, Aufträge und Zeitpläne (manage.py events_worker)
  # Gleiches Image und dieselbe Umgebung wie die Anwendung. Starten nach den
  # Migrationen und vor der Anwendung (update.sh, deploy/scripts/deploy.sh).
  # /metrics und /health auf Port 9091 nur im internen Netz (nicht veröffentlicht).
  # Zwei Dienste: worker (alle Rollen, alle Warteschlangen außer ocr und ai) und
  # worker-heavy (nur Aufträge aus ocr und ai). Jeder Neustart eines Runners wartet
  # auf seinen längsten laufenden Auftrag (ocr bis 30 min); getrennt warten Mails
  # und Suche nicht auf die Texterkennung. Einzelheiten: DEPLOYMENT.md, „Worker“.
  # ===========================================================================
  worker: &worker-dienst
    image: ghcr.io/mandarioss/mandari:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mandari}-worker
    restart: unless-stopped
    command:
      - python
      - manage.py
      - events_worker
      - --queues
      - default,mail,index,adapter
      - --heartbeat-file
      - /tmp/mandari-worker.heartbeat
    labels:
      # deploy/scripts/restart-unhealthy.sh startet ihn neu, wenn eine Rolle hängt
      mandari.autoheal: "true"
    environment: *app-environment
    volumes:
      - mandari_media:/app/media
      - mandari_files:/app/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mandari
    # Der Runner startet oberhalb von TASKS_MAX_MEMORY_MB (Standard 400) neu, bevor das Limit greift.
    # Die Verwaltungsbefehle der Zeitpläne (früher Host-Cron im Anwendungscontainer, etwa die
    # Sitzungsmappen) laufen hier als eigene Prozesse und brauchen den Rest bis 1 GB.
    mem_limit: 1g
    # Laufende Aufträge dürfen beim Beenden 20 s zu Ende laufen (--shutdown-timeout), dann SIGKILL
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      # Die Heartbeat-Datei erneuert der Worker nur, solange jede Rolle arbeitet
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/mandari-worker.heartbeat') > 60)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Texterkennung und KI (Warteschlangen ocr, ai): eigener Runner mit mehr Speicher,
  # sonst wie worker (Umgebung, Volumes, Healthcheck über die Heartbeat-Datei)
  worker-heavy:
    <<: *worker-dienst
    container_name: ${COMPOSE_PROJECT_NAME:-mandari}-worker-heavy
    command:
      - python
      - manage.py
      - events_worker
      - --roles
      - tasks
      - --queues
      - ocr,ai
      - --max-memory-mb
      - "800"
      - --heartbeat-file
      - /tmp/mandari-worker.heartbeat
    # Der Runner startet oberhalb von 800 MB (--max-memory-mb) neu, bevor das Limit greift
    mem_limit: 1g

  # ===========================================================================
  # Protokollierung: Orchestrator der GPU-Rechenknoten (centron)
  # Erstellt und löscht GPU-vServer nach Bedarf. Tut nichts, solange im Admin
  # unter System → GPU-Rechenknoten „Rechenknoten aktiv" ausgeschaltet ist.
  # ===========================================================================
  minutes-orchestrator:
    image: ghcr.io/mandarioss/mandari:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mandari}-minutes-orchestrator
    restart: unless-stopped
    command: ["python", "manage.py", "minutes_orchestrator"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mandari}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mandari}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRET_KEY: ${SECRET_KEY:?Django secret key required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Encryption key required}
      ENCRYPTION_MASTER_KEY_PREVIOUS: ${ENCRYPTION_MASTER_KEY_PREVIOUS:-}
      DEBUG: "false"
      ALLOWED_HOSTS: ${DOMAIN:-localhost}
      SITE_URL: https://${DOMAIN:-localhost}
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mandari:
        condition: service_healthy
    networks:
      - mandari
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ===========================================================================
  # Marketing Website (Wagtail CMS)
  # ===========================================================================
  website:
    image: ghcr.io/mandarioss/website:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mandari}-website
    restart: unless-stopped
    environment:
      WEBSITE_DATABASE_URL: postgresql://${POSTGRES_USER:-mandari}:${POSTGRES_PASSWORD}@postgres:5432/${WEBSITE_DB:-mandari_website}
      WEBSITE_SECRET_KEY: ${WEBSITE_SECRET_KEY:-${SECRET_KEY}}
      MANDARI_API_URL: http://mandari:8000/api
      DEBUG: "false"
      ALLOWED_HOSTS: ${DOMAIN:-localhost}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN:-localhost}
      SITE_URL: https://${DOMAIN:-localhost}
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mandari
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s

  # ===========================================================================
  # OParl Ingestor (Data Synchronization)
  # ===========================================================================
  ingestor:
    image: ghcr.io/mandarioss/ingestor:${IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mandari}-ingestor
    restart: unless-stopped
    command: >
      python -m src.main daemon
      --interval ${INGESTOR_INTERVAL:-10}
      --full-sync-hour ${INGESTOR_FULL_SYNC_HOUR:-3}
      --concurrent ${INGESTOR_CONCURRENT:-10}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mandari}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mandari}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      TZ: ${TZ:-Europe/Berlin}
      # Änderungen am RIS-Bestand als Ereignisse ins Journal schreiben (Standard aus, siehe .env.example)
      INGESTOR_EVENTS_ENABLED: ${INGESTOR_EVENTS_ENABLED:-false}
      # Dateien für den Text gleich in der Ablage der Anwendung ablegen (ein Abruf je Datei, #788)
      OPARL_FILES_ROOT: /app/files
      FILE_STORE_LAYOUT: ${FILE_STORE_LAYOUT:-sha256}
      FILE_CACHE_MIN_FREE_GB: ${FILE_CACHE_MIN_FREE_GB:-15}
      # Der Sync erkennt den Text selbst (TEXT_EXTRACTION_ENABLED): Adressraum je Tesseract-Unterprozess
      # deutlich unter dem Speicherlimit des Containers (512 MB) halten (#817)
      OCR_MEMORY_LIMIT_MB: ${OCR_MEMORY_LIMIT_MB:-384}
      # worker: die Aufträge der Anwendung erkennen den Text, Sync und OCR-Worker ruhen (gleich wie dort)
      TEXT_EXTRACTION_RUNNER: ${TEXT_EXTRACTION_RUNNER:-ingestor}
    volumes:
      - ingestor_data:/app/data
      - mandari_files:/app/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mandari
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

# =============================================================================
# Volumes (Persistent Data)
# =============================================================================
volumes:
  postgres_data:
    name: mandari_postgres_data
  redis_data:
    name: mandari_redis_data
  elasticsearch_data:
    name: mandari_elasticsearch_data
  mandari_media:
    name: mandari_media_data
  # Lokaler Dokument-Cache (PDFs) — kann pro Kommune auf eine Storage Box zeigen
  mandari_files:
    name: mandari_files_data
  ingestor_data:
    name: mandari_ingestor_data
  caddy_data:
    name: mandari_caddy_data
  caddy_config:
    name: mandari_caddy_config

# =============================================================================
# Network
# =============================================================================
networks:
  mandari:
    driver: bridge
