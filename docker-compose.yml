# =============================================================================
# Mandari - Community Edition (Single Server)
# =============================================================================
# Documentation: https://github.com/mandariOSS/mandari
#
# Quick Start (choose one):
#
#   Option 1 - Full Clone:
#     git clone https://github.com/mandariOSS/mandari.git && cd mandari
#     ./install.sh
#
#   Option 2 - Download Only:
#     mkdir mandari && cd mandari
#     curl -LO https://raw.githubusercontent.com/mandariOSS/mandari/main/docker-compose.yml
#     curl -LO https://raw.githubusercontent.com/mandariOSS/mandari/main/Caddyfile
#     curl -Lo .env https://raw.githubusercontent.com/mandariOSS/mandari/main/.env.example
#     # Edit .env with your settings, then:
#     docker compose up -d
#
# Docker Images: ghcr.io/mandarioss/mandari (GitHub Container Registry)
# =============================================================================

name: mandari

# =============================================================================
# Logging defaults (all services)
# =============================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ===========================================================================
  # Reverse Proxy with automatic SSL (Let's Encrypt)
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    container_name: mandari-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mandari
      - website
    networks:
      - mandari
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pidof caddy > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mandari-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mandari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-mandari}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-website-db.sh:/docker-entrypoint-initdb.d/init-website-db.sh:ro
    networks:
      - mandari
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mandari} -d ${POSTGRES_DB:-mandari}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis Cache (password-protected)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: mandari-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Redis password required}
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - mandari
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Elasticsearch (Full-text search)
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: mandari-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
      cluster.name: mandari
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - mandari
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================================================
  # Mandari (Django Backend)
  # ===========================================================================
  mandari:
    image: ghcr.io/mandarioss/mandari:${IMAGE_TAG:-latest}
    container_name: mandari
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-mandari}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mandari}
      # Cache (password-protected)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Search
      ELASTICSEARCH_URL: http://elasticsearch:9200
      # Security
      SECRET_KEY: ${SECRET_KEY:?Django secret key required}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Encryption key required}
      # Application
      DEBUG: "false"
      ALLOWED_HOSTS: ${DOMAIN:-localhost}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN:-localhost}
      SITE_URL: https://${DOMAIN:-localhost}
      # AI (optional)
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      # Sync Daemon
      SYNC_DAEMON_AUTOSTART: "true"
      # Timezone
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - mandari_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - mandari
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # Marketing Website (Wagtail CMS)
  # ===========================================================================
  website:
    image: ghcr.io/mandarioss/website:${IMAGE_TAG:-latest}
    container_name: mandari-website
    restart: unless-stopped
    environment:
      WEBSITE_DATABASE_URL: postgresql://${POSTGRES_USER:-mandari}:${POSTGRES_PASSWORD}@postgres:5432/${WEBSITE_DB:-mandari_website}
      WEBSITE_SECRET_KEY: ${WEBSITE_SECRET_KEY:-${SECRET_KEY}}
      MANDARI_API_URL: http://mandari:8000/api
      DEBUG: "false"
      ALLOWED_HOSTS: ${DOMAIN:-localhost}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN:-localhost}
      SITE_URL: https://${DOMAIN:-localhost}
      TZ: ${TZ:-Europe/Berlin}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mandari
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s

  # ===========================================================================
  # OParl Ingestor (Data Synchronization)
  # ===========================================================================
  ingestor:
    image: ghcr.io/mandarioss/ingestor:${IMAGE_TAG:-latest}
    container_name: mandari-ingestor
    restart: unless-stopped
    command: >
      python -m src.main daemon
      --interval ${INGESTOR_INTERVAL:-15}
      --full-sync-hour ${INGESTOR_FULL_SYNC_HOUR:-3}
      --concurrent ${INGESTOR_CONCURRENT:-10}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mandari}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mandari}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ingestor_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mandari
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

# =============================================================================
# Volumes (Persistent Data)
# =============================================================================
volumes:
  postgres_data:
    name: mandari_postgres_data
  redis_data:
    name: mandari_redis_data
  elasticsearch_data:
    name: mandari_elasticsearch_data
  mandari_media:
    name: mandari_media_data
  ingestor_data:
    name: mandari_ingestor_data
  caddy_data:
    name: mandari_caddy_data
  caddy_config:
    name: mandari_caddy_config

# =============================================================================
# Network
# =============================================================================
networks:
  mandari:
    driver: bridge
