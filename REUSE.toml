# REUSE-Konfiguration (https://reuse.software/spec-3.3/)
#
# Quellcode trägt SPDX-Header in den Dateien; hier stehen Lizenz- und
# Urheberangaben für alles, was keinen Header tragen kann (Bilder, Daten,
# Konfiguration, Fremdbibliotheken). Prüfung: `reuse lint`.

version = 1
SPDX-PackageName = "mandari"
SPDX-PackageSupplier = "Sven Konopka"
SPDX-PackageDownloadLocation = "https://github.com/mandariOSS/mandari"

# --- Grundregel: alles, was keinen eigenen Header hat, ist AGPL-3.0-or-later ---
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025-2026 Sven Konopka"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# --- Dokumentation ---
[[annotations]]
path = ["docs/**", "**/*.md", "**/*.rst"]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Sven Konopka"
SPDX-License-Identifier = "CC-BY-4.0"

# --- Konfiguration, Lockfiles, Metadaten, CI ---
[[annotations]]
path = [
  ".github/**",
  ".gitattributes",
  ".gitignore",
  ".dockerignore",
  ".pre-commit-config.yaml",
  ".editorconfig",
  "REUSE.toml",
  "**/*.json",
  "**/*.lock",
  "**/*.toml",
  "**/*.cfg",
  "**/*.ini",
  "**/*.yml",
  "**/*.yaml",
  "**/*.txt",
  "**/*.csv",
  "**/.gitkeep",
  "**/.env.example",
  "**/tsconfig.json",
  "**/package-lock.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Sven Konopka"
SPDX-License-Identifier = "CC0-1.0"

# --- Erzeugte Testdaten: gerenderte E-Mails ---
# Der sichtbare Urheberhinweis in der Fußzeile der E-Mails ist Inhalt, keine eigene Angabe der Datei.
[[annotations]]
path = "mandari/apps/common/tests/snapshots/**/*.html"
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Sven Konopka"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# --- Marke: nur Kennzeichen (Logo, Wortmarke, Favicons, App-Icons), keine freie Lizenz ---
# Übrige Grafiken (z. B. mandari/static/images/og-default.png) fallen unter die Grundregel oben.
[[annotations]]
path = [
  "mandari/static/brand/**",
  "mandari/static/images/favicon.ico",
  "mandari/static/images/favicon.svg",
  "docs/assets/logo*.svg",
]
precedence = "override"
SPDX-FileCopyrightText = "2025-2026 Sven Konopka"
SPDX-License-Identifier = "LicenseRef-Mandari-Brand"

# --- Fremdbibliotheken (lokale Kopien, DSGVO-konform ohne CDN) ---
# Schrift Inter (Bürgerportal, wie mandari.de selbst gehostet)
[[annotations]]
path = "mandari/static/vendor/inter/*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "mandari/static/vendor/leaflet/**"
precedence = "override"
SPDX-FileCopyrightText = "2010-2023 Vladimir Agafonkin, 2010-2011 CloudMade"
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = "mandari/static/vendor/chartjs/**"
precedence = "override"
SPDX-FileCopyrightText = "2014-2024 Chart.js Contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "mandari/static/vendor/fullcalendar/**"
precedence = "override"
SPDX-FileCopyrightText = "2023 Adam Shaw"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "mandari/static/vendor/marked/**"
precedence = "override"
SPDX-FileCopyrightText = "2011-2024 Christopher Jeffrey and marked contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "mandari/static/vendor/sortablejs/**"
precedence = "override"
SPDX-FileCopyrightText = "2019 Lebedev Konstantin and SortableJS contributors"
SPDX-License-Identifier = "MIT"

# --- Übernommene Testseiten: ALLRIS 3 aus dem Projekt bv-hh (unverändert, Herkunft im README daneben) ---
[[annotations]]
path = "ingestor/tests/fixtures/scrapers/allris3/**/*.html"
precedence = "override"
SPDX-FileCopyrightText = "2020, 2021 Timo B. Kranz (https://github.com/bv-hh/bv-hh)"
SPDX-License-Identifier = "MIT"

# Synthetische Seiten im Aufbau der übernommenen (bearbeitet nach bv-hh, Inhalte erfunden). Muss nach der Regel
# darüber stehen: Es gilt die letzte passende Zuordnung.
[[annotations]]
path = "ingestor/tests/fixtures/scrapers/allris3/synthetisch/*.html"
precedence = "override"
SPDX-FileCopyrightText = [
  "2020, 2021 Timo B. Kranz (https://github.com/bv-hh/bv-hh)",
  "2025-2026 Sven Konopka",
]
SPDX-License-Identifier = "MIT"

# --- kommParl-Spezifikation: übernommene Schemas, unverändert (Herkunft in HERKUNFT.json daneben) ---
# kommParl ist eine Bearbeitung der OParl-Spezifikation; beide stehen unter CC BY-SA 4.0
# (https://github.com/mandariOSS/kommParl/blob/main/HERKUNFT.md). Erneuern: scripts/kommparl_schemas.py.
[[annotations]]
path = ["mandari/hub/api/kommparl/*/schema/*.json", "mandari/hub/api/kommparl/*/profiles/**/*.json"]
precedence = "override"
SPDX-FileCopyrightText = [
  "kommParl-Beitragende (https://github.com/mandariOSS/kommParl)",
  "OParl-Initiative und Mitwirkende der OParl-Spezifikation (https://github.com/OParl/spec)",
]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# --- Beschreibung der Schnittstelle: enthält die umgewandelten kommParl-Schemas (Objekttypen und Profile) ---
# Erzeugt (manage.py schnittstelle_beschreibung); eigener Anteil CC0-1.0, übernommener Anteil CC BY-SA 4.0 wie die
# Schemas oben. Muss nach der Regel für **/*.json stehen: Es gilt die letzte passende Zuordnung.
[[annotations]]
path = "docs/schnittstelle/openapi.json"
precedence = "override"
SPDX-FileCopyrightText = [
  "2025-2026 Sven Konopka",
  "kommParl-Beitragende (https://github.com/mandariOSS/kommParl)",
  "OParl-Initiative und Mitwirkende der OParl-Spezifikation (https://github.com/OParl/spec)",
]
SPDX-License-Identifier = "CC0-1.0 AND CC-BY-SA-4.0"
