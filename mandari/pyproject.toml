[[tool.importlinter.contracts]]
id = "module-unabhaengig"
name = "Fachmodule kennen sich nicht"
type = "independence"
# apps.portal kommt hinzu, sobald es das Paket gibt (docs/adr/20260929-portal-modul.md).
