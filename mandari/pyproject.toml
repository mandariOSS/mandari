    "apps.work.motions.signals -> apps.session.models",
    "apps.work.motions.views.ris -> apps.session.services.application_service",
    "apps.work.organization.selectors -> apps.session.models",
    "apps.work.ris.selectors -> apps.session.models",
    "apps.work.ris.selectors -> apps.session.services.resolution_service",
    "apps.work.ris.views.decisions -> apps.session.models",
