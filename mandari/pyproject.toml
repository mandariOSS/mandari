[project]
name = "mandari"
version = "0.11.0"
description = "Mandari Insight - Kommunalpolitische Transparenz"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
# Obergrenze = neueste Python-Version, mit der Image und CI laufen. uv sperrt für den ganzen Bereich; ohne Grenze
# müsste jede gesperrte Version schon Wheels für künftige Python-Versionen haben. Beim Wechsel des Basis-Images
# anheben und `uv lock` ausführen.
requires-python = ">=3.12,<3.15"
authors = [{ name = "Mandari Contributors" }]

# Einzige Quelle der direkten Abhängigkeiten; die gesperrten Versionen stehen in uv.lock (Image, CI, pip-audit
# und SBOM lesen sie von dort). Nach jeder Änderung hier: `uv lock` in diesem Verzeichnis.
dependencies = [
    # Gemeinsame OParl-Typen (lokales Paket ../shared, siehe [tool.uv.sources])
    "mandari-oparl",

    # Django 6.1
    "django>=6.1,<6.2",
    "django-htmx>=1.19.0",
    "django-cotton>=2.7.2",
    "django-vite>=3.2.0",
    "django-ninja>=1.7.1",
    "django-unfold>=0.40.0",
    "whitenoise>=6.7.0",

    # Database
    "psycopg[binary,pool]>=3.2.0",  # pool: Verbindungspool statt langlebiger Verbindungen (#257)
    "dj-database-url>=2.2.0",

    # Ingestor integration (needed for Django sync daemon)
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "rich>=13.9.0",

    # Cache & Sessions
    "redis>=5.2.0",

    # Environment
    "python-dotenv>=1.0.0",
    # Zeitzonendaten unabhängig vom Betriebssystem des Images (Django verlangt das Paket nur unter Windows)
    "tzdata>=2026.1",

    # Search: Client-Hauptversion = Server-Hauptversion (docker-compose.yml), deshalb die Obergrenze
    "elasticsearch>=8.12.0,<9",

    # AI / HTTP
    "httpx>=0.28.0",

    # Utilities
    "pillow>=10.3.0",  # Security: fixes heap buffer overflow, DoS, eval injection
    "cryptography>=50.0.1",
    # Sicherheitsschlüssel/Passkeys (WebAuthn/FIDO2)
    "webauthn>=3.0.1",

    # E-Mail: CSS-Inliner (Rust-Wheel, keine Systemabhängigkeiten) und Text-Alternative (Issue #175)
    "css-inline>=0.21.3",
    "html2text>=2025.4.15",

    # Document extraction (OCR)
    # Note: PyPDF2 is deprecated, using pypdf instead
    "pypdf>=6.19.0",  # Security: fixes resource exhaustion, data amplification, infinite loop
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    # Seitenanalyse von PDFs (Karten und Pläne, #599): PDFium, Apache-2.0/BSD-3-Clause – bewusst nicht PyMuPDF
    # (AGPL), siehe docs/adr/20260930-pdf-seitenanalyse-bibliothek.md
    "pypdfium2>=5.13.0",

    # PDF generation
    "xhtml2pdf>=0.2.21",  # Security: fixes ReDoS vulnerability
    "defusedxml>=0.7.1",  # Security: sicheres XML-Parsing (Task-Import)
    "reportlab>=5.0.1",
    "segno>=1.6.6",  # QR-Codes (reines Python, Teilnahmenachweis-Verifikation)

    # DOCX generation
    "python-docx>=1.2.0",

    # Real-time collaboration (WebSocket)
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.3",

    # Zero-Downtime Migrations
    "django-safemigrate>=4.3",

    # Verträge der Datendrehscheibe: JSON Schema 2020-12 für Ereignisse und Befehle (hub/contracts, #517)
    "jsonschema>=4.25.0",

    # Transitive dependencies pinned for security
    "urllib3>=2.8.0",  # Security: fixes open redirect, info disclosure
    "requests>=2.34.2",  # Security: fixes control flow, sensitive data issues
    "anyio>=4.15.1",  # Security: fixes race condition
    "zipp>=4.1.0",  # Security: fixes infinite loop

    # OpenTelemetry (aktiv nur mit OTEL_EXPORTER_OTLP_ENDPOINT, siehe apps/common/observability.py)
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-django>=0.66b0",
    "opentelemetry-instrumentation-psycopg>=0.66b0",
    "opentelemetry-instrumentation-redis>=0.66b0",
    "opentelemetry-instrumentation-requests>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    # Anwendungsmetriken unter /metrics/ (apps/common/metrics.py, Issue #231)
    "prometheus-client>=0.26.0",
    "pyyaml>=6.0.2",  # Prüfung der Compose-Rollenprofile (scripts/check_compose_roles.py, #55)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "factory-boy>=3.3.0",
    "pytest-playwright>=0.7.0",  # E2E (tests_e2e/), Browser: playwright install chromium
    "ruff==0.14.6",  # wie CI und pre-commit (Format weicht zwischen Versionen ab)
    "import-linter==2.15",  # Schichtregeln: lint-imports, wie CI (Verträge unten in [tool.importlinter])
    "mypy==2.3.1",  # wie CI: Ergebnisse unterscheiden sich zwischen mypy-Versionen
    "django-stubs[compatible-mypy]==6.1.1",
    "sqlalchemy>=2.0",  # Schema-Contract gegen die Ingestor-Modelle (insight_core/schema_contract.py)
    "djlint==1.46.2",  # gleiche Version wie CI und pre-commit (Regelsatz weicht zwischen Versionen ab)
]

[tool.uv]
# Anwendung, kein installierbares Paket: uv sperrt und installiert nur die Abhängigkeiten.
package = false
# Betrieb und Entwicklung laufen auf CPython; ohne diese Einschränkung sperrt uv zusätzlich PyPy-Varianten
# (eigene autobahn-/cbor2-Zweige), die niemand installiert.
environments = ["platform_python_implementation == 'CPython'"]

[tool.uv.sources]
# Lokales Shared-Paket (OParl-Typen) — nur für uv lock/sync; Image und CI installieren ../shared direkt
mandari-oparl = { path = "../shared", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "*/migrations/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "RET"]
ignore = [
    "E501",   # line too long – 111 Altfälle, wird mit der Komponenten-Migration abgebaut (Epic Code-Qualität)
    "E402",   # module import not at top (Django settings pattern)
    "N806",   # non-lowercase variable in function (Django patterns)
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mandari.settings_test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true
exclude = ["migrations/"]
# Gate mit schrumpfender Allowlist: scripts/mypy_allowlist.py (Module in scripts/mypy_allowlist.txt werden toleriert)

[tool.django-stubs]
django_settings_module = "mandari.settings"

[tool.djlint]
# Template-Linting (Profil Django). Regeln, die der Frontend-Ratchet bzw. spätere Phasen abdecken,
# sind bewusst ausgenommen: H021 Inline-Styles, H023 Entitäten, H014 Leerzeilen, H036 br-Abstände,
# H005/H016/H030 (Seitenkopf-Regeln, treffen Partials fälschlich).
profile = "django"
max_line_length = 120
ignore = "H005,H014,H016,H021,H023,H030,H036"
custom_blocks = "partialdef"
custom_html = "c-[a-z0-9.-]+"
format_css = false
format_js = false

[tool.importlinter]
# Schichtregeln der Datendrehscheibe (docs/adr/20260929-schichtenmodell.md): Fachmodule → Drehscheibe →
# Plattform. Prüfung aus mandari/: lint-imports. Neue Ausnahmen sind nicht erlaubt; die Listen werden
# nur kürzer, die Verträge nur strenger (scripts/check_import_linter_ratchet.py, Baseline
# scripts/import_linter_baseline.json).
# Importe innerhalb von Funktionen zählen mit. insight_ai, insight_search, insight_sync und oparl_api
# gehören bis zu ihrer Auflösung zur Drehscheibe; apps.provisioning (Mandanten anlegen) zur Plattform.
root_packages = ["apps", "hub", "insight_core", "insight_ai", "insight_search", "insight_sync", "oparl_api"]

[[tool.importlinter.contracts]]
id = "schichten"
name = "Schichten: Abhängigkeiten zeigen nur nach unten"
type = "layers"
# Oben die Fachmodule, in der Mitte die Drehscheibe, unten die Plattform. „:“ trennt Pakete derselben
# Schicht, die sich gegenseitig nutzen dürfen; (…) markiert Pakete, die es noch nicht gibt.
layers = [
    "apps.session : apps.work : (apps.portal) : apps.minutes",
    "hub : insight_core : insight_ai : insight_search : insight_sync : oparl_api",
    "apps.events : apps.common : apps.accounts : apps.tenants : apps.provisioning",
]
ignore_imports = [
    # Tests sind ausgenommen: Sie prüfen modulübergreifend und erzeugen keine Kopplung im Betrieb.
    "**.tests.** -> **",
    # Bestand (Ist-Stand 09/2026): darf nur kürzer werden, siehe scripts/check_import_linter_ratchet.py.
    "apps.accounts.adoption -> apps.session.models",
    "apps.accounts.orphaned_accounts -> apps.session.models",
    "apps.accounts.security_audit -> apps.session.audit",
    "apps.accounts.security_audit -> apps.session.models",
    "apps.accounts.two_factor_policy -> apps.session.models",
    "apps.accounts.views -> apps.work.organization.selectors",
    "apps.accounts.views -> apps.work.organization.services",
    "apps.common.management.commands.setup_demo_environment -> apps.session.models",
    "apps.common.management.commands.setup_demo_environment -> apps.work.meetings.models",
    "apps.common.management.commands.setup_demo_environment -> apps.work.models",
    "apps.common.management.commands.setup_demo_environment -> apps.work.motions.models",
    "apps.common.management.commands.setup_demo_environment -> insight_core.models",
    "apps.common.management.commands.setup_demo_praesentation -> apps.session.models",
    "apps.common.management.commands.setup_demo_praesentation -> apps.session.services.agenda_service",
    "apps.common.management.commands.setup_demo_praesentation -> apps.session.services.allowance_service",
    "apps.common.management.commands.setup_demo_praesentation -> apps.session.services.insight_service",
    "apps.common.management.commands.setup_demo_praesentation -> apps.session.services.numbering_service",
    "apps.common.management.commands.setup_demo_praesentation -> apps.session.services.protocol_lock",
    "apps.common.management.commands.setup_demo_praesentation -> apps.session.services.resolution_service",
    "apps.common.management.commands.setup_demo_praesentation -> apps.session.services.voting_service",
    "apps.common.management.commands.setup_demo_praesentation -> apps.work.motions.models",
    "apps.common.management.commands.setup_demo_praesentation -> apps.work.motions.ris_submission",
    "apps.common.management.commands.setup_demo_praesentation -> insight_core.models",
    "apps.common.management.commands.setup_demo_praesentation -> insight_sync.session_mirror",
    "apps.common.management.commands.verify_audit_chain -> apps.session.models",
    "apps.common.metrics -> apps.minutes.models",
    "apps.common.service_levels -> apps.minutes.models",
    "apps.common.service_levels -> insight_core.services.source_health",
    "apps.tenants.models -> insight_core.models",
    "insight_core.portal -> apps.session.models",
    "insight_core.portal -> apps.session.services.insight_service",
    "insight_core.services.decision_tracking -> apps.session.models",
    "insight_core.views.decisions -> apps.session.models",
    "insight_core.views.protocols -> apps.work.faction.models",
    "insight_sync.daemon -> apps.work.faction.generation",
    "insight_sync.daemon -> apps.work.faction.invitations",
    "insight_sync.daemon -> apps.work.faction.services",
