[project]
name = "mandari"
version = "2.0.0"
description = "Mandari Insight - Kommunalpolitische Transparenz"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.12"
authors = [{ name = "Mandari Contributors" }]

dependencies = [
    # Shared OParl types
    "mandari-oparl",

    # Django 6.0 (released Dec 2025)
    "django>=6.0",
    "django-htmx>=1.19.0",
    "whitenoise>=6.7.0",

    # Database
    "psycopg[binary]>=3.2.0",
    "dj-database-url>=2.2.0",

    # Ingestor integration (needed for Django sync daemon)
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "rich>=13.9.0",

    # Cache & Sessions
    "redis>=5.2.0",
    "django-redis>=5.4.0",

    # Environment
    "python-dotenv>=1.0.0",

    # Search
    "elasticsearch>=8.12.0,<9",

    # AI / HTTP
    "httpx>=0.28.0",

    # Django 6.0 has built-in background tasks - no Celery needed!

    # Utilities
    "python-dateutil>=2.9.0",
    "pillow>=10.0.0",  # For ImageField (logos)
    "markdown>=3.7",  # For markdownify template filter

    # Zero-Downtime Migrations
    "django-safemigrate>=4.3",

    # Production server
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "django-stubs>=6.0.0",  # Django 6.0 compatible
    "djlint==1.46.1",  # gleiche Version wie CI und pre-commit (Regelsatz weicht zwischen Versionen ab)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "*/migrations/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "RET"]
ignore = [
    "E501",   # line too long – 111 Altfälle, wird mit der Komponenten-Migration abgebaut (Epic Code-Qualität)
    "E402",   # module import not at top (Django settings pattern)
    "N806",   # non-lowercase variable in function (Django patterns)
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mandari.settings_test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true
exclude = ["migrations/"]
# Gate mit schrumpfender Allowlist: scripts/mypy_allowlist.py (Module in scripts/mypy_allowlist.txt werden toleriert)

[tool.django-stubs]
django_settings_module = "mandari.settings"

[tool.djlint]
# Template-Linting (Profil Django). Regeln, die der Frontend-Ratchet bzw. spätere Phasen abdecken,
# sind bewusst ausgenommen: H021 Inline-Styles, H023 Entitäten, H014 Leerzeilen, H036 br-Abstände,
# H005/H016/H030 (Seitenkopf-Regeln, treffen Partials fälschlich).
profile = "django"
max_line_length = 120
ignore = "H005,H014,H016,H021,H023,H030,H036"
custom_blocks = "partialdef"
custom_html = "c-[a-z0-9.-]+"
format_css = false
format_js = false
