{% extends "base_insight.html" %}
{% load static %}

{% block title %}Sitzungen{% endblock %}

{% block page %}
<c-insight.kopfband titel="Sitzungen" text="{% if active_body %}Öffentliche Sitzungen der Gremien von {{ active_body.get_display_name }}, mit Tagesordnung und Unterlagen.{% else %}Bitte wählen Sie eine Kommune aus.{% endif %}">
    <!-- Search -->
    <div class="mb-4">
        <div class="relative max-w-md">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
            <input type="search"
                   id="search-meetings"
                   name="q"
                   value="{{ request.GET.q }}"
                   placeholder="Sitzung suchen..."
                   hx-get="{% url 'insight_core:insight:meeting_list' %}"
                   hx-trigger="keyup changed delay:400ms, search"
                   hx-target="#meetings-list"
                   hx-swap="innerHTML"
                   hx-indicator="#meeting-search-loading"
                   hx-include="#period-tabs input[name='period']:checked"
                   class="w-full pl-10 pr-10 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none">
            <div id="meeting-search-loading" class="htmx-indicator absolute right-3 top-1/2 -translate-y-1/2">
                <svg class="animate-spin h-5 w-5 text-primary-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>
    </div>
    <!-- Period Tabs -->
    <div id="period-tabs" class="flex gap-2 border-b border-gray-200 dark:border-gray-700">
        <a href="?period=upcoming{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}"
           class="px-4 py-2 text-sm font-medium border-b-2 -mb-px transition-colors {% if request.GET.period == 'upcoming' or not request.GET.period %}border-primary-500 text-primary-600 dark:text-primary-400{% else %}border-transparent text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-200{% endif %}">
            Kommende
        </a>
        <a href="?period=past{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}"
           class="px-4 py-2 text-sm font-medium border-b-2 -mb-px transition-colors {% if request.GET.period == 'past' %}border-primary-500 text-primary-600 dark:text-primary-400{% else %}border-transparent text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-200{% endif %}">
            Vergangene
        </a>
        <a href="?period=all{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}"
           class="px-4 py-2 text-sm font-medium border-b-2 -mb-px transition-colors {% if request.GET.period == 'all' %}border-primary-500 text-primary-600 dark:text-primary-400{% else %}border-transparent text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-200{% endif %}">
            Alle
        </a>
    </div>
    <p class="mt-4 text-[0.95rem]"><a href="{% url 'insight_core:insight:meeting_calendar' %}" class="inline-flex items-center gap-1.5 font-medium text-primary-700 dark:text-primary-300 underline-offset-4 hover:underline"><i data-lucide="calendar" class="w-4 h-4" aria-hidden="true"></i>Als Kalender ansehen</a></p>
</c-insight.kopfband>
<c-insight.band>
    <div id="meetings-list">
        {% include "partials/meeting_list_items.html" %}
    </div>
</c-insight.band>
{% endblock %}
