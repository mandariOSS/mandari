{% extends "base_insight.html" %}
{% load static %}

{% block title %}Personen{% endblock %}

{% block page %}
<c-insight.kopfband titel="Personen" text="{% if active_body %}Ratsmitglieder und sachkundige Bürgerinnen und Bürger von {{ active_body.get_display_name }}.{% else %}Bitte wählen Sie eine Kommune aus.{% endif %}">
    <!-- Search -->
    <div class="mb-4">
        <div class="relative max-w-md">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
            <input type="search"
                   id="search-persons"
                   name="q"
                   value="{{ request.GET.q }}"
                   placeholder="Name, Funktion oder Gremium suchen..."
                   hx-get="{% url 'insight_core:insight:person_list' %}"
                   hx-trigger="keyup changed delay:400ms, search"
                   hx-target="#persons-list"
                   hx-swap="innerHTML"
                   hx-indicator="#person-search-loading"
                   class="w-full pl-10 pr-10 py-2.5 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none">
            <div id="person-search-loading" class="htmx-indicator absolute right-3 top-1/2 -translate-y-1/2">
                <svg class="animate-spin h-5 w-5 text-primary-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </div>
    </div>
</c-insight.kopfband>
<c-insight.band>
    <div id="persons-list">
        {% include "partials/person_list_items.html" %}
    </div>
</c-insight.band>
{% endblock %}
