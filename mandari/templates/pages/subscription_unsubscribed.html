{% extends "base_insight.html" %}

{% block title %}Abgemeldet{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto py-16 px-4 text-center">
    <div class="w-20 h-20 mx-auto mb-6 rounded-2xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center">
        <i data-lucide="bell-off" class="w-10 h-10 text-gray-400"></i>
    </div>

    <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-3">Erfolgreich abgemeldet</h1>
    <p class="text-gray-600 dark:text-gray-400 mb-8">
        Sie erhalten keine weiteren Benachrichtigungen an
        <strong>{{ subscriber.email }}</strong> f&uuml;r {{ subscriber.body.get_display_name }}.
    </p>

    <div class="flex flex-wrap justify-center gap-3">
        <a href="{% url 'insight_core:insight:portal_home' %}"
           class="inline-flex items-center gap-2 px-5 py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm font-semibold transition-all shadow-sm hover:shadow-md">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            Zur &Uuml;bersicht
        </a>
        <a href="{% url 'insight_core:insight:notifications' %}"
           class="inline-flex items-center gap-2 px-5 py-2.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg text-sm font-medium text-gray-700 dark:text-gray-300 hover:border-primary-300 dark:hover:border-primary-700 transition-colors">
            <i data-lucide="bell" class="w-4 h-4"></i>
            Neues Abo erstellen
        </a>
    </div>
</div>
{% endblock %}
