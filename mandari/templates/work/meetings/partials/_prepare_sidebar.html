        <!-- ============ Spalte 3: Meine Notizen + Diskussion ============ -->
        <aside :class="mobileTab === 'discussion' ? 'flex' : 'hidden xl:flex'"
               class="mt-4 xl:mt-0 flex-col gap-4 xl:h-full min-h-0">
            <template x-if="selectedItem">
                <div class="flex flex-col gap-4 min-h-0 xl:h-full">
                    <!-- Meine Notizen (privat) -->
                    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 shrink-0">
                        <div class="flex items-center gap-2 mb-2">
                            <h3 class="text-sm font-semibold text-gray-900 dark:text-white uppercase tracking-wide flex items-center gap-2">
                                <i data-lucide="sticky-note" class="w-4 h-4 text-amber-500"></i>
                                Meine Notizen
                            </h3>
                            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 text-[10px] font-medium rounded bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400">
                                <i data-lucide="lock" class="w-3 h-3"></i> Nur für dich
                            </span>
                        </div>
                        <textarea rows="3" x-model="selectedItem.privateNote"
                                  @input="autoGrow($event.target, 12); queueItemSave('private-note', selectedItem, item => savePrivateNote(item))"
                                  class="prep-autogrow w-full px-3 py-2 text-sm bg-amber-50/40 dark:bg-gray-900/60 border border-gray-200 dark:border-gray-700 rounded-lg focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none dark:text-gray-100"
                                  placeholder="Private Gedanken zu diesem TOP..."></textarea>
                    </div>

                    <!-- Diskussion -->
                    <div class="flex flex-col flex-1 min-h-0 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 border-l-4 border-l-emerald-400 dark:border-l-emerald-600 rounded-xl overflow-hidden">
                        <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-700 flex items-center gap-2 shrink-0">
                            <h3 class="text-sm font-semibold text-gray-900 dark:text-white uppercase tracking-wide flex items-center gap-2">
                                <i data-lucide="messages-square" class="w-4 h-4 text-emerald-500"></i>
                                Diskussion
                            </h3>
                            <div class="flex-1"></div>
                            <span x-show="realtime === 'ws'" class="flex items-center gap-1 text-[11px] text-emerald-600 dark:text-emerald-400" title="Echtzeit-Verbindung aktiv">
                                <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                                Live
                            </span>
                            <span x-show="realtime === 'poll'" class="flex items-center gap-1 text-[11px] text-gray-400" title="Aktualisierung alle 5 Sekunden">
                                <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                                Auto
                            </span>
                        </div>

                        <!-- Thread -->
                        <div class="flex-1 min-h-0 overflow-y-auto px-4 py-3 space-y-2.5 max-h-[50vh] xl:max-h-none" x-ref="threadList">
                            <template x-for="note in thread" :key="note.id">
                                <div class="px-3 py-2.5 rounded-lg border"
                                     x-transition:enter="transition ease-out duration-300"
                                     x-transition:enter-start="opacity-0 -translate-y-1"
                                     x-transition:enter-end="opacity-100 translate-y-0"
                                     :class="(note.is_recommendation || note.is_decision)
                                        ? 'bg-primary-50/60 dark:bg-primary-900/15 border-primary-100 dark:border-primary-900'
                                        : 'bg-gray-50 dark:bg-gray-900/50 border-gray-100 dark:border-gray-700'">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-xs font-semibold text-gray-800 dark:text-gray-100" x-text="note.author"></span>
                                        <span class="text-[11px] text-gray-400" x-text="fmtDateTime(note.created_at)"></span>
                                        <div class="flex-1"></div>
                                        <button type="button" x-show="note.is_own" @click="deleteComment(note.id)"
                                                class="p-0.5 text-gray-300 hover:text-red-500 transition-colors" title="Kommentar löschen">
                                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                    <p class="text-sm text-gray-700 dark:text-gray-200 whitespace-pre-line break-words" x-text="note.content"></p>
                                    <div class="mt-1.5 flex flex-wrap items-center gap-1.5">
                                        <span x-show="note.is_recommendation || note.is_decision"
                                              class="inline-flex items-center gap-1 px-1.5 py-0.5 text-[10px] font-semibold rounded bg-primary-100 dark:bg-primary-900/40 text-primary-700 dark:text-primary-300">
                                            <i data-lucide="flag" class="w-3 h-3"></i>
                                            Position der Fraktion
                                        </span>
                                        <span class="inline-flex items-center gap-1 px-1.5 py-0.5 text-[10px] font-medium rounded"
                                              :class="note.visibility === 'consulting'
                                                ? 'bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-300'
                                                : 'bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400'"
                                              x-text="note.visibility_display"></span>
                                        <span x-show="note.organization && note.is_own_org === false"
                                              class="inline-flex items-center gap-1 px-1.5 py-0.5 text-[10px] font-medium rounded bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300"
                                              x-text="note.organization"></span>
                                        <template x-if="note.origin">
                                            <a :href="`/work/${orgSlug}/meetings/${note.origin.meeting_id}/prepare/`"
                                               class="inline-flex items-center gap-1 text-[11px] text-indigo-600 dark:text-indigo-400 hover:underline">
                                                <i data-lucide="corner-up-right" class="w-3 h-3"></i>
                                                <span x-text="'aus ' + note.origin.label"></span>
                                            </a>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <div x-show="thread.length === 0 && !threadLoading" class="py-8 text-center">
                                <i data-lucide="message-circle" class="w-7 h-7 mx-auto mb-2 text-gray-300 dark:text-gray-600"></i>
                                <p class="text-sm text-gray-400">Noch keine Beiträge zu diesem TOP.</p>
                            </div>
                        </div>

                        <!-- Eingabe (unten fixiert) -->
                        <div class="px-4 py-3 border-t border-gray-100 dark:border-gray-700 bg-white dark:bg-gray-800 shrink-0">
                            <textarea rows="2" x-model="newComment"
                                      @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); postComment(); }"
                                      class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none dark:text-gray-100 resize-none"
                                      placeholder="Beitrag schreiben... (Enter sendet)"></textarea>
                            <div class="mt-1.5 flex items-center gap-2">
                                <select id="thread-visibility" x-model="commentVisibility" title="Sichtbarkeit"
                                        class="px-2 py-1.5 text-xs bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg dark:text-gray-100 outline-none focus:border-primary-500">
                                    {% for code, label in visibility_choices %}
                                    <option value="{{ code }}">{{ label }}</option>
                                    {% endfor %}
                                </select>
                                <label class="flex items-center gap-1.5 text-xs text-gray-500 dark:text-gray-400 cursor-pointer" title="Beitrag als Position der Fraktion markieren">
                                    <input type="checkbox" x-model="commentIsPosition"
                                           class="w-3.5 h-3.5 text-primary-600 border-gray-300 rounded focus:ring-primary-500">
                                    Position der Fraktion
                                </label>
                                <div class="flex-1"></div>
                                <button type="button" @click="postComment()" :disabled="!newComment.trim()"
                                        class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 disabled:opacity-40 shadow-sm transition-colors">
                                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                                    Senden
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </aside>
