        <!-- ============ Spalte 1: TOP-Navigator ============ -->
        <nav id="top-navigator" aria-label="Tagesordnungspunkte"
             :class="mobileTab === 'tops' ? 'flex' : 'hidden xl:flex'"
             class="flex-col bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden xl:h-full">
            <div class="p-3 border-b border-gray-200 dark:border-gray-700 shrink-0">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="search" x-model="search" placeholder="TOP suchen..."
                           class="w-full pl-8 pr-2.5 py-1.5 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none dark:text-gray-100">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-2 max-h-[60vh] xl:max-h-none" role="list">
                <template x-for="item in filteredItems" :key="item.id">
                    <button :id="'nav-item-' + item.id" role="listitem"
                            @click="selectItem(item.id); mobileTab = 'main'"
                            :aria-current="selectedItemId === item.id ? 'true' : 'false'"
                            :class="selectedItemId === item.id
                                ? 'bg-primary-50 dark:bg-primary-900/25 border-primary-300 dark:border-primary-700'
                                : 'bg-transparent border-transparent hover:bg-gray-50 dark:hover:bg-gray-700/60'"
                            class="w-full text-left px-2.5 py-2 rounded-lg border mb-1 transition-colors group">
                        <div class="flex items-start gap-2.5">
                            <!-- Nummer + Positions-Farbpunkt -->
                            <span class="relative shrink-0 mt-0.5">
                                <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-semibold bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200"
                                      x-text="item.number"></span>
                                <span class="absolute -right-1 -bottom-1 w-3 h-3 rounded-full ring-2 ring-white dark:ring-gray-800"
                                      :class="posDot(item.position)"
                                      :title="posLabel(item.position)"></span>
                            </span>
                            <span class="flex-1 min-w-0">
                                <!-- Titel: nie abschneiden ohne Tooltip -->
                                <span class="block text-sm leading-snug text-gray-800 dark:text-gray-100 line-clamp-2"
                                      :title="item.name" x-text="item.name"></span>
                                <!-- Mini-Status -->
                                <span class="mt-0.5 flex items-center gap-2 text-gray-400 dark:text-gray-500">
                                    <span x-show="item.isFinal" class="inline-flex items-center" title="Position endgültig">
                                        <i data-lucide="lock" class="w-3 h-3 text-green-500"></i>
                                    </span>
                                    <span x-show="item.hasSpeechNote || item.speechLinkedDocument" class="inline-flex items-center" title="Redebeitrag vorhanden">
                                        <i data-lucide="mic" class="w-3 h-3 text-primary-500"></i>
                                    </span>
                                    <span x-show="item.privateNote && item.privateNote.trim()" class="inline-flex items-center" title="Private Notiz vorhanden">
                                        <i data-lucide="sticky-note" class="w-3 h-3 text-amber-500"></i>
                                    </span>
                                    <span x-show="item.notesCount > 0" class="inline-flex items-center gap-0.5 text-[10px]" title="Kommentare">
                                        <i data-lucide="message-circle" class="w-3 h-3"></i>
                                        <span x-text="item.notesCount"></span>
                                    </span>
                                </span>
                            </span>
                        </div>
                    </button>
                </template>
                <p x-show="filteredItems.length === 0" class="px-3 py-6 text-sm text-center text-gray-400">
                    Keine TOPs gefunden
                </p>
            </div>
            <div class="px-3 py-2 border-t border-gray-200 dark:border-gray-700 shrink-0 hidden xl:block">
                <p class="text-[11px] text-gray-400 dark:text-gray-500 flex items-center gap-1">
                    <i data-lucide="arrow-up-down" class="w-3 h-3"></i>
                    Pfeiltasten wechseln den TOP
                </p>
            </div>
        </nav>
