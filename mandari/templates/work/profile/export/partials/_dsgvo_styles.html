{# DSGVO-Datenexport (PDF via xhtml2pdf): Druck-Stylesheet – Inline-CSS ist hier fachlich nötig, weil das PDF ohne Static-Files gerendert wird #}
<style>
    @page {
        size: A4;
        margin: 25mm 20mm 20mm 20mm;

        @frame footer {
            -pdf-frame-content: page-footer;
            bottom: 0;
            margin-left: 20mm;
            margin-right: 20mm;
            height: 15mm;
        }
    }

    body {
        font-family: "Helvetica", "Arial", sans-serif;
        font-size: 10pt;
        line-height: 1.4;
        color: #333;
    }

    /* Cover */
    .cover {
        text-align: center;
        padding-top: 40px;
        padding-bottom: 30px;
        border-bottom: 2px solid #333;
        margin-bottom: 30px;
    }
    .cover-org {
        font-size: 14pt;
        font-weight: bold;
        color: #111;
        margin-bottom: 8px;
    }
    .cover-title {
        font-size: 18pt;
        font-weight: bold;
        color: #111;
        margin: 15px 0;
    }
    .cover-subtitle {
        font-size: 10pt;
        color: #666;
        margin: 5px 0;
    }

    /* Sections */
    h2 {
        font-size: 13pt;
        font-weight: bold;
        color: #111;
        margin-top: 25px;
        margin-bottom: 8px;
        padding-bottom: 4px;
        border-bottom: 1px solid #ccc;
    }
    h3 {
        font-size: 11pt;
        font-weight: bold;
        color: #333;
        margin-top: 15px;
        margin-bottom: 6px;
    }
    .h3-tight { margin-top: 5px; }

    /* Tables */
    table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0 15px 0;
        table-layout: fixed;
        word-wrap: break-word;
    }
    th {
        background: #f5f5f5;
        text-align: left;
        padding: 5px 6px;
        font-size: 8pt;
        font-weight: bold;
        border-bottom: 1px solid #ddd;
        overflow: hidden;
    }
    td {
        padding: 5px 6px;
        font-size: 8pt;
        border-bottom: 1px solid #eee;
        vertical-align: top;
        overflow: hidden;
        word-wrap: break-word;
    }
    tr:last-child td {
        border-bottom: none;
    }

    /* Key-value pairs */
    .kv-table td:first-child {
        font-weight: bold;
        width: 35%;
        color: #555;
    }

    /* Column width helpers */
    .col-date { width: 20%; }
    .col-ip { width: 15%; }
    .col-status { width: 12%; }
    .col-narrow { width: 10%; }
    .col-wide { width: 30%; }
    .col-15 { width: 15%; }
    .col-18 { width: 18%; }
    .col-22 { width: 22%; }
    .col-25 { width: 25%; }
    .col-28 { width: 28%; }

    /* Content blocks */
    .content-block {
        background: #fafafa;
        border: 1px solid #eee;
        padding: 8px 10px;
        margin: 5px 0 10px 0;
        font-size: 9pt;
        line-height: 1.4;
    }

    /* Item card */
    .item-header {
        background: #f5f5f5;
        padding: 6px 10px;
        margin-top: 12px;
        margin-bottom: 4px;
        font-weight: bold;
        font-size: 10pt;
        border-left: 3px solid #888;
    }

    /* Labels */
    .label {
        font-size: 8pt;
        padding: 2px 6px;
        background: #e8e8e8;
        color: #555;
    }
    .label-success { background: #d4edda; color: #155724; }
    .label-warning { background: #fff3cd; color: #856404; }
    .label-danger { background: #f8d7da; color: #721c24; }

    /* Notes */
    .note { font-size: 8pt; color: #999; }
    .note-small { font-size: 7pt; color: #888; }

    /* Empty state */
    .empty {
        color: #999;
        font-style: italic;
        font-size: 9pt;
        margin: 5px 0;
    }

    /* Footer */
    .footer {
        font-size: 8pt;
        color: #999;
        text-align: center;
        border-top: 1px solid #eee;
        padding-top: 5px;
    }

    /* Pagebreak helper */
    .page-break { page-break-before: always; }
</style>
