{% comment %}
Meta-Zeile des Panels (angelegt von / am, erledigt am). Kontext: task
{% endcomment %}
<div class="px-6 py-3 mt-3">
    <div class="flex items-center gap-4 text-[11px] text-gray-400 dark:text-gray-500">
        <span class="flex items-center gap-1">
            <i data-lucide="user-circle" class="w-3 h-3"></i>
            {{ task.created_by.user.get_display_name }}
        </span>
        <span class="flex items-center gap-1">
            <i data-lucide="clock" class="w-3 h-3"></i>
            {{ task.created_at|date:"d.m.Y, H:i" }}
        </span>
        {% if task.completed_at %}
        <span class="flex items-center gap-1 text-green-500 dark:text-green-400">
            <i data-lucide="check-circle-2" class="w-3 h-3"></i>
            Erledigt {{ task.completed_at|date:"d.m.Y" }}
        </span>
        {% endif %}
    </div>
</div>
