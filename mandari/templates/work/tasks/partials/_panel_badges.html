{% comment %}
Überfällig-Hinweis und Label-Badges im Panel-Kopf.
Kontext: task. Optional: overdue_shape (rounded-full|rounded-md, Standard rounded-full)
{% endcomment %}
{% if task.is_overdue %}
<span class="inline-flex items-center gap-1 px-2 py-0.5 {{ overdue_shape|default:'rounded-full' }} text-[11px] font-semibold bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 ring-1 ring-red-200 dark:ring-red-800/50">
    <i data-lucide="alert-circle" class="w-3 h-3"></i>
    Überfällig
</span>
{% endif %}
{% for label in task.labels.all %}
<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-{{ label.color }}-100 dark:bg-{{ label.color }}-900/30 text-{{ label.color }}-700 dark:text-{{ label.color }}-300 ring-1 ring-{{ label.color }}-200/50 dark:ring-{{ label.color }}-700/30">
    {{ label.name }}
</span>
{% endfor %}
