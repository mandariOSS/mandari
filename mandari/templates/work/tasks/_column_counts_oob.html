<span id="count-todo" hx-swap-oob="innerHTML:#count-todo">{{ todo_count }} Aufgaben</span>
<span id="count-in_progress" hx-swap-oob="innerHTML:#count-in_progress">{{ in_progress_count }} Aufgaben</span>
<span id="count-done" hx-swap-oob="innerHTML:#count-done">{{ done_count }}{% if not show_all_completed %}+{% endif %} Aufgaben</span>
