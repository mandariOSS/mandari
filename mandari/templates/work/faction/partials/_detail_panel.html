{# Fraktionssitzung – Slide-over für einen TOP; Inhalt lädt factionDetail.openItemPanel() per HTMX in #agenda-panel-content #}
{# Kontext: keiner (Zustand `openPanel` aus x-data="factionDetail") #}
<div x-show="openPanel" x-cloak
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click="closePanel()"
     class="fixed inset-0 bg-black/20 z-30"></div>

<div x-show="openPanel" x-cloak
     x-transition:enter="transform transition ease-in-out duration-300"
     x-transition:enter-start="translate-x-full"
     x-transition:enter-end="translate-x-0"
     x-transition:leave="transform transition ease-in-out duration-200"
     x-transition:leave-start="translate-x-0"
     x-transition:leave-end="translate-x-full"
     class="fixed inset-y-0 right-0 w-full sm:w-[560px] lg:w-[640px] bg-white dark:bg-gray-800 shadow-xl z-40 overflow-hidden flex flex-col">
    <div id="agenda-panel-content" class="flex-1 overflow-hidden flex flex-col">
        <div class="flex items-center justify-center h-full text-gray-400">
            <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i>
        </div>
    </div>
</div>
