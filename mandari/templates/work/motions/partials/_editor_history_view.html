{% comment %}
Versionsvergleich im Textbereich des Dokumenteditors (Google-Docs-Stil): Kopfzeile mit Zurück, Vergleich/
Original und Wiederherstellen, darunter der Unterschied. Kontext: can_edit; Alpine-Komponente documentEditor.
{% endcomment %}
<!-- History Diff Mode (Google Docs style — diff in main area) -->
<div x-show="historyMode" x-cloak class="editor-page relative">
    <!-- History Mode Header Bar -->
    <div class="sticky top-0 z-10 flex items-center justify-between px-6 py-3 bg-amber-50 dark:bg-amber-900/20 border-b border-amber-200 dark:border-amber-800">
        <div class="flex items-center gap-3">
            <button type="button" @click="exitHistoryMode()"
                    class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 shadow-sm">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Zurück zum Editor
            </button>
            <template x-if="selectedRevision">
                <span class="text-sm text-amber-800 dark:text-amber-200">
                    <span class="font-medium" x-text="'Version ' + selectedRevision.version"></span>
                    <span class="mx-1">·</span>
                    <span x-text="selectedRevision.changed_by"></span>
                    <span class="mx-1">·</span>
                    <span x-text="formatTimeAgo(selectedRevision.created_at)"></span>
                </span>
            </template>
        </div>
        <div class="flex items-center gap-2">
            <div class="flex items-center bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden">
                <button type="button" @click="revisionViewMode = 'diff'"
                        :class="revisionViewMode === 'diff' ? 'bg-primary-100 text-primary-700 dark:bg-primary-900 dark:text-primary-300' : 'text-gray-600 dark:text-gray-400'"
                        class="px-3 py-1.5 text-xs font-medium">Vergleich</button>
                <button type="button" @click="revisionViewMode = 'original'"
                        :class="revisionViewMode === 'original' ? 'bg-primary-100 text-primary-700 dark:bg-primary-900 dark:text-primary-300' : 'text-gray-600 dark:text-gray-400'"
                        class="px-3 py-1.5 text-xs font-medium">Original</button>
            </div>
            {% if can_edit %}
            <button type="button" @click="restoreRevision(selectedRevision)"
                    class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 shadow-sm">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                Wiederherstellen
            </button>
            {% endif %}
        </div>
    </div>
    <template x-if="revisionLoading">
        <div class="flex justify-center py-16">
            <svg class="animate-spin h-8 w-8 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
    </template>
    <template x-if="!revisionLoading && historyMode">
        <div class="history-diff-viewer"
             x-html="revisionViewMode === 'diff' ? revisionDiff : revisionContent"></div>
    </template>
</div>
