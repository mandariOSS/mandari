{% comment %}
Breadcrumb (Ordner-Pfad) über der Dokumentenliste.
Kontext: folder_breadcrumbs, current_folder, filter_query, organization
{% endcomment %}
<div class="fade-up flex items-center gap-1.5 mb-3 text-sm text-gray-500 dark:text-gray-400 flex-wrap">
    <a href="{% url 'work:documents' org_slug=organization.slug %}{% if filter_query %}?{{ filter_query }}{% endif %}"
       class="hover:text-primary-600 hover:underline {% if not current_folder %}font-semibold text-gray-900 dark:text-white{% endif %}">Alle Dokumente</a>
    {% for crumb in folder_breadcrumbs %}
    <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-300"></i>
    <a href="?ordner={{ crumb.id }}{% if filter_query %}&amp;{{ filter_query }}{% endif %}" class="hover:text-primary-600 hover:underline">{{ crumb.name }}</a>
    {% endfor %}
    {% if current_folder %}
    <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-300"></i>
    <span class="font-semibold text-gray-900 dark:text-white flex items-center gap-1.5">
        <i data-lucide="folder" class="w-4 h-4 {% if current_folder.color %}text-{{ current_folder.color }}-500{% else %}text-gray-400{% endif %}"></i>
        {{ current_folder.name }}
    </span>
    {% endif %}
</div>
