{% load static %}
{% comment %}Stile des Antragseditors (static/css/work-editor.css); hier nur Ränder und Schrift des gewählten Briefkopfs,
damit Editor-Ansicht und PDF-Export deckungsgleich sind (Fallback: Standardwerte).{% endcomment %}
<link rel="stylesheet" href="{% static 'css/work-editor.css' %}">
<style nonce="{{ csp_nonce }}">
    #editor-container .tiptap {
        {% if letterhead %}
        padding: {{ letterhead.content_margin_top }}mm {{ letterhead.content_margin_right }}mm {{ letterhead.content_margin_bottom }}mm {{ letterhead.content_margin_left }}mm;
        font-size: {{ letterhead.font_size|default:11 }}pt;
        font-family: "{{ letterhead.font_family|default:'Arial' }}", Arial, Helvetica, sans-serif;
        {% else %}
        padding: 30mm 25mm 25mm 25mm;
        font-size: 11pt;
        font-family: Arial, Helvetica, sans-serif;
        {% endif %}
    }
</style>
