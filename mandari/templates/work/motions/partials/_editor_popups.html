    <!-- Inline Comment Popup (appears on text selection) -->
    {% if can_edit or access_level == 'comment' %}
    <div x-show="commentPopupVisible" x-cloak
         class="comment-popup"
         :style="'top: ' + commentPopupTop + 'px; left: ' + commentPopupLeft + 'px'"
         @keydown.escape.window="hideCommentPopup()">

        <!-- Collapsed: comment button -->
        <template x-if="!commentPopupExpanded">
            <button @click.stop="expandCommentPopup()"
                    class="comment-popup-btn">
                <i data-lucide="message-square-plus" class="w-4 h-4 text-amber-500"></i>
                Kommentieren
            </button>
        </template>

        <!-- Expanded: comment form -->
        <template x-if="commentPopupExpanded">
            <div class="comment-popup-card" @click.stop>
                <!-- Selected text preview -->
                <div class="px-3 py-2.5 border-b border-gray-100 dark:border-gray-700 bg-amber-50/50 dark:bg-amber-900/10">
                    <p class="text-[11px] font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-1">Markierter Text</p>
                    <p class="text-sm text-gray-700 dark:text-gray-300 italic line-clamp-2"
                       x-text="'&quot;' + inlineSelectedText.substring(0, 120) + (inlineSelectedText.length > 120 ? '...' : '') + '&quot;'"></p>
                </div>
                <!-- Input -->
                <div class="p-3">
                    <textarea x-model="inlineCommentText"
                              x-ref="inlineCommentInput"
                              rows="3"
                              placeholder="Kommentar schreiben..."
                              @keydown.meta.enter="submitInlineComment()"
                              @keydown.ctrl.enter="submitInlineComment()"
                              class="w-full px-3 py-2 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent resize-none"></textarea>
                    <div class="flex items-center justify-between mt-2">
                        <button @click="hideCommentPopup()"
                                class="px-3 py-1.5 text-xs font-medium text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                            Abbrechen
                        </button>
                        <button @click="submitInlineComment()"
                                :disabled="!inlineCommentText.trim() || commentSubmitting"
                                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed">
                            <svg x-show="commentSubmitting" class="animate-spin w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <i data-lucide="send" class="w-3.5 h-3.5" x-show="!commentSubmitting"></i>
                            <span x-text="commentSubmitting ? 'Senden...' : 'Senden'"></span>
                        </button>
                    </div>
                    <p class="text-[10px] text-gray-400 mt-1.5 text-right">Strg+Enter zum Senden</p>
                </div>
            </div>
        </template>
    </div>
    {% endif %}

    <!-- Mark Comment Popup (appears on clicking highlighted inline comment) -->
    <div x-show="markCommentPopup" x-cloak
         class="comment-popup"
         :style="'top:' + markCommentTop + 'px; left:' + markCommentLeft + 'px'"
         @keydown.escape.window="hideMarkPopup()">
        <div class="comment-popup-card" @click.stop x-show="markCommentData">
            <!-- Selected text quote -->
            <div class="px-4 py-2.5 border-b border-gray-100 dark:border-gray-700 bg-amber-50/50 dark:bg-amber-900/10">
                <p class="text-sm text-gray-700 dark:text-gray-300 italic line-clamp-2"
                   x-text="markCommentData ? markCommentData.selected_text : ''"></p>
            </div>

            <!-- Main comment -->
            <div class="px-4 py-3">
                <div class="flex items-center gap-2 mb-1.5">
                    <div class="w-6 h-6 rounded-full bg-primary-100 dark:bg-primary-900/30 flex items-center justify-center flex-shrink-0">
                        <span class="text-xs font-medium text-primary-600 dark:text-primary-400"
                              x-text="markCommentData ? markCommentData.author_initials : ''"></span>
                    </div>
                    <span class="text-xs font-medium text-gray-900 dark:text-white"
                          x-text="markCommentData ? markCommentData.author_name : ''"></span>
                    <span class="text-xs text-gray-400">·</span>
                    <span class="text-xs text-gray-400"
                          x-text="markCommentData ? formatTimeAgo(markCommentData.created_at) : ''"></span>
                    <template x-if="markCommentData && markCommentData.is_resolved">
                        <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-300">
                            <i data-lucide="check" class="w-2.5 h-2.5"></i> Erledigt
                        </span>
                    </template>
                </div>
                <p class="text-sm text-gray-700 dark:text-gray-300"
                   x-text="markCommentData ? markCommentData.content : ''"></p>
            </div>

            <!-- Replies -->
            <template x-if="markCommentData && markCommentData.replies && markCommentData.replies.length > 0">
                <div class="px-4 pb-3 space-y-2.5 border-t border-gray-100 dark:border-gray-700 pt-3">
                    <template x-for="reply in markCommentData.replies" :key="reply.id">
                        <div class="flex gap-2">
                            <div class="w-5 h-5 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center flex-shrink-0">
                                <span class="text-[10px] font-medium text-gray-600 dark:text-gray-400"
                                      x-text="reply.author_initials"></span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-1">
                                    <span class="text-xs font-medium text-gray-900 dark:text-white"
                                          x-text="reply.author_name"></span>
                                    <span class="text-xs text-gray-400"
                                          x-text="formatTimeAgo(reply.created_at)"></span>
                                </div>
                                <p class="text-xs text-gray-600 dark:text-gray-400 mt-0.5"
                                   x-text="reply.content"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Reply input -->
            <template x-if="markCommentData && !markCommentData.is_resolved">
                <div class="px-4 py-3 border-t border-gray-100 dark:border-gray-700">
                    <div class="flex gap-2">
                        <input type="text" x-model="markReplyText"
                               x-ref="markReplyInput"
                               placeholder="Antworten..."
                               @keydown.enter="submitMarkReply()"
                               class="flex-1 px-3 py-1.5 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent">
                        <button @click="submitMarkReply()"
                                :disabled="!markReplyText.trim() || markReplySubmitting"
                                class="px-3 py-1.5 text-xs font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed flex-shrink-0">
                            <i data-lucide="send" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>
            </template>

            <!-- Actions -->
            <template x-if="markCommentData && !markCommentData.is_resolved">
                <div class="px-4 py-2 border-t border-gray-100 dark:border-gray-700 flex items-center justify-between bg-gray-50/50 dark:bg-gray-800/50 rounded-b-xl">
                    <button @click="resolveMarkComment()"
                            class="text-xs font-medium text-green-600 dark:text-green-400 hover:text-green-700 flex items-center gap-1.5">
                        <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                        Erledigen
                    </button>
                    <button @click="hideMarkPopup()"
                            class="text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
                        Schliessen
                    </button>
                </div>
            </template>
            <template x-if="markCommentData && markCommentData.is_resolved">
                <div class="px-4 py-2 border-t border-gray-100 dark:border-gray-700 flex items-center justify-end bg-gray-50/50 dark:bg-gray-800/50 rounded-b-xl">
                    <button @click="hideMarkPopup()"
                            class="text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
                        Schliessen
                    </button>
                </div>
            </template>
        </div>
    </div>

    <!-- Share Modal -->
    {% if can_share %}
    {% include "work/motions/partials/_share_modal.html" %}
    {% endif %}

    <!-- Image Insert Modal -->
    {% if can_edit %}
    <div x-show="showImageModal" x-cloak class="image-modal-backdrop" @click.self="showImageModal = false; imageUrl = ''; imageAlt = ''">
        <div class="image-modal" @click.stop>
            <h3 class="text-base font-semibold text-gray-900 dark:text-white mb-4">Bild einfügen</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Bild-URL</label>
                    <input type="url" x-model="imageUrl" placeholder="https://..."
                           @keydown.enter="insertImage()"
                           class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                           x-ref="imageUrlInput">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Alternativtext (optional)</label>
                    <input type="text" x-model="imageAlt" placeholder="Beschreibung des Bildes"
                           @keydown.enter="insertImage()"
                           class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button type="button" @click="showImageModal = false; imageUrl = ''; imageAlt = ''"
                        class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600">
                    Abbrechen
                </button>
                <button type="button" @click="insertImage()" :disabled="!imageUrl.trim()"
                        class="px-4 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 disabled:opacity-50">
                    Einfügen
                </button>
            </div>
        </div>
    </div>
    {% endif %}

    <!-- AI Preview Panel -->
    {% if can_edit %}
    <div x-show="aiPreviewActive" x-cloak
         class="fixed inset-0 z-50 flex items-center justify-center bg-black/50"
         @click.self="closeAiPreview()">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden m-4 flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-700 bg-gradient-to-r from-purple-50 to-blue-50 dark:from-purple-900/20 dark:to-blue-900/20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 to-purple-700 flex items-center justify-center">
                        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-900 dark:text-white">KI-Vorschlag</h3>
                        <p class="text-sm text-gray-500">Prüfen Sie die vorgeschlagenen Änderungen</p>
                    </div>
                </div>
                <button type="button" @click="closeAiPreview()"
                        class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6">
                <div class="flex items-center gap-2 mb-4">
                    <button type="button" @click="previewMode = 'suggested'"
                            :class="previewMode === 'suggested' ? 'bg-purple-100 text-purple-700 dark:bg-purple-900 dark:text-purple-300' : 'bg-gray-100 dark:bg-gray-700'"
                            class="px-3 py-1.5 text-sm font-medium rounded-lg">Vorschlag</button>
                    <button type="button" @click="previewMode = 'original'"
                            :class="previewMode === 'original' ? 'bg-purple-100 text-purple-700 dark:bg-purple-900 dark:text-purple-300' : 'bg-gray-100 dark:bg-gray-700'"
                            class="px-3 py-1.5 text-sm font-medium rounded-lg">Original</button>
                    <button type="button" @click="previewMode = 'diff'"
                            :class="previewMode === 'diff' ? 'bg-purple-100 text-purple-700 dark:bg-purple-900 dark:text-purple-300' : 'bg-gray-100 dark:bg-gray-700'"
                            class="px-3 py-1.5 text-sm font-medium rounded-lg">Vergleich</button>
                </div>
                <div class="prose dark:prose-invert max-w-none p-4 bg-gray-50 dark:bg-gray-900 rounded-lg border border-gray-200 dark:border-gray-700 min-h-[200px]">
                    <template x-if="previewMode === 'suggested'">
                        <div x-html="aiPreviewContent" class="whitespace-pre-wrap"></div>
                    </template>
                    <template x-if="previewMode === 'original'">
                        <div x-html="aiOriginalContent" class="whitespace-pre-wrap"></div>
                    </template>
                    <template x-if="previewMode === 'diff'">
                        <div>
                            <div class="mb-4 p-3 bg-red-50 dark:bg-red-900/20 rounded border-l-4 border-red-400">
                                <span class="text-xs font-medium text-red-600 dark:text-red-400 uppercase">Entfernt</span>
                                <div x-html="aiOriginalContent" class="mt-1 text-sm line-through opacity-70"></div>
                            </div>
                            <div class="p-3 bg-green-50 dark:bg-green-900/20 rounded border-l-4 border-green-400">
                                <span class="text-xs font-medium text-green-600 dark:text-green-400 uppercase">Hinzugefügt</span>
                                <div x-html="aiPreviewContent" class="mt-1 text-sm"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
            <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900">
                <button type="button" @click="closeAiPreview()"
                        class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700">
                    Abbrechen
                </button>
                <button type="button" @click="applyAiPreview()"
                        class="px-4 py-2 text-sm font-medium text-white bg-gradient-to-r from-purple-600 to-purple-700 rounded-lg hover:from-purple-700 hover:to-purple-800 flex items-center gap-2">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    Übernehmen
                </button>
            </div>
        </div>
    </div>
    {% endif %}
