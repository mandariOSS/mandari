<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        @page {
            size: A4;
            margin: 25mm 25mm 25mm 25mm;
        }

        body {
            font-family: "Helvetica", "Arial", sans-serif;
            font-size: 11pt;
            line-height: 1.6;
            color: #1f2937;
            margin: 0;
            padding: 0;
        }

        /* Match editor typography exactly */
        .document-content h1 {
            font-size: 18pt;
            font-weight: 700;
            margin: 16px 0 8px;
        }

        .document-content h2 {
            font-size: 15pt;
            font-weight: 600;
            margin: 14px 0 6px;
        }

        .document-content h3 {
            font-size: 13pt;
            font-weight: 600;
            margin: 12px 0 6px;
        }

        .document-content p {
            margin: 8px 0;
        }

        .document-content ul {
            margin: 8px 0;
            padding-left: 25px;
            list-style-type: disc;
        }

        .document-content ol {
            margin: 8px 0;
            padding-left: 25px;
            list-style-type: decimal;
        }

        .document-content ul ul { list-style-type: circle; }
        .document-content ul ul ul { list-style-type: square; }
        .document-content ol ol { list-style-type: lower-alpha; }
        .document-content ol ol ol { list-style-type: lower-roman; }

        .document-content li {
            margin: 4px 0;
        }

        .document-content blockquote {
            margin: 12px 0;
            padding: 8px 16px;
            border-left: 3px solid #6366f1;
            color: #4b5563;
        }

        .document-content hr {
            border: none;
            border-top: 2px solid #e5e7eb;
            margin: 16px 0;
        }

        .document-content a {
            color: #4f46e5;
            text-decoration: underline;
        }

        .document-content mark {
            background-color: #fef08a;
            padding: 0 2px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="document-content">
        {{ content|safe }}
    </div>
</body>
</html>
