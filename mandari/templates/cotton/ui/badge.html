{# djlint:off H026 – leere Vorgabewerte in <c-vars> sind Komponentenparameter #}
{% comment %}
Status-Badge.  <c-ui.badge color="gray|primary|green|amber|red|blue" icon="">Text</c-ui.badge>
{% endcomment %}
<c-vars color="gray" icon="" class="" />
<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium
    {% if color == 'primary' %}bg-primary-100 dark:bg-primary-900/50 text-primary-700 dark:text-primary-300{% elif color == 'green' %}bg-green-100 dark:bg-green-900/50 text-green-700 dark:text-green-300{% elif color == 'amber' %}bg-amber-100 dark:bg-amber-900/50 text-amber-800 dark:text-amber-300{% elif color == 'red' %}bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-300{% elif color == 'blue' %}bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300{% else %}bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300{% endif %} {{ class }}" {{ attrs }}>
    {% if icon %}<i data-lucide="{{ icon }}" class="w-3 h-3" aria-hidden="true"></i>{% endif %}{{ slot }}
</span>
