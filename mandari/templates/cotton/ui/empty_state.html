{# djlint:off H026 – leere Vorgabewerte in <c-vars> sind Komponentenparameter #}
{% comment %}
Leerzustand.  <c-ui.empty-state icon="inbox" title="Noch keine Einträge">Beschreibung, optional Button im Slot</c-ui.empty-state>
{% endcomment %}
<c-vars icon="inbox" title="" class="" />
<div class="text-center py-12 px-6 {{ class }}" {{ attrs }}>
    <div class="mx-auto w-14 h-14 rounded-2xl bg-gray-100 dark:bg-gray-700 flex items-center justify-center mb-4">
        <i data-lucide="{{ icon }}" class="w-7 h-7 text-gray-400 dark:text-gray-500" aria-hidden="true"></i>
    </div>
    {% if title %}<h3 class="text-base font-semibold text-gray-900 dark:text-white mb-1">{{ title }}</h3>{% endif %}
    <div class="text-sm text-gray-500 dark:text-gray-400 max-w-md mx-auto">{{ slot }}</div>
</div>
