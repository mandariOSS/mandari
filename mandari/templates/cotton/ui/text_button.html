{# djlint:off H026 – leere Vorgabewerte in <c-vars> sind Komponentenparameter #}
{% comment %}
Textbutton ohne Rahmen für kleine Inline-Aktionen in Panels und Listen.
  <c-ui.text-button variant="primary|danger|muted" icon="plus" type="button|submit" @click="…">Eintrag</c-ui.text-button>
Alle weiteren Attribute (@click, title, hx-*) werden durchgereicht.
{% endcomment %}
<c-vars variant="primary" icon="" type="button" class="" />
<button type="{{ type }}"
    class="text-xs font-medium flex items-center gap-1 {% if variant == 'danger' %}text-red-500 hover:text-red-700{% elif variant == 'muted' %}text-gray-500 hover:text-primary-600{% else %}text-primary-600 hover:text-primary-700{% endif %} {{ class }}"
    {{ attrs }}>
    {% if icon %}<i data-lucide="{{ icon }}" class="w-3 h-3" aria-hidden="true"></i>{% endif %}
    {{ slot }}
</button>
