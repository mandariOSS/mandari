{# djlint:off H026 – leere Vorgabewerte in <c-vars> sind Komponentenparameter #}
{% comment %}
Checkbox mit Beschriftung.  <c-form.checkbox name="remember_me" label="Angemeldet bleiben" checked />
{% endcomment %}
<c-vars field="" name="" label="" checked="" class="" />
{% with fname=field.name|default:name %}{% with auto_id="id_"|add:fname %}{% firstof field.id_for_label auto_id as fid %}
<label for="{{ fid }}" class="inline-flex items-center gap-2 cursor-pointer min-h-[24px] {{ class }}" {{ attrs }}>
    <input type="checkbox" name="{{ fname }}" id="{{ fid }}" {% if checked or field.value %}checked{% endif %}
        class="w-4 h-4 rounded border-gray-300 dark:border-gray-600 text-primary-600 focus:ring-primary-500 dark:bg-gray-700">
    <span class="text-sm text-gray-600 dark:text-gray-400">{{ label }}{{ slot }}</span>
</label>
{% endwith %}{% endwith %}
