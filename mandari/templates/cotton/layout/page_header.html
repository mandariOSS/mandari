{# djlint:off H026 – leere Vorgabewerte in <c-vars> sind Komponentenparameter #}
{% comment %}
Seitenkopf mit Titel, Untertitel und Aktionen.
  <c-layout.page-header title="Anträge" subtitle="12 offen"><c-ui.button icon="plus">Neu</c-ui.button></c-layout.page-header>
{% endcomment %}
<c-vars title="" subtitle="" class="" />
<div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-6 {{ class }}" {{ attrs }}>
    <div class="min-w-0">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight">{{ title }}</h1>
        {% if subtitle %}<p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ subtitle }}</p>{% endif %}
    </div>
    {% if slot %}<div class="flex items-center gap-2 flex-none">{{ slot }}</div>{% endif %}
</div>
