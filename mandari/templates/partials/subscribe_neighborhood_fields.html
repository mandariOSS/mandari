{% comment %}Nachbarschaftsfelder für subscribe.html und subscription_manage.html; endet ohne Zeilenumbruch, damit die Ausgabe byte-gleich bleibt.{% endcomment %}<div class="space-y-3">
                        <div class="relative">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                            <input type="text" name="neighborhood_name"
                                   x-model="neighborhoodName"
                                   @input.debounce.300ms="fetchSuggestions()"
                                   @keydown.escape="suggestions = []"
                                   placeholder="z.B. Wolbecker Stra&szlig;e..."
                                   class="w-full pl-9 pr-4 py-2.5 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl text-sm text-gray-900 dark:text-white placeholder-gray-500 focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 outline-none transition-all">
                            <input type="hidden" name="neighborhood_lat" :value="neighborhoodLat">
                            <input type="hidden" name="neighborhood_lon" :value="neighborhoodLon">

                            <!-- Autocomplete Dropdown -->
                            <div x-show="suggestions.length > 0" x-cloak
                                 @click.away="suggestions = []"
                                 class="absolute z-50 mt-1 w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg overflow-hidden">
                                <template x-for="(s, i) in suggestions" :key="i">
                                    <button type="button" @click="selectSuggestion(s)"
                                            class="w-full px-3 py-2.5 text-left text-sm hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-900 dark:text-white flex items-center gap-2 border-b border-gray-100 dark:border-gray-700 last:border-0 transition-colors">
                                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-gray-400 shrink-0"></i>
                                        <span x-text="s.name" class="truncate"></span>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <!-- Radius (shown when location selected) -->
                        <div x-show="neighborhoodLat" x-cloak>
                            <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">Umkreis</label>
                            <div class="flex gap-1.5">
                                <template x-for="r in [250, 500, 1000, 2000]" :key="r">
                                    <button type="button" @click="neighborhoodRadius = r"
                                            :class="neighborhoodRadius === r
                                                ? 'bg-primary-100 dark:bg-primary-900/30 text-primary-700 dark:text-primary-300 border-primary-300 dark:border-primary-700'
                                                : 'bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-400 border-gray-200 dark:border-gray-600 hover:border-gray-300'"
                                            class="flex-1 px-2 py-1.5 text-xs font-medium border rounded-lg transition-colors">
                                        <span x-text="r >= 1000 ? (r/1000) + ' km' : r + ' m'"></span>
                                    </button>
                                </template>
                            </div>
                            <input type="hidden" name="neighborhood_radius" :value="neighborhoodRadius">
                        </div>

                        <!-- Selected location badge -->
                        <div x-show="neighborhoodLat" x-cloak class="flex items-center gap-2">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-300 text-xs font-medium rounded-full border border-green-200 dark:border-green-800">
                                <i data-lucide="check" class="w-3 h-3"></i>
                                Standort gew&auml;hlt
                            </span>
                            <button type="button" @click="clearNeighborhood()" class="text-xs text-gray-400 hover:text-red-500 transition-colors">
                                Zur&uuml;cksetzen
                            </button>
                        </div>
                    </div>
