{# Betriebshinweis aus der Umgebung (SEITENHINWEIS, apps/common/seitenhinweis.py); rahmen: Abstände des jeweiligen Layouts #}
{% if seitenhinweis %}
<div class="{{ rahmen }} print:hidden">
    <div class="flex items-start gap-3 px-4 py-3 rounded-lg bg-amber-50 dark:bg-amber-900/20 text-sm text-amber-900 dark:text-amber-200" role="status" data-testid="seitenhinweis">
        <i data-lucide="alert-triangle" class="w-5 h-5 flex-shrink-0 mt-0.5 text-amber-700 dark:text-amber-400" aria-hidden="true"></i>
        <p>{{ seitenhinweis }}{% if seitenhinweis_link %} <a href="{{ seitenhinweis_link }}" class="font-semibold underline underline-offset-2">Zur Statusseite</a>{% endif %}</p>
    </div>
</div>
{% endif %}
