{% comment %}Toast-Container für work/base_work.html und session/base_session.html; endet ohne Zeilenumbruch, damit die Ausgabe byte-gleich bleibt.{% endcomment %}<div x-data="toastManager" @show-toast.window="addToast($event.detail.message, $event.detail.type)" role="status" aria-live="polite" class="fixed top-4 right-4 z-[100] space-y-3 pointer-events-none">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="toast.visible"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 translate-x-8"
                 x-transition:enter-end="opacity-100 translate-x-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 translate-x-0"
                 x-transition:leave-end="opacity-0 translate-x-8"
                 class="pointer-events-auto max-w-sm w-full bg-white dark:bg-gray-800 rounded-xl shadow-lg border overflow-hidden"
                 :class="{
                     'border-green-200 dark:border-green-800': toast.type === 'success',
                     'border-red-200 dark:border-red-800': toast.type === 'error',
                     'border-yellow-200 dark:border-yellow-800': toast.type === 'warning',
                     'border-blue-200 dark:border-blue-800': toast.type === 'info'
                 }">
                <div class="p-4 flex items-start gap-3">
                    <div class="flex-shrink-0">
                        <template x-if="toast.type === 'success'">
                            <div class="w-8 h-8 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center">
                                <i data-lucide="check" class="w-4 h-4 text-green-600 dark:text-green-400"></i>
                            </div>
                        </template>
                        <template x-if="toast.type === 'error'">
                            <div class="w-8 h-8 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center">
                                <i data-lucide="x" class="w-4 h-4 text-red-600 dark:text-red-400"></i>
                            </div>
                        </template>
                        <template x-if="toast.type === 'warning'">
                            <div class="w-8 h-8 rounded-full bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center">
                                <i data-lucide="alert-triangle" class="w-4 h-4 text-yellow-600 dark:text-yellow-400"></i>
                            </div>
                        </template>
                        <template x-if="toast.type === 'info'">
                            <div class="w-8 h-8 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center">
                                <i data-lucide="info" class="w-4 h-4 text-blue-600 dark:text-blue-400"></i>
                            </div>
                        </template>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-900 dark:text-white" x-text="toast.message"></p>
                    </div>
                    <button type="button" @click="removeToast(toast.id)" aria-label="Meldung schließen"
                            class="flex-shrink-0 p-1 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </template>
    </div>

    <script type="application/json" id="django-messages">[{% for message in messages %}{"message": "{{ message|escapejs }}", "tags": "{{ message.tags|default:'info'|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}]</script>
