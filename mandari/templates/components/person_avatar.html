{# Usage: {% include "components/person_avatar.html" with person=person size="sm" %} #}
{# Nur Initialen: Fotos von Personen zeigt mandari nicht (Datensparsamkeit, Issue #1560) #}
<div class="shrink-0 {% if size == 'lg' %}w-20 h-20{% elif size == 'md' %}w-12 h-12{% elif size == 'xs' %}w-5 h-5{% else %}w-8 h-8{% endif %} rounded-full overflow-hidden bg-gray-100 dark:bg-gray-700">
    <div class="w-full h-full flex items-center justify-center {% if size == 'lg' %}text-xl{% elif size == 'md' %}text-sm{% elif size == 'xs' %}text-[9px]{% else %}text-xs{% endif %} font-semibold text-gray-600 dark:text-gray-300" aria-hidden="true">
        {{ person.initials }}
    </div>
</div>
