# =============================================================================
# Mandari - Release Workflow
# =============================================================================
# Builds and publishes Docker images to GitHub Container Registry (ghcr.io)
#
# Gebaut werden mandari und ingestor. Die Website (ghcr.io/mandarioss/website)
# entsteht im Repository mandariOSS/marketing-website (Tag :main bei jedem Push
# auf dessen main). docker-compose.yml und das Helm-Chart ziehen alle drei Images
# mit EINEM Tag (IMAGE_TAG bzw. image.tag); deshalb bekommt die Website hier
# dieselben Tags wie mandari und ingestor, als Kopie des aktuellen Stands
# website:main ohne Neubau (Issue #698).
#
# Zweig/Ereignis → Tags (für alle drei Images):
#   dev     → :dev, :dev-<sha>
#   main    → :latest, :main-<sha>, :<sha>
#   release → :<version>, :latest
#   manual  → :<input>
# Einen Kanal "beta" gibt es nicht.
#
# Commit-Tags (dev-<sha>, main-<sha>, <sha>) nennen hier einen mandari-Commit. Im Paket website
# schreibt mandariOSS/marketing-website eigene Commit-Tags mit Website-Commits (main-<sha>,
# dev-<sha>); welcher Website-Stand in einem Image steckt, zeigt dort das Label
# org.opencontainers.image.revision. Beweglich sind nur latest und dev: Jedes andere Website-Tag,
# das es schon mit anderem Inhalt gibt (gleiche Kurzkennung in beiden Repositorys, von Hand
# nachgetragenes Release-Tag, erneuter Lauf), bleibt unverändert; der Lauf meldet eine Warnung.
# =============================================================================

name: Release

on:
  push:
    branches:
      - main
      - dev
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build (e.g., v1.0.0, latest)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: mandarioss

jobs:
  # Stueckliste (SBOM, CycloneDX) je Release: drei Dateien als Release-Anhang, damit
  # Kunden ihre eigene Schwachstellenueberwachung auf mandari anwenden koennen (Issue #97).
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Werkzeuge
        run: |
          pip install cyclonedx-bom==7.1.0
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: SBOM erzeugen
        run: sh scripts/build_sbom.sh sbom
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.event.release.tag_name || github.event.inputs.tag }}
          path: sbom/*.cdx.json
      - name: An das Release anhaengen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom/*.cdx.json --clobber

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release-Tag passt zu den Versionsangaben
        if: github.event_name == 'release'
        run: python scripts/check_version_consistency.py --tag "${{ github.event.release.tag_name }}"

      - name: Determine image tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH="${GITHUB_REF_NAME}"

          if [ "${{ github.event_name }}" == "release" ]; then
            # Release: version tag + latest
            VERSION="${{ github.event.release.tag_name }}"
            MANDARI_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mandari:${VERSION},${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mandari:latest"
            INGESTOR_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ingestor:${VERSION},${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ingestor:latest"

          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual: custom tag
            TAG="${{ github.event.inputs.tag }}"
            MANDARI_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mandari:${TAG}"
            INGESTOR_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ingestor:${TAG}"

          elif [ "$BRANCH" == "main" ]; then
            # main: latest + main-sha (wie dev-sha) + sha (bisheriges Format, bleibt für bestehende Installationen)
            MANDARI_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mandari:latest,${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mandari:main-${SHORT_SHA},${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mandari:${SHORT_SHA}"
            INGESTOR_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ingestor:latest,${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ingestor:main-${SHORT_SHA},${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ingestor:${SHORT_SHA}"

          elif [ "$BRANCH" == "dev" ]; then
            # dev: dev + dev-sha
            MANDARI_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mandari:dev,${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mandari:dev-${SHORT_SHA}"
            INGESTOR_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ingestor:dev,${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ingestor:dev-${SHORT_SHA}"

          else
            # Fallback
            MANDARI_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mandari:${SHORT_SHA}"
            INGESTOR_TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ingestor:${SHORT_SHA}"
          fi

          # Die Website bekommt dieselben Tags wie mandari (Schritt "Website-Image mit denselben Tags")
          WEBSITE_TAGS=$(echo "$MANDARI_TAGS" | sed "s#/${{ env.IMAGE_OWNER }}/mandari:#/${{ env.IMAGE_OWNER }}/website:#g")
          # Nur die Tags (ohne Registry/Image) für die Prüfung am Ende
          RUN_TAGS=$(echo "$MANDARI_TAGS" | sed 's#[^,]*:##g')

          echo "mandari_tags=$MANDARI_TAGS" >> $GITHUB_OUTPUT
          echo "ingestor_tags=$INGESTOR_TAGS" >> $GITHUB_OUTPUT
          echo "website_tags=$WEBSITE_TAGS" >> $GITHUB_OUTPUT
          echo "run_tags=$RUN_TAGS" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # Scan-Tag: erstes Tag aus der komma-separierten Liste (für Trivy)
          SCAN_TAG=$(echo "$MANDARI_TAGS" | cut -d',' -f1 | rev | cut -d':' -f1 | rev)
          echo "scan_tag=$SCAN_TAG" >> $GITHUB_OUTPUT

          echo "Branch: $BRANCH"
          echo "Scan tag: $SCAN_TAG"
          echo "Mandari tags: $MANDARI_TAGS"
          echo "Ingestor tags: $INGESTOR_TAGS"
          echo "Website tags: $WEBSITE_TAGS"

      # =====================================================================
      # Build, scan, and push all images
      # =====================================================================

      - name: Build and push mandari image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./mandari/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.mandari_tags }}
          cache-from: type=gha,scope=mandari
          cache-to: type=gha,scope=mandari,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/mandariOSS/mandari
            org.opencontainers.image.description=Mandari - Open-Source Platform for Municipal Political Transparency
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan mandari image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mandari:${{ steps.tags.outputs.scan_tag }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

      - name: Build and push ingestor image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./ingestor/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.ingestor_tags }}
          cache-from: type=gha,scope=ingestor
          cache-to: type=gha,scope=ingestor,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/mandariOSS/mandari
            org.opencontainers.image.description=Mandari OParl Ingestor - Data Synchronization Service
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan ingestor image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ingestor:${{ steps.tags.outputs.scan_tag }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

      # Die Website baut mandariOSS/marketing-website (Tag :main). Hier bekommt sie dieselben Tags wie
      # mandari und ingestor, damit ein IMAGE_TAG für alle drei Images reicht: Release-Versionen, latest,
      # dev und die Commit-Tags. Kopie des Manifests, kein Neubau. Das Paket website ist mit diesem
      # Repository verknüpft; GITHUB_TOKEN darf deshalb dort schreiben (Issue #698).
      # Nur latest und dev werden überschrieben, alle anderen Tags nur angelegt (siehe Kopf der Datei).
      # Scheitert dieser Schritt, laufen SBOM, Sichtbarkeit und die Prüfung am Ende trotzdem.
      - name: Website-Image mit denselben Tags versehen
        id: website
        env:
          WEBSITE_SOURCE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/website:main
          WEBSITE_TAGS: ${{ steps.tags.outputs.website_tags }}
        run: |
          set -eu
          echo "Quelle: $WEBSITE_SOURCE"
          quelle=$(docker buildx imagetools inspect --raw "$WEBSITE_SOURCE")
          args=""
          for ziel in $(echo "$WEBSITE_TAGS" | tr ',' ' '); do
            case "${ziel##*:}" in
              latest|dev) ;;
              *)
                # Unveränderliches Tag: vorhanden und anderer Inhalt → stehen lassen
                vorhanden=$(docker buildx imagetools inspect --raw "$ziel" 2>/dev/null || true)
                if [ -n "$vorhanden" ] && [ "$vorhanden" != "$quelle" ]; then
                  echo "::warning title=Website-Tag nicht überschrieben::$ziel gibt es schon mit anderem Inhalt (Commit-Tag aus mandariOSS/marketing-website oder früherer Lauf); es bleibt unverändert."
                  continue
                fi
                ;;
            esac
            args="$args --tag $ziel"
          done
          if [ -z "$args" ]; then
            echo "Keine Website-Tags zu setzen."
            exit 0
          fi
          # shellcheck disable=SC2086  # Tag-Liste bewusst aufgeteilt
          docker buildx imagetools create $args "$WEBSITE_SOURCE"

      # =====================================================================
      # Make packages public (required for unauthenticated pulls)
      # =====================================================================
      - name: SBOM (CycloneDX) für Quellcode und Abhängigkeiten erzeugen
        if: ${{ !cancelled() && steps.tags.outcome == 'success' }}
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: mandari-sbom-cyclonedx.json
          upload-artifact: true
          # Ans Release hängt der Job „SBOM (CycloneDX)“ die SBOMs; dieser Job darf nur lesen
          # (contents: read) und scheiterte beim Release-Ereignis am Hochladen (v0.11.0).
          upload-release-assets: false

      - name: Make container packages public
        if: ${{ !cancelled() && steps.tags.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in mandari ingestor; do
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              /orgs/${{ env.IMAGE_OWNER }}/packages/container/${pkg}/visibility \
              -f visibility=public \
              2>/dev/null && echo "✓ ${pkg} → public" || echo "⚠ ${pkg}: visibility unchanged (may need org admin token)"
          done

      # Installer, update.sh, Helm-Chart und Dokumentation bieten diese Tags an: Jedes muss für alle drei
      # Images ohne Anmeldung abrufbar sein, sonst scheitert "./install.sh --tag …" (Issue #698).
      # Läuft auch, wenn ein Schritt davor gescheitert ist: Dann zeigt die Liste, welche Tags fehlen.
      - name: Alle Images für jedes Tag dieses Laufs anonym abrufbar
        if: ${{ !cancelled() && steps.tags.outcome == 'success' }}
        env:
          RUN_TAGS: ${{ steps.tags.outputs.run_tags }}
        run: python3 scripts/check_image_tags.py "$RUN_TAGS"
