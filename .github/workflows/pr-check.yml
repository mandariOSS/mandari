  # ===========================================================================
  # OParl-Konformität: externer Validator gegen eine Testinstanz mit Demo-Daten
  # ===========================================================================
  # Prüft beide OParl-Ausgaben (Aggregator und Session-Schnittstelle) mit oparl-validator-rs
  # (https://github.com/konstin/oparl-validator-rs, MIT oder Apache-2.0) und der eigenen Typprüfung
  # (scripts/oparl_validator.py). Läuft bei Änderungen an den Schnittstellen und bei jedem push auf
  # dev/main. Der Validator wird nur ausgeführt: festgelegter Stand der vom Projekt gebauten
  # Programmdatei (Commit im Zweig gh-pages, gebaut aus 9ae12e7), geprüft per SHA-256. Das Archiv
  # liegt im Zwischenspeicher der Actions (Schlüssel: Prüfsumme) und wird nur geladen, wenn es dort
  # fehlt – der Job hängt so nicht bei jedem Lauf an der fremden Adresse. Die Prüfsumme gilt auch für
  # das Archiv aus dem Zwischenspeicher. Der Job hat nur Leserechte und keine Geheimnisse.
  oparl-validator:
    name: OParl-Validator (Aggregator und Session-Schnittstelle)
    needs: changes
    if: needs.changes.outputs.oparl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATOR_URL: https://raw.githubusercontent.com/konstin/oparl-validator-rs/2fe6d4a9a60e61a843232c778ab16b3d9ba18803/main/oparl-validator-rs-x86_64-unknown-linux-musl.tar.gz
      VALIDATOR_SHA256: 10e0348709fee5e6ff61835318e5c042350860294b1945082975f5d16f669d3d

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libffi-dev shared-mime-info pkg-config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install shared/
          pip install -r mandari/requirements.lock

      - name: Validator aus dem Zwischenspeicher
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/oparl-validator-archiv
          key: oparl-validator-${{ env.VALIDATOR_SHA256 }}

      - name: Validator bei Bedarf laden, Prüfsumme vergleichen
        run: |
          set -euo pipefail
          archiv="$RUNNER_TEMP/oparl-validator-archiv/oparl-validator.tar.gz"
          stimmt() { echo "$VALIDATOR_SHA256  $archiv" | sha256sum --check --strict --status; }
          if [ ! -f "$archiv" ] || ! stimmt; then
            mkdir -p "$(dirname "$archiv")"
            curl -fsSL --retry 3 -o "$archiv" "$VALIDATOR_URL"
          fi
          echo "$VALIDATOR_SHA256  $archiv" | sha256sum --check --strict
          tar -xzf "$archiv" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/oparl-validator-rs"

      - name: Beide OParl-Ausgaben prüfen (Testinstanz mit Demo-Daten)
        run: python scripts/oparl_validator.py --validator "$RUNNER_TEMP/oparl-validator-rs"

  # ===========================================================================
  # Abhängigkeiten: bekannte Schwachstellen, Lockfile-Abgleich
  # ===========================================================================
  # Läuft bei geänderten Abhängigkeitsdateien (Sicherheitsnetz), bei jedem push auf dev/main
  # und im Wochenlauf – dort fallen neu veröffentlichte Schwachstellen ohne Codeänderung auf.
  dependency-audit:
    name: Abhängigkeiten prüfen (pip-audit, npm audit)
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: mandari/package-lock.json
      - name: pip-audit Django-Anwendung (blockierend bei bekannten Schwachstellen)
        run: |
          pip install pip-audit packaging
          pip-audit -r mandari/requirements.lock --no-deps --progress-spinner off
      # Installiert wird ueberall requirements.lock. Eine angehobene Grenze in
      # requirements.txt ohne neu erzeugtes Lockfile aendert nichts am Laufenden
      # und laesst beide Dateien auseinanderlaufen (Issue #241).
      - name: requirements.lock passt zu requirements.txt
        run: python scripts/check_requirements_lock.py
      - name: pip-audit Ingestor (blockierend bei bekannten Schwachstellen)
        run: |
          cd ingestor
          uv export --frozen --no-emit-project --no-emit-package mandari-oparl --no-hashes --all-extras -o /tmp/ingestor-requirements.txt
          pip-audit -r /tmp/ingestor-requirements.txt --no-deps --progress-spinner off
      - name: npm audit (blockierend ab "high")
        run: |
          cd mandari
          npm audit || true
          npm audit --audit-level=high

  ingestor-tests:
    name: Ingestor Tests
    needs: changes
    if: needs.changes.outputs.ingestor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Abhängigkeiten
        run: cd ingestor && uv sync --frozen --extra dev
      - name: pytest
        run: cd ingestor && uv run pytest -q
      - name: mypy (Ingestor ist bereits strikt typisiert)
        # Informativ, bis die Allowlist steht (Issue zu mypy im Epic Code-Qualität)
        run: cd ingestor && uv run mypy src --ignore-missing-imports || true

  e2e:
    name: E2E (Playwright, axe-core, Screenshots)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: mandari/package-lock.json
      - name: Frontend-Assets bauen
        run: cd mandari && npm ci --ignore-scripts && npm run build
      - name: Python-Abhängigkeiten
        run: |
          pip install shared/
          cd mandari
          pip install -r requirements.lock
          pip install pytest pytest-django factory-boy pytest-playwright
          python -m playwright install --with-deps chromium
      - name: E2E-Tests (Kernpfade, axe-core)
        env:
          MANDARI_E2E: '1'
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
          DEBUG: 'false'
        run: cd mandari && pytest tests_e2e -q --browser chromium
      - name: Screenshots als Artefakt (hell/dunkel, Komponentenvorschau, Kernpfade)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: mandari/tests_e2e/screenshots/
          if-no-files-found: ignore

  # ===========================================================================
  # Docker Build Validation
  # ===========================================================================
  docker-build:
    name: Docker Build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build mandari image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./mandari/Dockerfile
          push: false
          cache-from: type=gha,scope=mandari
          cache-to: type=gha,scope=mandari,mode=max

      - name: Build ingestor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ingestor/Dockerfile
          push: false
          cache-from: type=gha,scope=ingestor
          cache-to: type=gha,scope=ingestor,mode=max

  # ===========================================================================
  # CodeQL (erweitertes Setup, nur für die betroffenen Sprachen)
  # ===========================================================================
  # Ersetzt das Default-Setup von GitHub, das jede Sprache in jedem Pull Request analysiert.
  # Solange das Default-Setup aktiv ist, lehnt GitHub Uploads dieses Jobs ab; deshalb bleibt er
  # aus, bis die Repository-Variable CODEQL_ERWEITERT auf "true" steht. Umstellung: erst das
  # Default-Setup abschalten, dann die Variable setzen. Kategorien wie beim Default-Setup
  # (/language:<sprache>), damit bestehende Meldungen weitergeführt werden.
  codeql:
    # GitHub hängt die Sprache aus der Matrix selbst an ("CodeQL-Analyse (python)"); ein Ausdruck im
    # Namen bliebe beim übersprungenen Job unaufgelöst stehen. Nicht "CodeQL" allein: So heißt schon
    # der Ergebnis-Check von Code Scanning.
    name: CodeQL-Analyse
    needs: changes
    if: needs.changes.outputs.codeql != '[]' && needs.changes.outputs.codeql != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.codeql) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: CodeQL-Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # ===========================================================================
  # Sammel-Ergebnis: läuft immer, geeignet als einziger Pflicht-Check
  # ===========================================================================
  # Übersprungene Jobs (Bereich nicht betroffen) gelten als bestanden; ein fehlgeschlagener oder
  # abgebrochener Job lässt das Ergebnis scheitern. Neue Jobs hier unter needs eintragen.
  ci-ergebnis:
    name: CI-Ergebnis
    if: always()
    needs:
      - changes
      - qualitaet
      - verweise
      - test
      - events-pgbouncer
      - smoke
      - oparl-validator
      - e2e
      - ingestor-tests
      - dependency-audit
      - docker-build
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alle benötigten Jobs bestanden oder bewusst übersprungen
        env:
          ERGEBNISSE: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "### CI-Ergebnis"
            echo "| Job | Ergebnis |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$ERGEBNISSE"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$ERGEBNISSE"
          if [ "$(jq -r '.changes.result' <<<"$ERGEBNISSE")" != "success" ]; then
            echo "::error::Die Zuordnung der geänderten Dateien ist fehlgeschlagen."
            exit 1
          fi
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$ERGEBNISSE" >/dev/null; then
            echo "::error::Mindestens ein Job ist fehlgeschlagen oder wurde abgebrochen."
            exit 1
          fi
          echo "Alle benötigten Jobs bestanden oder waren für diese Änderung nicht nötig."
