# =============================================================================
# Mandari - CI Checks
# =============================================================================
# Lint, Typprüfung, Frontend-Gates, Link-Prüfung, Tests, Smoke, OParl-Validator, E2E, Docker-Build, CodeQL.
#
# Pfadfilter (Issue #621): Der Job "Geänderte Bereiche" ordnet die Dateien eines
# Pull Requests Bereichen zu; jeder Job läuft nur, wenn sein Bereich betroffen
# ist. Sicherheitsnetz: push auf main, die Merge-Queue, der Wochenlauf, manuelle
# Starts, Pull Requests gegen main und jede Änderung an .github/ oder an
# Abhängigkeitsdateien lassen ALLE Jobs laufen. Einzige Ausnahme in der Merge-Queue:
# Die Migrationstests laufen dort nach derselben Regel wie im Pull Request.
#
# Merge-Queue (Issue #737): Pull Requests auf dev werden über die Queue gemergt
# (gh pr merge <n> --squash --auto). Die Queue prüft den kombinierten Stand aus dev
# und allen PRs davor (Ereignis merge_group) mit allen Jobs und merged erst, wenn
# "CI-Ergebnis" grün ist. Der Pflicht-Check muss deshalb auch für merge_group
# berichten; jeder weitere Pflicht-Check braucht diesen Auslöser ebenfalls.
#
# Kein Lauf bei push auf dev (Issue #935): Auf dev landet genau das Commit, das die
# Queue geprüft hat (gleiche Commit-Kennung); ein zweiter Lauf prüfte denselben Stand
# noch einmal. Den nächtlichen Volllauf auf dev startet .github/workflows/nachtlauf.yml
# (workflow_dispatch), die Staging-Aktualisierung zählt den Lauf der Queue.
#
# Job "Test" (Issue #935): drei parallele Teile nach gemessenen Laufzeiten, jede
# Testdatenbank als Kopie einer einmal migrierten Vorlage, Migrationstests in einem
# eigenen Job; "Test-Ergebnis" führt die Coverage zusammen, prüft die Grenze und dass
# jeder Test genau einmal lief.
#
# Kein workflow-weiter paths-Filter für Pull Requests: "CI-Ergebnis" muss in
# jedem Pull Request berichten, damit es später Pflicht-Check werden kann.
# =============================================================================

name: CI

on:
  push:
    # Nur main: dev bekommt jedes Commit über die Merge-Queue, die genau dieses Commit prüft (Issue #935)
    branches:
      - main
    # Reine Text-Doku braucht auf main keinen Lauf (push hat keine Pflicht-Checks)
    paths-ignore:
      - '**/*.md'
      - 'docs/examples/**'
      - 'docs/prozesse/**'
      - 'LICENSES/**'
  pull_request:
    branches:
      - dev
      - main
  # Merge-Queue: kombinierter Stand vor dem Merge, immer mit allen Jobs (kein Pfadfilter)
  merge_group:
    types: [checks_requested]
  # Wöchentlicher Volllauf auf dem Standardzweig: CodeQL auch ohne Änderung (neue Abfragen)
  # und pip-audit/npm audit gegen neu veröffentlichte Schwachstellen
  schedule:
    - cron: '23 4 * * 1'
  # Von Hand und nächtlich auf dev (nachtlauf.yml): alle Jobs samt Migrationstests
  workflow_dispatch:

permissions:
  contents: read

# Neuer Push in einen PR bricht dessen laufende Prüfung ab; alle anderen Läufe laufen vollständig durch
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # Pfadfilter: welche Bereiche berührt die Änderung?
  # ===========================================================================
  changes:
    name: Geänderte Bereiche
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # Dateiliste des Pull Requests über die API
    outputs:
      qualitaet: ${{ steps.ergebnis.outputs.qualitaet }}
      verweise: ${{ steps.ergebnis.outputs.verweise }}
      python: ${{ steps.ergebnis.outputs.python }}
      vertrag: ${{ steps.ergebnis.outputs.vertrag }}
      templates: ${{ steps.ergebnis.outputs.templates }}
      frontend: ${{ steps.ergebnis.outputs.frontend }}
      test: ${{ steps.ergebnis.outputs.test }}
      migrationen: ${{ steps.ergebnis.outputs.migrationen }}
      journal: ${{ steps.ergebnis.outputs.journal }}
      ereignisse: ${{ steps.ergebnis.outputs.ereignisse }}
      smoke: ${{ steps.ergebnis.outputs.smoke }}
      oparl: ${{ steps.ergebnis.outputs.oparl }}
      e2e: ${{ steps.ergebnis.outputs.e2e }}
      ingestor: ${{ steps.ergebnis.outputs.ingestor }}
      audit: ${{ steps.ergebnis.outputs.audit }}
      docker: ${{ steps.ergebnis.outputs.docker }}
      codeql: ${{ steps.ergebnis.outputs.codeql }}
    steps:
      # Pull Request und Merge-Queue: Die Queue vergleicht per git mit ihrem Basisstand (merge_group.base_sha),
      # der Schritt "Geänderte Migrationstests" liest die geänderten Testdateien.
      - name: Checkout
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # some-with-excludes: Eine Datei zählt, wenn sie mindestens ein positives Muster trifft und
      # kein "!"-Muster. Neue Verzeichnisse lösen die Django-Tests deshalb im Zweifel aus.
      # In der Merge-Queue wirkt davon nur "migrationen" (und das Sicherheitsnetz dafür), sonst laufen dort alle Jobs.
      - name: Dateien des Pull Requests zuordnen
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        # Drittanbieter-Action, die über alle Prüfungen entscheidet: auf den Commit gepinnt statt auf
        # den verschiebbaren Tag. Dependabot (github-actions) hebt den Pin samt Kommentar an.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            sicherheitsnetz:
              - '.github/**'
              - 'pyproject.toml'
              - 'mandari/pyproject.toml'
              - 'mandari/uv.lock'
              - 'scripts/export_requirements.sh'
              - 'mandari/package.json'
              - 'mandari/package-lock.json'
              - 'shared/pyproject.toml'
              - 'ingestor/pyproject.toml'
              - 'ingestor/uv.lock'
            qualitaet:
              - '**'
              - '!**/*.md'
            # Link-Prüfung: Markdown-Dateien und die Einstellungen von lychee; die Vorlagen unter
            # .github/ deckt das Sicherheitsnetz ab
            verweise:
              - '**/*.md'
              - 'lychee.toml'
            python:
              - 'mandari/**/*.py'
              - 'shared/**'
              - 'scripts/mypy_allowlist.*'
            # Verträge zwischen Programmteilen: Tabellen des Ingestors und die Ereignisverträge (Schemas,
            # Hülle, Prüfskript); die Schemas sind JSON und fallen nicht unter "python"
            vertrag:
              - 'ingestor/src/**'
              - 'scripts/check_schema_contract.py'
              - 'mandari/hub/contracts/schemas/**'
              - 'mandari/hub/contracts/envelope/**'
              - 'scripts/check_event_contracts.py'
            templates:
              - 'mandari/**/templates/**'
            frontend:
              - 'mandari/frontend/**'
              - 'mandari/static/**'
              - 'mandari/vite.config.ts'
              - 'mandari/tsconfig.json'
              - 'mandari/tailwind.config.js'
              - 'mandari/biome.json'
            test:
              - '**'
              - '!**/*.md'
              - '!LICENSES/**'
              - '!docs/examples/**'
              - '!docs/prozesse/**'
              - '!loadtest/**'
              - '!ingestor/**'
              - '!mandari/tests_e2e/**'
              - '!**/Dockerfile'
              - '!.dockerignore'
              - '!mandari/docker-entrypoint.sh'
            # Job "Migrationstests" (Issue #935): Migrationen sowie Erkennung, Auswahl und Datenbankvorlage der
            # Migrationstests. Geänderte Testdateien mit Migrationstests erkennt der Schritt danach am Inhalt.
            migrationen:
              - 'mandari/**/migrations/**'
              - 'mandari/conftest.py'
              - 'mandari/apps/common/tests/testlauf.py'
              - 'scripts/testdb_vorlage.py'
            # Journal der Ereignistechnik, wie der Ingestor es kennt und beschreibt. Der Test, der seine
            # INSERT-Anweisung gegen die Tabelle aus den Django-Migrationen ausführt (Trigger,
            # Prüfbedingungen), braucht PostgreSQL und läuft deshalb nur im Job "Test"
            # (insight_core/tests/test_schema_contract.py). Diese beiden Dateien lösen ihn zusätzlich aus.
            journal:
              - 'ingestor/src/storage/models.py'
              - 'ingestor/src/storage/events.py'
            ereignisse:
              - 'mandari/apps/events/**'
              - 'mandari/apps/common/metrics.py'
              - 'mandari/mandari/settings*.py'
            smoke:
              - 'mandari/**'
              - 'shared/**'
              - 'scripts/*smoke*'
              - 'scripts/check_performance_budgets.py'
              - 'scripts/performance_budgets.json'
              - '!**/*.md'
              - '!mandari/**/tests/test_*.py'
              - '!mandari/tests_e2e/**'
              - '!mandari/Dockerfile'
              - '!mandari/docker-entrypoint.sh'
            # Beide OParl-Ausgaben samt allem, woraus sie ihre Objekte bauen (Modelle, Sichtbarkeit,
            # Demo-Daten der Testinstanz, Prüfskript)
            oparl:
              - 'mandari/hub/**'
              - 'mandari/apps/session/api/oparl.py'
              - 'mandari/apps/session/oparl_publication.py'
              - 'mandari/apps/session/models.py'
              - 'mandari/apps/session/urls.py'
              - 'mandari/apps/session/services/{file_service,insight_service,meeting_format_service,oparl_access}.py'
              - 'mandari/insight_core/models.py'
              - 'mandari/insight_core/publication.py'
              - 'mandari/insight_sync/session_mirror.py'
              - 'mandari/apps/common/management/commands/setup_demo_*.py'
              - 'mandari/apps/session/migrations/**'
              - 'mandari/insight_core/migrations/**'
              - 'shared/**'
              - 'scripts/oparl_validator.py'
              - 'scripts/_smoke_db.py'
              # Datenkatalog nach DCAT-AP.de (SHACL-Prüfung im selben Job); ein Update von rdflib kann die
              # Serialisierung ändern, deshalb auch bei geänderten Abhängigkeiten
              - 'mandari/apps/session/api/dcat.py'
              - 'scripts/dcat_shacl.py'
              - 'mandari/pyproject.toml'
              - 'mandari/uv.lock'
              - '!**/*.md'
            e2e:
              - 'mandari/**/templates/**'
              - 'mandari/frontend/**'
              - 'mandari/static/**'
              - 'mandari/vite.config.ts'
              - 'mandari/tsconfig.json'
              - 'mandari/tailwind.config.js'
              - 'mandari/tests_e2e/**'
              - 'mandari/conftest.py'
              - 'mandari/apps/common/tests/factories.py'
              - 'mandari/apps/work/tests/test_import_text.py'
              - 'mandari/mandari/**'
              - 'mandari/apps/common/csp.py'
              - 'mandari/**/middleware.py'
              - 'mandari/**/context_processors.py'
              - 'mandari/**/templatetags/**'
              - 'mandari/**/consumers.py'
              - 'mandari/**/routing.py'
              - 'mandari/apps/accounts/**'
              - 'mandari/apps/work/motions/**'
              - 'mandari/apps/common/demo.py'
              - 'mandari/apps/common/management/commands/setup_demo_*.py'
              # Views und Kontext der Seiten, die die E2E-Tests aufrufen (Alpine-Fehler in der Konsole,
              # Drehbuch): Eine fehlende Kontextvariable für x-data fällt nur im Browser auf. Ruft ein
              # E2E-Test eine neue Seite auf, gehört deren View hierher.
              - 'mandari/apps/common/mixins.py'
              - 'mandari/apps/common/views_dev.py'
              - 'mandari/apps/common/views_feedback.py'
              - 'mandari/apps/work/dashboard/views.py'
              - 'mandari/apps/work/tasks/views/{list,create}.py'
              - 'mandari/apps/work/tasks/forms.py'
              - 'mandari/apps/work/organization/views/{profile,team,roles,council,change_requests,privacy,visibility}.py'
              - 'mandari/apps/work/support/views.py'
              - 'mandari/apps/work/faction/views/{_helpers,meetings,settings}.py'
              - 'mandari/apps/work/meetings/views/{_helpers,prepare}.py'
              - 'mandari/apps/work/meetings/serializers.py'
              - 'mandari/apps/session/permissions.py'
              - 'mandari/apps/session/views/{dashboard,meetings,papers,leitstelle,applications,resolutions,protocols,allowances,cockpit}.py'
              - 'mandari/apps/session/services/cockpit_service.py'
              - 'mandari/apps/session/api/oparl.py'
              - 'mandari/insight_core/views/{_helpers,_withdrawn,home,meetings,decisions,bookmarks,questions,subscriptions}.py'
              - '!**/*.md'
              - '!mandari/apps/accounts/tests/**'
              - '!mandari/apps/work/motions/tests/**'
            ingestor:
              - 'ingestor/**'
              - 'shared/**'
              - '!**/*.md'
            audit:
              - 'scripts/export_requirements.sh'
            docker:
              - 'mandari/Dockerfile'
              - 'ingestor/Dockerfile'
              - '.dockerignore'
              - 'mandari/docker-entrypoint.sh'
              - 'ingestor/README.md'
              - 'shared/**'
              - 'mandari/frontend/**'
              - 'mandari/static/**'
              - 'mandari/vite.config.ts'
              - 'mandari/tsconfig.json'
              - 'mandari/tailwind.config.js'
            codeql_python:
              - '**/*.py'
            codeql_js:
              - '**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,html,htm,vue}'
              - 'mandari/tsconfig.json'

      # Eine geänderte Testdatei mit Migrationstests löst den Job "Migrationstests" aus. Erkannt wird sie wie in
      # apps/common/tests/testlauf.py am Aufruf von ….migrate( oder call_command("migrate"); ein Treffer zu
      # viel startet nur den Job.
      - name: Geänderte Migrationstests erkennen
        id: migrationstests
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASIS"
          geaendert=false
          while IFS= read -r -d '' datei; do
            case "$datei" in
              mandari/*test_*.py|mandari/*_test.py) ;;
              *) continue ;;
            esac
            if [ -f "$datei" ] && grep -qE '\.migrate\(|call_command\([[:space:]]*.migrate' "$datei"; then
              echo "Migrationstest geändert: $datei"
              geaendert=true
            fi
          done < <(git diff -z --name-only --no-renames "$BASIS" HEAD)
          echo "geaendert=$geaendert" >> "$GITHUB_OUTPUT"

      - name: Ergebnis festlegen (Sicherheitsnetz, CodeQL-Sprachen)
        id: ergebnis
        env:
          EREIGNIS: ${{ github.event_name }}
          ZIELZWEIG: ${{ github.base_ref }}
          FILTER: ${{ toJSON(steps.filter.outputs) }}
          MIGRATIONSTESTS: ${{ steps.migrationstests.outputs.geaendert }}
          # Schalter für den Wechsel vom CodeQL-Default-Setup auf diesen Workflow (siehe Job "codeql")
          CODEQL_ERWEITERT: ${{ vars.CODEQL_ERWEITERT }}
        # Fehlerfest: Jeder Wert muss "true" oder "false" sein. Ein leerer Wert würde Jobs still
        # überspringen und das Sammel-Ergebnis trotzdem grün lassen – daher lieber hier abbrechen.
        run: |
          set -euo pipefail
          wert() {
            local w
            w=$(jq -r --arg b "$1" '.[$b] // "false"' <<<"$FILTER")
            case "$w" in
              true|false) echo "$w" ;;
              *) echo "::error::Unerwarteter Filterwert für $1: '$w'" >&2; return 1 ;;
            esac
          }
          migrationstests="${MIGRATIONSTESTS:-false}"
          case "$migrationstests" in
            true|false) ;;
            *) echo "::error::Unerwarteter Wert für geänderte Migrationstests: '$migrationstests'" >&2; exit 1 ;;
          esac

          alle=false
          grund="Pfadfilter"
          netz=$(wert sicherheitsnetz)
          if [ "$EREIGNIS" = "merge_group" ]; then
            alle=true; grund="Merge-Queue, Migrationstests nach der Regel des Pull Requests"
          elif [ "$EREIGNIS" != "pull_request" ]; then
            alle=true; grund="Ereignis $EREIGNIS"
          elif [ "$ZIELZWEIG" = "main" ]; then
            alle=true; grund="Pull Request gegen main"
          elif [ "$netz" = "true" ]; then
            alle=true; grund=".github/ oder Abhängigkeitsdateien geändert"
          fi

          {
            echo "### Geänderte Bereiche ($grund)"
            echo "| Bereich | Job läuft |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # Migrationstests (Issue #935): im Pull Request und in der Merge-Queue nur, wenn Migrationen, Migrationstests
          # oder ihre Werkzeuge geändert sind oder das Sicherheitsnetz greift; bei jedem anderen Volllauf immer.
          regel_migrationen() {
            if [ "$netz" = "true" ] || [ "$migrationstests" = "true" ]; then echo true; else wert migrationen; fi
          }
          ergebnis() {
            if [ "$1" = "migrationen" ] && [ "$EREIGNIS" = "merge_group" ]; then
              regel_migrationen
            elif [ "$alle" = "true" ]; then
              echo true
            elif [ "$1" = "migrationen" ]; then
              regel_migrationen
            else
              wert "$1"
            fi
          }
          for bereich in qualitaet verweise python vertrag templates frontend test migrationen journal ereignisse smoke oparl e2e ingestor audit docker; do
            e=$(ergebnis "$bereich")
            echo "$bereich=$e" >> "$GITHUB_OUTPUT"
            echo "| $bereich | $e |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "${CODEQL_ERWEITERT:-}" = "true" ]; then
            py=$(ergebnis codeql_python)
            js=$(ergebnis codeql_js)
            # actions nur im Sicherheitsnetz: Workflow-Änderungen liegen unter .github/
            sprachen=$(jq -nc --argjson alle "$alle" --argjson py "$py" --argjson js "$js" \
              '[if $alle then "actions" else empty end,
                if $js then "javascript-typescript" else empty end,
                if $py then "python" else empty end]')
          else
            sprachen='[]'
            echo "::notice::CodeQL läuft noch über das Default-Setup von GitHub (Variable CODEQL_ERWEITERT nicht gesetzt)."
          fi
          echo "codeql=$sprachen" >> "$GITHUB_OUTPUT"
          echo "| CodeQL-Sprachen | \`$sprachen\` |" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Qualität: Lint, Typprüfung und Frontend-Gates in einem Job
  # ===========================================================================
  # Früher drei Jobs (Lint ~10 s, Typprüfung ~1,5 min, Frontend-Gates ~45 s); zusammen bleiben
  # sie weit unter der Laufzeit von "Test" (~8–10 min), der Lauf wird also nicht länger.
  # Die Prüfschritte laufen mit !cancelled() auch nach einem roten Schritt weiter, damit wie
  # früher alle Befunde auf einmal sichtbar sind.
  qualitaet:
    name: Qualität (Lint, Typprüfung, Frontend-Gates)
    needs: changes
    if: needs.changes.outputs.qualitaet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: mandari/uv.lock

      # --- Lint und schnelle Prüfskripte (immer, wenige Sekunden) ---------------
      - name: Install linters
        run: pip install ruff==0.14.6

      - name: Run Ruff linter
        if: ${{ !cancelled() }}
        working-directory: mandari
        run: ruff check .

      - name: Run Ruff formatter check
        if: ${{ !cancelled() }}
        working-directory: mandari
        run: ruff format --check .

      - name: Template-Kommentare prüfen (kein mehrzeiliges {# … #})
        if: ${{ !cancelled() }}
        run: python scripts/check_template_comments.py mandari/templates

      # Django verwirft Bloecke, die keine Vorlage der Kette definiert, stillschweigend; das Skript
      # darin kommt nie im Browser an (Dokument-Import, Aufgabe anlegen: 09/2026).
      - name: Template-Bloecke und Alpine-Komponenten vollstaendig
        if: ${{ !cancelled() }}
        run: |
          python scripts/check_template_blocks.py
          python scripts/check_alpine_components.py

      - name: Upload-Stellen mit gemeinsamer Pruefung (Issue 260)
        if: ${{ !cancelled() }}
        run: python scripts/check_upload_validation.py

      # Drei Stellen nannten frueher drei verschiedene Versionen. Im Advisory
      # steht dann eine Commit-Kennung statt einer Version (Release v0.10.0).
      - name: Versionsangaben stimmen ueberein
        if: ${{ !cancelled() }}
        run: python scripts/check_version_consistency.py

      - name: Jedes Smoke-Skript laeuft in der CI
        if: ${{ !cancelled() }}
        run: python scripts/check_smoke_in_ci.py

      # Schichtregeln (docs/adr/20260929-schichtenmodell.md): Vertraege in mandari/pyproject.toml duerfen
      # nur strenger werden, Ausnahmen nur weniger. import-linter nur hier (nicht im Image), Version wie
      # in pyproject.toml [dev]; grimp mit fester Version, weil es den Importgraphen baut.
      - name: Schichtregeln (import-linter, Ausnahmen duerfen nur sinken)
        if: ${{ !cancelled() }}
        run: |
          pip install "import-linter==2.15" "grimp==3.17"
          python scripts/check_import_linter_ratchet.py
          cd mandari && lint-imports --no-cache

      # Lese-Fassade des RIS-Bestands (docs/adr/20260929-kanonisches-modell.md): Direktzugriffe auf
      # OParl*.objects außerhalb von hub und insight_core dürfen je Datei nur weniger werden (Issue #522).
      - name: RIS-Bestand nur über die Lese-Fassade (Direktzugriffe dürfen nur sinken)
        if: ${{ !cancelled() }}
        run: python scripts/check_ris_access_ratchet.py

      - name: Ratchet (Inline-Skripte/-Styles, Template-Größe dürfen nicht zunehmen)
        if: ${{ !cancelled() }}
        run: python scripts/check_frontend_ratchet.py

      - name: Service-Layer-Ratchet (ORM-Zugriffe und lange Funktionen in Views dürfen nicht zunehmen, #160)
        if: ${{ !cancelled() }}
        run: python scripts/check_view_orm_ratio.py

      # --- Templates -------------------------------------------------------------
      - name: djlint (Template-Linting, Profil Django)
        if: ${{ !cancelled() && needs.changes.outputs.templates == 'true' }}
        run: |
          pip install djlint==1.46.2
          cd mandari && djlint templates --lint

      # --- Python: Typprüfung und Schema-Contract ---------------------------------
      - name: uv (Export aus mandari/uv.lock)
        if: ${{ !cancelled() && (needs.changes.outputs.python == 'true' || needs.changes.outputs.vertrag == 'true') }}
        uses: astral-sh/setup-uv@v7
      - name: Python-Abhängigkeiten (Django, mypy, SQLAlchemy)
        id: pydeps
        if: ${{ !cancelled() && (needs.changes.outputs.python == 'true' || needs.changes.outputs.vertrag == 'true') }}
        run: |
          sh scripts/export_requirements.sh /tmp/requirements.lock
          pip install -r /tmp/requirements.lock
          pip install --no-deps shared/
          # Versionen wie in pyproject [dev] – mypy-Ergebnisse unterscheiden sich zwischen Versionen
          pip install "mypy==2.3.1" "django-stubs[compatible-mypy]==6.1.1" "sqlalchemy>=2.0"
          # Test-Abhängigkeiten, damit Fixtures/Decorator in Testmodulen typisiert sind (sonst "untyped decorator")
          pip install pytest pytest-django factory-boy pytest-playwright

      - name: mypy mit Allowlist (darf nur schrumpfen)
        if: ${{ !cancelled() && steps.pydeps.outcome == 'success' && needs.changes.outputs.python == 'true' }}
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
        run: python scripts/mypy_allowlist.py

      # Früher im Job "Test"; hier läuft er auch bei reinen Ingestor-Änderungen, ohne die ganze
      # Django-Testsuite zu starten.
      - name: Schema-Contract Django ↔ Ingestor (docs/adr/20260909-schema-contract-django-ingestor.md)
        if: ${{ !cancelled() && steps.pydeps.outcome == 'success' }}
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
        run: python scripts/check_schema_contract.py

      # Ereignisverträge (docs/adr/20260929-ereignisvertraege.md, Issue #519): Jeder Ereignistyp im Code hat
      # ein Schema, bestehende Versionen ändern sich gegenüber der Zielverzweigung nur additiv, und
      # docs/EREIGNISKATALOG.md ist aus dem Register erzeugt. Basis ist der Stand, in den gemergt wird
      # (Pull Request, Merge-Queue) bzw. der vorige Stand des Zweigs (push); ohne Basis (Wochenlauf,
      # manueller Start) entfällt nur der Vergleich.
      - name: Ereignisverträge (Schema je Ereignis, nur additive Änderungen, Katalog aktuell)
        if: ${{ !cancelled() && steps.pydeps.outcome == 'success' }}
        env:
          BASIS: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASIS" ] && [ "$BASIS" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASIS"
            python scripts/check_event_contracts.py --base "$BASIS"
          else
            python scripts/check_event_contracts.py
          fi

      # Die Django-Tests zum Contract lesen den Quellbaum des Ingestors; bei Django-Änderungen
      # laufen sie ohnehin im Job "Test". Dazu gehört der Vertragstest der Ereignisse, die der
      # Ingestor ins Journal schreibt (ris.*, Schemas in mandari/hub/contracts/schemas/).
      - name: Django-Tests zum Ingestor-Contract (bei Ingestor-Änderungen)
        if: ${{ !cancelled() && steps.pydeps.outcome == 'success' && needs.changes.outputs.vertrag == 'true' }}
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
        run: >-
          cd mandari && pytest insight_core/tests/test_schema_contract.py
          hub/contracts/tests/test_ingestor_events.py -q -p no:cacheprovider

      # --- Frontend: TypeScript, Biome, Vite ---------------------------------------
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.templates == 'true') }}
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: mandari/package-lock.json

      - name: npm ci
        id: npm
        if: ${{ !cancelled() && needs.changes.outputs.frontend == 'true' }}
        run: cd mandari && npm ci --ignore-scripts

      - name: TypeScript (tsc --noEmit)
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: cd mandari && npm run typecheck

      - name: Biome (Lint + Format)
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: cd mandari && npm run lint

      - name: Frontend-Unit-Tests (Navigations-Helfer)
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: cd mandari && npm run test:navigation

      - name: Frontend-Unit-Tests (Speichern mit Wiederholung)
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: cd mandari && npm run test:speichern

      # JS-Vorlagen (z. B. der Service Worker) werden von Django gerendert; Template-Tags nur in
      # Kommentaren oder Strings, sonst kann CodeQL die Datei nicht analysieren.
      - name: JS-Vorlagen sind gültiges JavaScript
        if: ${{ !cancelled() && needs.changes.outputs.templates == 'true' }}
        run: |
          for f in $(git ls-files 'mandari/templates/*.js' 'mandari/templates/**/*.js'); do node --check "$f"; done

      - name: Vite-Build (Manifest muss entstehen)
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: |
          cd mandari && npx vite build
          test -f static/dist/manifest.json

  # ===========================================================================
  # Verweise: Link-Prüfung der Dokumentation (Issue #690)
  # ===========================================================================
  # Läuft bei Änderungen an Markdown-Dateien, die sonst keinen Job auslösen. Einstellungen in
  # lychee.toml: Die Prüfung scheitert nur an Verweisen, die nachweislich ins Leere führen (404, 410,
  # unbekannter Host); Zeitüberschreitungen, Drosselung und Serverfehler fremder Seiten gelten nach
  # mehreren Versuchen als bestanden. So wird aus einem langsamen fremden Server kein roter Lauf.
  verweise:
    name: Verweise (Link-Prüfung)
    needs: changes
    if: needs.changes.outputs.verweise == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ohne Netz: jede Datei, jedes Bild und jeder Anker, auf die eine Markdown-Datei verweist
      - name: Interne Verweise und Anker (alle Markdown-Dateien, offline)
        # Drittanbieter-Action: auf den Commit gepinnt statt auf den verschiebbaren Tag (wie
        # dorny/paths-filter). Dependabot (github-actions) hebt den Pin samt Kommentar an.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments '**/*.md'

      # Mit Netz, nur für die Dateien des öffentlichen Auftritts: README, Mitwirken, Sicherheit,
      # Verhaltenskodex, Danksagungen, Betrieb, Issue- und PR-Vorlagen. Nicht bei push auf main
      # und nicht in der Merge-Queue: Dort hat der Pull Request schon geprüft, und ein langsamer
      # fremder Server soll keinen Merge aufhalten; verwaiste Verweise findet der Wochenlauf.
      - name: Externe Verweise (öffentlicher Auftritt)
        if: ${{ !cancelled() && github.event_name != 'push' && github.event_name != 'merge_group' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md DEPENDENCIES.md DEPLOYMENT.md
            AGENTS.md docs/README.md
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/bug_report.md
            .github/ISSUE_TEMPLATE/feature_request.md
            .github/ISSUE_TEMPLATE/config.yml

  # ===========================================================================
  # Django System Checks & Tests: drei parallele Teile (Issue #935)
  # ===========================================================================
  # Jeder Teil führt ganze Testdateien aus, verteilt nach den gemessenen Laufzeiten in
  # mandari/testdauern.json (apps/common/tests/testlauf.py, --teil). Die Testdatenbank jedes
  # xdist-Workers ist eine Kopie der Vorlage, die der Job einmal migriert
  # (scripts/testdb_vorlage.py, MANDARI_TEST_DB_VORLAGE); früher migrierte jeder Worker selbst
  # (rund 150 s). Migrationstests laufen im Job "Migrationstests". Coverage-Grenze und
  # Vollständigkeit prüft "Test-Ergebnis" über alle Teile zusammen.
  test:
    name: Test
    needs: changes
    # journal: Änderungen am Journal auf der Seite des Ingestors (siehe Filter)
    if: needs.changes.outputs.test == 'true' || needs.changes.outputs.journal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Alle Teile laufen zu Ende, damit jeder rote Test auf einmal sichtbar ist
      fail-fast: false
      matrix:
        teil: [1, 2, 3]
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
      DEBUG: 'false'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Datenbank im Arbeitsspeicher: Testdaten müssen keinen Neustart überleben
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libpango1.0-dev \
            libffi-dev \
            shared-mime-info \
            pkg-config \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-deu

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: mandari/uv.lock

      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          sh scripts/export_requirements.sh /tmp/requirements.lock
          pip install -r /tmp/requirements.lock
          pip install --no-deps shared/
          pip install pytest pytest-django pytest-cov pytest-xdist factory-boy
          pip install "moto[s3]>=5.1"  # lokaler S3-Ersatz für die Tests des Objektspeichers (#788)
          pip install "sqlalchemy>=2.0"  # Schema-Contract gegen die Ingestor-Modelle

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: mandari/package-lock.json
      - name: Frontend-Assets bauen (Vite-Manifest für django-vite)
        run: cd mandari && npm ci --ignore-scripts && npx vite build

      # Einmal genügt: Die Prüfung hängt nicht vom Teil ab
      - name: Run Django system checks
        if: matrix.teil == 1
        run: |
          cd mandari
          python manage.py check --deploy --fail-level WARNING
          python manage.py check

      - name: Collect static files
        run: |
          cd mandari
          python manage.py collectstatic --noinput

      # Vorlage und Tests nutzen denselben Schlüssel (sonst zöge jeder Prozess einen eigenen)
      - name: Schlüssel der Feldverschlüsselung für diesen Job
        run: |
          schluessel=$(python -c 'import base64, secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')
          echo "::add-mask::$schluessel"
          echo "ENCRYPTION_MASTER_KEY=$schluessel" >> "$GITHUB_ENV"

      # Einmal migrieren (Test-Settings, gemessen mit coverage wie früher das Migrieren je Worker)
      - name: Testdatenbank-Vorlage migrieren
        run: python scripts/testdb_vorlage.py --coverage "$RUNNER_TEMP/testteil/coverage-vorlage.daten"

      - name: Run tests
        env:
          MANDARI_TEST_DB_VORLAGE: mandari_testvorlage
        run: |
          cd mandari
          # Parallel auf allen Kernen (pytest-xdist; je Worker eine Kopie der Vorlage), Tests einer Datei
          # bleiben auf einem Worker. --dist worksteal war im Messlauf nicht schneller und ließ zwei von der
          # Reihenfolge abhängige Tests scheitern (Issue #935). --durations zeigt die langsamsten Tests.
          # COVERAGE_CORE=sysmon braucht es nicht: coverage misst unter Python 3.14 von sich aus mit sys.monitoring.
          # Coverage-Gate (Issue #157) im Job "Test-Ergebnis" über alle Teile zusammen.
          pytest -n auto --dist loadfile -m "not migrationen" --teil=${{ matrix.teil }}/3 \
            --teil-protokoll="$RUNNER_TEMP/testteil" -q -rfE --durations=25 \
            --cov=apps --cov=hub --cov=insight_core --cov-report= --ignore=tests_e2e
          mv .coverage "$RUNNER_TEMP/testteil/coverage-teil.daten"

      - name: Protokoll und Coverage-Daten ablegen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: testteil-${{ matrix.teil }}
          path: ${{ runner.temp }}/testteil/
          retention-days: 7
          if-no-files-found: warn

  # ===========================================================================
  # Migrationstests (Issue #935)
  # ===========================================================================
  # Tests, die Migrationen zurück- und wieder vorspielen, brauchen einzeln bis zu zwei Minuten. Sie
  # tragen das Kennzeichen "migrationen" (automatisch, apps/common/tests/testlauf.py) und laufen nur
  # hier: im Pull Request und in der Merge-Queue, wenn Migrationen, Migrationstests oder deren
  # Werkzeuge geändert sind (oder das Sicherheitsnetz greift), sonst bei jedem Volllauf (push auf
  # main, manueller Start, Nacht- und Wochenlauf). Dazu das Migrieren mit den Betriebs-Settings
  # (settings.py, DEBUG aus), das früher der Job "Test" vor jedem Lauf machte.
  migrationstests:
    name: Migrationstests
    needs: changes
    if: needs.changes.outputs.migrationen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
      DEBUG: 'false'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libffi-dev shared-mime-info pkg-config poppler-utils tesseract-ocr tesseract-ocr-deu

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: mandari/uv.lock

      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          sh scripts/export_requirements.sh /tmp/requirements.lock
          pip install -r /tmp/requirements.lock
          pip install --no-deps shared/
          pip install pytest pytest-django pytest-cov pytest-xdist factory-boy
          pip install "moto[s3]>=5.1"
          pip install "sqlalchemy>=2.0"

      - name: Schlüssel der Feldverschlüsselung für diesen Job
        run: |
          schluessel=$(python -c 'import base64, secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')
          echo "::add-mask::$schluessel"
          echo "ENCRYPTION_MASTER_KEY=$schluessel" >> "$GITHUB_ENV"

      # Beide Läufe gleichzeitig, jeder in seiner Datenbank: Betriebs-Settings auf "test", Test-Settings
      # für die Vorlage der Testdatenbanken
      - name: Migrationen mit den Betriebs-Settings und Testdatenbank-Vorlage
        run: |
          (cd mandari && python manage.py migrate --noinput) > "$RUNNER_TEMP/migrate-betrieb.log" 2>&1 &
          betrieb=$!
          python scripts/testdb_vorlage.py --coverage "$RUNNER_TEMP/testteil/coverage-vorlage.daten"
          if ! wait "$betrieb"; then
            cat "$RUNNER_TEMP/migrate-betrieb.log"
            echo "::error::migrate mit den Betriebs-Settings (settings.py, DEBUG aus) ist gescheitert"
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/migrate-betrieb.log"

      - name: Migrationstests
        env:
          MANDARI_TEST_DB_VORLAGE: mandari_testvorlage
        run: |
          cd mandari
          # 23 Tests von 2 s bis 150 s: worksteal gleicht die Last zwischen den Workern während des Laufs aus
          pytest -n auto --dist worksteal -m migrationen --teil-protokoll="$RUNNER_TEMP/testteil" -q -rfE \
            --durations=0 --cov=apps --cov=hub --cov=insight_core --cov-report= --ignore=tests_e2e
          mv .coverage "$RUNNER_TEMP/testteil/coverage-migrationstests.daten"

      - name: Protokoll und Coverage-Daten ablegen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: testteil-migrationstests
          path: ${{ runner.temp }}/testteil/
          retention-days: 7
          if-no-files-found: warn

  # ===========================================================================
  # Test-Ergebnis: Coverage über alle Teile, jeder Test genau einmal (Issue #935)
  # ===========================================================================
  # Läuft, sobald "Test" nötig war, auch wenn "Migrationstests" nicht nötig war: Ohne !cancelled()
  # übersprünge GitHub diesen Job zusammen mit dem übersprungenen Migrationsjob, und die
  # Coverage-Grenze fiele still weg. "CI-Ergebnis" verlangt seinen Erfolg, wenn "Test" nötig war.
  test-ergebnis:
    name: Test-Ergebnis (Coverage, Vollständigkeit)
    needs: [changes, test, migrationstests]
    if: ${{ !cancelled() && (needs.changes.outputs.test == 'true' || needs.changes.outputs.journal == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_ERGEBNIS: ${{ needs.test.result }}
      MIGRATIONSTESTS_ERGEBNIS: ${{ needs.migrationstests.result }}
      MIGRATIONEN_NOETIG: ${{ needs.changes.outputs.migrationen }}
    steps:
      - name: Alle Teile bestanden
        run: |
          if [ "$TEST_ERGEBNIS" != "success" ]; then
            echo "::error::Mindestens ein Teil des Jobs Test ist nicht bestanden ($TEST_ERGEBNIS)."
            exit 1
          fi
          if [ "$MIGRATIONEN_NOETIG" = "true" ] && [ "$MIGRATIONSTESTS_ERGEBNIS" != "success" ]; then
            echo "::error::Der Job Migrationstests war nötig und ist nicht bestanden ($MIGRATIONSTESTS_ERGEBNIS)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Protokolle und Coverage-Daten der Teile
        uses: actions/download-artifact@v7
        with:
          pattern: testteil-*
          path: ${{ runner.temp }}/teile

      # Belegt, dass über alle Teile jeder gesammelte Test genau einmal lief, und zeigt die Zahlen je Teil
      - name: Jeder Test genau einmal (Tests je Teil)
        run: >-
          python scripts/ci_testteile.py "$RUNNER_TEMP/teile" --teile 3
          --migrationen-noetig "$MIGRATIONEN_NOETIG"
          --dauern-ausgabe "$RUNNER_TEMP/testdauern.json"
          --zusammenfassung "$GITHUB_STEP_SUMMARY"

      - name: Coverage zusammenführen und Grenze prüfen
        run: |
          pip install "coverage>=7.10"
          cd mandari
          find "$RUNNER_TEMP/teile" -name '*.daten' -print0 | xargs -0 coverage combine --data-file=.coverage
          # Coverage-Gate (Issue #157): Stand 09/2026 40 % – Schwelle darf nur steigen.
          coverage report --data-file=.coverage --fail-under=38
          coverage xml --data-file=.coverage -o coverage.xml

      # Gemessene Laufzeiten für eine neue Aufteilung (mandari/testdauern.json ersetzen) und Coverage als XML
      - name: Laufzeiten und Coverage ablegen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-ergebnis
          path: |
            ${{ runner.temp }}/testdauern.json
            mandari/coverage.xml
          retention-days: 14
          if-no-files-found: warn

  # ===========================================================================
  # Ereignistechnik hinter PgBouncer (Transaktionsmodus), Issue #505
  # ===========================================================================
  # Die Anwendung spricht die Datenbank über PgBouncer an, der Weckruf per LISTEN geht über die
  # Direktverbindung EVENTS_DB_DIRECT_URL. Läuft ohne pytest-xdist: Die Latenzmessung
  # Commit → Sicht braucht einen Cluster ohne offene Transaktionen anderer Testprozesse.
  # --reuse-db: Die Testdatenbank wird über PgBouncer angelegt; PgBouncer hält danach
  # Serververbindungen offen, ein DROP DATABASE am Ende scheiterte daran.
  events-pgbouncer:
    name: Ereignistechnik hinter PgBouncer
    needs: changes
    if: needs.changes.outputs.ereignisse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # wie deploy/roles/data.yml (Profil pgbouncer)
      pgbouncer:
        image: edoburu/pgbouncer:v1.23.1-p1
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: '*'
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_CLIENT_CONN: '200'
          DEFAULT_POOL_SIZE: '20'
        ports:
          - 6432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libffi-dev shared-mime-info pkg-config

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: mandari/uv.lock

      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          sh scripts/export_requirements.sh /tmp/requirements.lock
          pip install -r /tmp/requirements.lock
          pip install --no-deps shared/
          pip install pytest pytest-django factory-boy

      - name: PgBouncer erreichbar
        run: |
          python - <<'EOF'
          import time
          import psycopg
          for _ in range(30):
              try:
                  psycopg.connect("postgresql://test:test@localhost:6432/test", connect_timeout=3).close()
                  break
              except psycopg.OperationalError:
                  time.sleep(2)
          else:
              raise SystemExit("PgBouncer nicht erreichbar")
          EOF

      - name: apps/events über PgBouncer, Weckruf über die Direktverbindung
        env:
          DATABASE_URL: postgresql://test:test@localhost:6432/test
          EVENTS_DB_DIRECT_URL: postgresql://test:test@localhost:5432/test
          EVENTS_TEST_PGBOUNCER: '1'
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
          DEBUG: 'false'
        run: cd mandari && pytest apps/events -q -rfEs --reuse-db -p no:cacheprovider

  # ===========================================================================
  # Smoke-Tests: eigener Job, läuft parallel zu pytest
  # ===========================================================================
  smoke:
    name: Smoke-Tests
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libffi-dev shared-mime-info pkg-config poppler-utils tesseract-ocr tesseract-ocr-deu

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: mandari/uv.lock

      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          sh scripts/export_requirements.sh /tmp/requirements.lock
          pip install -r /tmp/requirements.lock
          pip install --no-deps shared/
          pip install pytest pytest-django factory-boy

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: mandari/package-lock.json
      - name: Frontend-Assets bauen (Vite-Manifest für django-vite)
        run: cd mandari && npm ci --ignore-scripts && npx vite build

      - name: Collect static files
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
          DEBUG: 'false'
        run: cd mandari && python manage.py collectstatic --noinput

      # Die Smoke-Skripte migrieren sonst jedes für sich rund 38 Sekunden lang eine frische SQLite hoch.
      # Einmal bauen, danach kopieren (scripts/_smoke_db.py); der Pfad landet über GITHUB_ENV in
      # MANDARI_SMOKE_DB_TEMPLATE. Ohne Vorlage migriert jedes Skript selbst – das machte Läufe mit
      # einem roten Test früher 40 Minuten lang, weil die Vorlage dann übersprungen wurde.
      - name: Smoke-Datenbankvorlage einmalig erzeugen
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
        run: python scripts/build_smoke_db_template.py "${{ runner.temp }}/mandari-smoke-template.sqlite3"

      # Performance-Budgets (Issue #228): Abfragen je Kernseite gegen die Lasttest-
      # Daten des Profils "klein" (generate_load_data). Budgets stehen in
      # scripts/performance_budgets.json und duerfen nur sinken; die Antwortzeit
      # ist wegen der Schwankung der Laeufer nur eine Warnung.
      - name: Performance-Budgets der Kernseiten (Abfragen hart, Zeit als Warnung)
