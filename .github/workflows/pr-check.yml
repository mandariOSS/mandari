# =============================================================================
# Mandari - CI Checks
# =============================================================================
# Runs linting, tests, and Docker build validation
# Triggered on pushes to dev/main/beta and pull requests
# =============================================================================

name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Code Quality (Linting)
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install linters
        run: pip install ruff==0.14.6

      - name: Run Ruff linter
        working-directory: mandari
        run: ruff check .

      - name: Run Ruff formatter check
        working-directory: mandari
        run: ruff format --check .

      - name: Template-Kommentare prüfen (kein mehrzeiliges {# … #})
        run: python scripts/check_template_comments.py mandari/templates

      # Django verwirft Bloecke, die keine Vorlage der Kette definiert, stillschweigend; das Skript
      # darin kommt nie im Browser an (Dokument-Import, Aufgabe anlegen: 09/2026).
      - name: Template-Bloecke und Alpine-Komponenten vollstaendig
        run: |
          python scripts/check_template_blocks.py
          python scripts/check_alpine_components.py

      - name: Upload-Stellen mit gemeinsamer Pruefung (Issue 260)
        run: python scripts/check_upload_validation.py

      # Drei Stellen nannten frueher drei verschiedene Versionen. Im Advisory
      # steht dann eine Commit-Kennung statt einer Version (Release v0.10.0).
      - name: Versionsangaben stimmen ueberein
        run: python scripts/check_version_consistency.py
      - name: Jedes Smoke-Skript laeuft in der CI
        run: python scripts/check_smoke_in_ci.py

  # ===========================================================================
  # Django System Checks & Tests
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libpango1.0-dev \
            libffi-dev \
            shared-mime-info \
            pkg-config \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-deu

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install shared/
          cd mandari
          pip install -r requirements.lock
          pip install pytest pytest-django pytest-cov factory-boy
          pip install "sqlalchemy>=2.0"  # Schema-Contract gegen die Ingestor-Modelle

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: mandari/package-lock.json
      - name: Frontend-Assets bauen (Vite-Manifest für django-vite)
        run: cd mandari && npm ci --ignore-scripts && npx vite build

      - name: Run Django system checks
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
          DEBUG: 'false'
        run: |
          cd mandari
          python manage.py check --deploy --fail-level WARNING
          python manage.py check

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
          DEBUG: 'false'
        run: |
          cd mandari
          python manage.py migrate --noinput

      - name: Collect static files
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
          DEBUG: 'false'
        run: |
          cd mandari
          python manage.py collectstatic --noinput

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
          DEBUG: 'false'
        run: |
          cd mandari
          # Coverage-Gate (Issue #157): Stand 09/2026 40 % – Schwelle darf nur steigen
          pytest -v --cov=apps --cov=insight_core --cov-report=term --cov-report=xml --cov-fail-under=38 --ignore=tests_e2e

      - name: Schema-Contract Django ↔ Ingestor (docs/adr/20260909-schema-contract-django-ingestor.md)
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
        run: python scripts/check_schema_contract.py

      # Die Smoke-Skripte migrieren sonst jedes fuer sich rund 38 Sekunden lang
      # eine frische SQLite hoch — 42-mal dasselbe Schema. Einmal bauen, danach
      # kopieren (scripts/_smoke_db.py). Der Pfad landet ueber GITHUB_ENV in
      # MANDARI_SMOKE_DB_TEMPLATE. Passt der Fingerabdruck der Migrationen
      # nicht, migriert ein Skript von selbst wieder vollstaendig.
      - name: Smoke-Datenbankvorlage einmalig erzeugen
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
        run: python scripts/build_smoke_db_template.py "${{ runner.temp }}/mandari-smoke-template.sqlite3"

      # Performance-Budgets (Issue #228): Abfragen je Kernseite gegen die Lasttest-
      # Daten des Profils "klein" (generate_load_data). Budgets stehen in
      # scripts/performance_budgets.json und duerfen nur sinken; die Antwortzeit
      # ist wegen der Schwankung der Laeufer nur eine Warnung.
      - name: Performance-Budgets der Kernseiten (Abfragen hart, Zeit als Warnung)
        if: ${{ !cancelled() }}
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
        run: python scripts/check_performance_budgets.py

      # Session-Sicherheits-Suiten (Issue #28): Tenant-Isolation,
      # OE/NOE-Sichtbarkeit und Permission-Matrix. Die Skripte setzen ihre
      # Umgebung (SQLite, Schluessel) selbst.
      - name: Session security smoke tests
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
        run: |
          python scripts/smoke_session_applications.py
          python scripts/smoke_session_audit_log.py
          python scripts/smoke_session_files.py
          python scripts/smoke_session_agenda.py
          python scripts/smoke_session_stammdaten.py
          python scripts/smoke_session_invitations.py
          python scripts/smoke_session_attendance.py
          python scripts/smoke_session_protocols.py
          python scripts/smoke_session_resolutions.py
          python scripts/smoke_session_reminders.py
          python scripts/smoke_session_calendar.py
          python scripts/smoke_session_textblocks.py
          python scripts/smoke_session_reports.py
          python scripts/smoke_session_search.py
          python scripts/smoke_session_cosign.py
          python scripts/smoke_session_voting.py
          python scripts/smoke_feedback.py
          python scripts/smoke_session_paper_workflow.py
          python scripts/smoke_session_consultations.py
          python scripts/smoke_session_oparl.py
          python scripts/smoke_insight_durchstich.py
          python scripts/smoke_faction_meetings.py

      # Work-Portal: Gastzugänge, Dokument-Freigaben und geschützte Anhänge
      # Diese 21 Skripte liefen bisher in keinem CI-Schritt; sieben davon waren
      # unbemerkt verfallen (Issue #249). Mit der Schema-Vorlage kosten sie
      # zusammen rund zwei Minuten.
      - name: Uebrige Smoke-Tests (bisher ohne CI-Abdeckung)
        if: ${{ !cancelled() }}
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
        run: |
          python scripts/smoke_admin_dashboard.py
          python scripts/smoke_collab_ai.py
          python scripts/smoke_editor_polish.py
          python scripts/smoke_insight_select.py
          python scripts/smoke_letterhead_export.py
          python scripts/smoke_meetings_rework.py
          python scripts/smoke_member_privilege.py
          python scripts/smoke_motions_status_lock.py
          python scripts/smoke_motions_tracking.py
          python scripts/smoke_oparl_api.py
          python scripts/smoke_oparl_file_size.py
          python scripts/smoke_org_logo.py
          python scripts/smoke_pdf_annotations.py
          python scripts/smoke_prepare_ui.py
          python scripts/smoke_prepare_ws_guard.py
          python scripts/smoke_pwa.py
          python scripts/smoke_session_privacy.py
          python scripts/smoke_session_terms.py
          python scripts/smoke_tombstones.py
          python scripts/smoke_url_reachability.py
          python scripts/smoke_work_idor.py

      - name: Work guest & document smoke tests
        # Auch ausführen, wenn ein vorheriger Smoke-Step rot ist (kein Verdecken)
        if: ${{ !cancelled() }}
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
        run: |
          python scripts/smoke_org_guests.py
          python scripts/smoke_document_folders.py
          python scripts/smoke_document_sharing.py
          python scripts/smoke_demo_environment.py
          python scripts/smoke_work_public_api.py
          python scripts/smoke_session_roles.py
          python scripts/smoke_ris_submission.py
          python scripts/smoke_work_decisions.py
          python scripts/smoke_insight_decisions.py
          python scripts/smoke_session_devices.py
          python scripts/smoke_session_monthly_allowances.py
          python scripts/smoke_session_allowances.py
          python scripts/smoke_session_encryption.py
          python scripts/smoke_tasks_import_export.py
          python scripts/smoke_insight_questions.py
          python scripts/smoke_admin_monitoring.py
          python scripts/smoke_file_cache.py
          python scripts/smoke_guest_notifications.py
          python scripts/smoke_guest_overview.py
          python scripts/smoke_insight_calendar.py

  # ===========================================================================
  # Docker Build Validation
  # ===========================================================================
  dependency-audit:
    name: Abhängigkeiten prüfen (pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: mandari/package-lock.json
      - name: pip-audit Django-Anwendung (blockierend bei bekannten Schwachstellen)
        run: |
          pip install pip-audit packaging
          pip-audit -r mandari/requirements.lock --no-deps --progress-spinner off
      # Installiert wird ueberall requirements.lock. Eine angehobene Grenze in
      # requirements.txt ohne neu erzeugtes Lockfile aendert nichts am Laufenden
      # und laesst beide Dateien auseinanderlaufen (Issue #241).
      - name: requirements.lock passt zu requirements.txt
        run: python scripts/check_requirements_lock.py
      - name: pip-audit Ingestor (blockierend bei bekannten Schwachstellen)
        run: |
          cd ingestor
          uv export --frozen --no-emit-project --no-emit-package mandari-oparl --no-hashes --all-extras -o /tmp/ingestor-requirements.txt
          pip-audit -r /tmp/ingestor-requirements.txt --no-deps --progress-spinner off
      - name: npm audit (blockierend ab "high")
        run: |
          cd mandari
          npm audit || true
          npm audit --audit-level=high
      - name: REUSE-Lizenzkonformität (zunächst informativ, ab 2027 blockierend)
        continue-on-error: true
        run: |
          pip install reuse
          reuse lint

  type-check:
    name: Typprüfung (mypy, Allowlist darf nur schrumpfen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Abhängigkeiten
        run: |
          pip install shared/
          pip install -r mandari/requirements.lock
          # Versionen wie in pyproject [dev] – mypy-Ergebnisse unterscheiden sich zwischen Versionen
          pip install "mypy==2.3.1" "django-stubs[compatible-mypy]==6.1.0" "sqlalchemy>=2.0"
          # Test-Abhängigkeiten, damit Fixtures/Decorator in Testmodulen typisiert sind (sonst "untyped decorator")
          pip install pytest pytest-django factory-boy pytest-playwright
      - name: mypy mit Allowlist
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
        run: python scripts/mypy_allowlist.py

  ingestor-tests:
    name: Ingestor Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Abhängigkeiten
        run: cd ingestor && uv sync --frozen --extra dev
      - name: pytest
        run: cd ingestor && uv run pytest -q
      - name: mypy (Ingestor ist bereits strikt typisiert)
        # Informativ, bis die Allowlist steht (Issue zu mypy im Epic Code-Qualität)
        run: cd ingestor && uv run mypy src --ignore-missing-imports || true

  frontend-gates:
    name: Frontend-Qualitätsgates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Ratchet (Inline-Skripte/-Styles, Template-Größe dürfen nicht zunehmen)
        run: python scripts/check_frontend_ratchet.py
      - name: Service-Layer-Ratchet (ORM-Zugriffe und lange Funktionen in Views dürfen nicht zunehmen, #160)
        run: python scripts/check_view_orm_ratio.py
      - name: djlint (Template-Linting, Profil Django)
        run: |
          pip install djlint==1.46.1
          cd mandari && djlint templates --lint
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: mandari/package-lock.json
      - name: npm ci
        run: cd mandari && npm ci --ignore-scripts
      - name: TypeScript (tsc --noEmit)
        run: cd mandari && npm run typecheck
      - name: Biome (Lint + Format)
        run: cd mandari && npm run lint
      - name: Frontend-Unit-Tests (Navigations-Helfer)
        run: cd mandari && npm run test:navigation
      - name: Vite-Build (Manifest muss entstehen)
        run: |
          cd mandari && npx vite build
          test -f static/dist/manifest.json

  e2e:
    name: E2E (Playwright, axe-core, Screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: mandari/package-lock.json
      - name: Frontend-Assets bauen
        run: cd mandari && npm ci --ignore-scripts && npm run build
      - name: Python-Abhängigkeiten
        run: |
          pip install shared/
          cd mandari
          pip install -r requirements.lock
          pip install pytest pytest-django factory-boy pytest-playwright
          python -m playwright install --with-deps chromium
      - name: E2E-Tests (Kernpfade, axe-core)
        env:
          MANDARI_E2E: '1'
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdefghijklmnopqrstuvwxyz
          DEBUG: 'false'
        run: cd mandari && pytest tests_e2e -q --browser chromium
      - name: Screenshots als Artefakt (hell/dunkel, Komponentenvorschau, Kernpfade)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: mandari/tests_e2e/screenshots/
          if-no-files-found: ignore

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build mandari image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./mandari/Dockerfile
          push: false
          cache-from: type=gha,scope=mandari
          cache-to: type=gha,scope=mandari,mode=max

      - name: Build ingestor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ingestor/Dockerfile
          push: false
          cache-from: type=gha,scope=ingestor
          cache-to: type=gha,scope=ingestor,mode=max
