# Automatische Abhängigkeits-Updates (Sicherheits- und Versions-PRs)
#
# Zielzweig ist überall `dev`: Dort wird entwickelt, `main` ist nur der
# Freigabe-Zeiger und wird per Fast-Forward nachgezogen. PRs gegen `main`
# würden die beiden Zweige auseinanderlaufen lassen.
#
# CI-Last (Issue #621): Jeder Dependabot-PR ändert Abhängigkeitsdateien und
# startet damit die volle CI. Deshalb kommt je Ökosystem höchstens ein
# gebündelter PR pro Woche (Actions und Docker: pro Monat), verteilt auf
# verschiedene Wochentage. Sicherheitsupdates kommen weiterhin sofort, aber
# ebenfalls je Ökosystem gebündelt.
#
# Python (/mandari und /ingestor): Ökosystem `uv`. Die direkten Abhängigkeiten stehen in
# pyproject.toml, die gesperrten Versionen in uv.lock; Dependabot pflegt beide Dateien im
# selben PR. Image und CI installieren ausschließlich aus uv.lock, ein Dependabot-PR prüft
# also genau das, was er ändert (Issue #682). Vorher hob Dependabot für /mandari nur die
# Untergrenzen in requirements.txt an, das Lockfile blieb alt und jeder PR scheiterte am
# Lockfile-Gate.
# Minor- und Patch-Updates kommen gebündelt, Django und seine Erweiterungen (django-*) in
# einem eigenen PR (Dependabot ordnet ein Paket der ersten passenden Gruppe zu). Major-Sprünge
# kommen einzeln, damit einer, der Nacharbeit braucht, die übrigen nicht aufhält.
# Obergrenzen in pyproject.toml schützen nicht: Dependabot weitet sie im PR auf. Was bewusst
# nicht steigen soll, steht deshalb unter `ignore` – für /mandari hält ein Test beides zusammen
# (apps/common/tests/test_abhaengigkeiten_lock.py): Jede Obergrenze und jede feste Version in
# mandari/pyproject.toml braucht dort einen passenden Eintrag.
version: 2
updates:
  - package-ecosystem: uv
    target-branch: dev
    directory: /mandari
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      django:
        patterns: ["django*"]
        update-types: [minor, patch]
      python-minor-und-patch:
        update-types: [minor, patch]
      python-sicherheit:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Django-Feature-Versionen (6.1 → 6.2) werden von Hand gehoben, zusammen mit django-stubs und
      # nach Durchsicht der Release Notes. Patch-Versionen kommen weiter über die Gruppe `django`.
      - dependency-name: django
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # SQLAlchemy läuft im Django-Image mit dem Code des Ingestors (eingebauter Abgleich); die
      # Nebenversion folgt dem Ingestor, wo sie vor der Übernahme gegen eine Datenbank verglichen wird.
      - dependency-name: sqlalchemy
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Die Hauptversion des Clients muss zur Hauptversion des Servers passen
      # (docker-compose.yml liefert Elasticsearch 8.x aus); Wechsel nur zusammen mit dem Server.
      - dependency-name: elasticsearch
        update-types: ["version-update:semver-major"]
      # Werkzeuge mit fester Version: Dieselbe Version steht in pr-check.yml und teils in
      # .pre-commit-config.yaml. Ein PR, der nur pyproject.toml anhebt, ließe die Stellen
      # auseinanderlaufen; diese Versionen werden an allen Stellen zusammen von Hand gehoben.
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: django-stubs
      - dependency-name: djlint
      - dependency-name: import-linter
    labels: [dependencies]
  - package-ecosystem: uv
    target-branch: dev
    directory: /ingestor
    schedule:
      interval: weekly
      day: tuesday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      # SQLAlchemy kommt als eigener PR (Dependabot ordnet ein Paket der ersten passenden Gruppe zu):
      # Minor-Versionen ändern Verhalten (2.1: greenlet nur noch über das Extra) und werden vor der
      # Übernahme gegen eine echte Datenbank verglichen, siehe Kommentar in ingestor/pyproject.toml.
      sqlalchemy:
        patterns: ["sqlalchemy"]
      ingestor-minor-und-patch:
        update-types: [minor, patch]
      ingestor-sicherheit:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies, app:ingestor]
  - package-ecosystem: npm
    target-branch: dev
    directory: /mandari
    schedule:
      interval: weekly
      day: wednesday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      npm-minor-und-patch:
        update-types: [minor, patch]
      # TipTap und Yjs nur gemeinsam anheben; ihre minor/patch-Updates stecken
      # schon in npm-minor-und-patch, hier landen nur die Major-Sprünge.
      tiptap-major:
        patterns: ["@tiptap/*", "y-*", "yjs"]
        update-types: [major]
      npm-sicherheit:
        applies-to: security-updates
        patterns: ["*"]
    labels: [dependencies]
  - package-ecosystem: github-actions
    target-branch: dev
    directory: /
    schedule:
      interval: monthly
    # Actions sind auf Major-Tags gepinnt, Updates sind also fast immer Majors
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
  # Beide Images bauen auf demselben Python-Basis-Image auf und wandern gemeinsam
  # (ein PR für beide Verzeichnisse, deshalb auch das Label app:ingestor)
  - package-ecosystem: docker
    target-branch: dev
    directories:
      - /mandari
      - /ingestor
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
    labels: [dependencies, app:ingestor]
